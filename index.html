<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NMR - ניהול פרויקטים</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://unpkg.com/docx@7.1.0/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; direction: rtl; }
        .container { max-width: 600px; margin: auto; }
        input, button, select { padding: 10px; margin: 5px; width: calc(100% - 10px); box-sizing: border-box; }
        button { background-color: #4CAF50; color: white; border: none; cursor: pointer; }
        
        /* מחשבון מקומי עיצוב נקי */
        .calc-box { border: 1px solid #ddd; padding: 10px; margin-top: 10px; }
        .calc-display { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 1.2em; margin-bottom: 5px; }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        .calc-btn { background-color: #f2f2f2; color: black; border: 1px solid #ccc; width: auto; padding: 15px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 12px; }
        th, td { border: 1px solid #ddd; padding: 6px; text-align: right; }
        th { background-color: #f2f2f2; }
        .delete-btn { background-color: #f44336; width: auto; padding: 5px; font-size: 10px; }
        .edit-btn { background-color: #2196F3; width: auto; padding: 5px; font-size: 10px; }
        .offer-btn { background-color: #ff9800; width: auto; padding: 5px; font-size: 10px; }
    </style>
</head>
<body>

<div class="container" id="app">טוען...</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBb-7PPYP2GFIPMVnMlJRT2U5jBxDsg_vM",
        authDomain: "nmr-projects.firebaseapp.com",
        projectId: "nmr-projects",
        appId: "1:780228662939:web:48931d5bccaa568b66583e"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    firebase.auth().onAuthStateChanged(user => {
        if(user) renderDashboard();
        else renderLogin();
    });

    function renderLogin() {
        document.getElementById('app').innerHTML = `
            <h2>כניסה למערכת</h2>
            <input type="email" id="email" placeholder="אימייל">
            <input type="password" id="password" placeholder="סיסמה">
            <button onclick="login()">התחבר</button>
        `;
    }

    async function login() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        try { await firebase.auth().signInWithEmailAndPassword(email, pass); } catch(e) { alert("שגיאה"); }
    }

    function renderDashboard() {
        document.getElementById('app').innerHTML = `
            <h2>NMR ניהול פרויקטים</h2>
            
            <input type="text" id="pName" placeholder="שם הפרויקט">
            <input type="number" id="pCost" placeholder="עלות">
            <input type="number" id="pPrice" placeholder="מחיר">
            <button onclick="addProject()">הוסף פרויקט</button>
            
            <div class="calc-box">
                <h4>מחשבון</h4>
                <div class="calc-display" id="calcDisplay">0</div>
                <div class="calc-grid">
                    <button class="calc-btn" onclick="calcInput('7')">7</button>
                    <button class="calc-btn" onclick="calcInput('8')">8</button>
                    <button class="calc-btn" onclick="calcInput('9')">9</button>
                    <button class="calc-btn" onclick="calcInput('/')">/</button>
                    <button class="calc-btn" onclick="calcInput('4')">4</button>
                    <button class="calc-btn" onclick="calcInput('5')">5</button>
                    <button class="calc-btn" onclick="calcInput('6')">6</button>
                    <button class="calc-btn" onclick="calcInput('*')">×</button>
                    <button class="calc-btn" onclick="calcInput('1')">1</button>
                    <button class="calc-btn" onclick="calcInput('2')">2</button>
                    <button class="calc-btn" onclick="calcInput('3')">3</button>
                    <button class="calc-btn" onclick="calcInput('-')">-</button>
                    <button class="calc-btn" onclick="calcInput('0')">0</button>
                    <button class="calc-btn" onclick="calcInput('.')">.</button>
                    <button class="calc-btn" onclick="calcClear()">C</button>
                    <button class="calc-btn" style="background:#4CAF50" onclick="calcEquals()">=</button>
                    <button class="calc-btn" onclick="calcInput('+')">+</button>
                </div>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th>שם</th>
                        <th>עלות</th>
                        <th>מחיר</th>
                        <th>רווח</th>
                        <th>סטטוס</th>
                        <th>פעולות</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
            <button onclick="firebase.auth().signOut()" style="background:gray; margin-top:20px;">התנתק</button>
        `;
        loadProjects();
    }

    // לוגיקה מחשבון
    let currentCalc = "";
    function calcInput(val) { currentCalc += val; document.getElementById('calcDisplay').innerText = currentCalc; }
    function calcClear() { currentCalc = ""; document.getElementById('calcDisplay').innerText = "0"; }
    function calcEquals() { try { currentCalc = eval(currentCalc).toString(); document.getElementById('calcDisplay').innerText = currentCalc; } catch(e) { calcClear(); } }

    async function addProject() {
        const name = document.getElementById('pName').value;
        const cost = document.getElementById('pCost').value;
        const price = document.getElementById('pPrice').value;
        if (name && price) {
            await db.collection("projects").add({
                name, cost, price, profit: price - cost, status: 'בתהליך', date: new Date()
            });
            renderDashboard();
        }
    }

    async function loadProjects() {
        const snapshot = await db.collection("projects").orderBy("date", "desc").get();
        const body = document.getElementById('tableBody');
        body.innerHTML = "";
        snapshot.forEach(doc => {
            const p = doc.data();
            body.innerHTML += `
                <tr>
                    <td>${p.name}</td>
                    <td>${p.cost || 0}</td>
                    <td>${p.price}</td>
                    <td>${p.price - (p.cost || 0)}</td>
                    <td>${p.status || 'בתהליך'}</td>
                    <td>
                        <button class="delete-btn" onclick="deleteP('${doc.id}')">X</button>
                        <button class="edit-btn" onclick="editStatus('${doc.id}')">E</button>
                        <button class="offer-btn" onclick="exportWord('${p.name}', ${p.price})">O</button>
                    </td>
                </tr>
            `;
        });
    }

    async function deleteP(id) { if(confirm("למחוק?")) { await db.collection("projects").doc(id).delete(); loadProjects(); } }
    async function editStatus(id) {
        const ns = prompt("סטטוס חדש (בתהליך/סיום):");
        if(ns) { await db.collection("projects").doc(id).update({status: ns}); loadProjects(); }
    }

    function exportWord(name, price) {
        const doc = new docx.Document({
            sections: [{
                children: [
                    new docx.Paragraph({ text: "NMR הצעת מחיר", heading: docx.HeadingLevel.HEADING_1 }),
                    new docx.Paragraph({ text: `לכבוד: ${name}` }),
                    new docx.Paragraph({ text: `סה"כ: ${price} ₪` })
                ],
            }],
        });
        docx.Packer.toBlob(doc).then(blob => saveAs(blob, `NMR_${name}.docx`));
    }
</script>
</body>
</html>
