<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NMR - Mobile Fix</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        body { background: #05070a; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { background: #111827; padding: 30px; border-radius: 20px; width: 90%; max-width: 350px; text-align: center; border: 1px solid #1f2937; }
        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: 1px solid #374151; background: #030712; color: white; font-size: 16px; }
        button { width: 100%; padding: 15px; background: #00f2ff; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; color: black; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="box">
            <h2 style="color:#00f2ff">N.M.R LOGIN</h2>
            <input type="email" id="email" placeholder="אימייל" spellcheck="false">
            <input type="password" id="pass" placeholder="סיסמה">
            <button onclick="login()">כניסה למערכת</button>
            <p id="msg" style="color:red; font-size:12px; margin-top:10px;"></p>
        </div>
    </div>

    <script>
        const config = { 
            apiKey: "AIzaSyBb-7PPYP2GFIPMVnMlJRT2U5jBxDsg_vM", 
            authDomain: "nmr-projects.firebaseapp.com", 
            projectId: "nmr-projects", 
            appId: "1:780228662939:web:48931d5bccaa568b66583e" 
        };
        firebase.initializeApp(config);

        async function login() {
            const e = document.getElementById('email').value.trim().toLowerCase();
            const p = document.getElementById('pass').value.trim();
            const msg = document.getElementById('msg');
            
            try {
                // הגדרה שההתחברות תישמר גם כשסוגרים את הדפדפן בטלפון
                await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);
                await firebase.auth().signInWithEmailAndPassword(e, p);
                alert("מחובר בהצלחה! רענן את הדף.");
                location.reload();
            } catch(err) {
                msg.innerText = "שגיאה: " + err.message;
            }
        }

        firebase.auth().onAuthStateChanged(user => {
            if(user) document.body.innerHTML = `<h1 style="color:#00f2ff; text-align:center;">ברוך הבא רן!<br>המערכת פעילה.</h1>`;
        });
    </script>
</body>
</html>
