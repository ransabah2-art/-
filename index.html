<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>נ.מ.ר - NEXT GEN AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg: #05070a;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent: #00f2ff;
            --secondary: #7000ff;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --green: #00ff9d;
            --red: #ff4b5c;
            --radius-lg: 24px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Heebo', sans-serif; }
        body { background: radial-gradient(circle at top right, #0a0f1d, #05070a); color: var(--text); direction: rtl; min-height: 100vh; }

        .glass-card { background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 15px; }

        #auth-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 25px; }
        #app-content { display: none; }

        header { padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: 900; background: linear-gradient(to right, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .nav-tabs { display: flex; overflow-x: auto; margin: 0 15px 20px; background: rgba(255,255,255,0.02); padding: 5px; border-radius: 20px; gap: 5px; scrollbar-width: none; }
        .tab { flex: 1; min-width: 80px; padding: 10px; text-align: center; border-radius: 15px; font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer; white-space: nowrap; }
        .tab.active { background: var(--accent); color: #000; }

        main { padding: 0 15px 120px; max-width: 600px; margin: 0 auto; }
        .page { display: none; animation: fadeIn 0.4s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        input, select, textarea { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 16px; padding: 15px; color: white; margin-bottom: 10px; outline: none; }
        .btn-main { background: var(--accent); color: #000; padding: 16px; border-radius: 16px; border: none; font-weight: 900; width: 100%; cursor: pointer; }

        /* AI Chat Styles */
        #ai-chat-box { height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; padding: 10px; }
        .msg { padding: 12px 16px; border-radius: 18px; max-width: 85%; font-size: 14px; }
        .msg.user { background: var(--secondary); align-self: flex-start; color: white; }
        .msg.ai { background: var(--glass-border); align-self: flex-end; color: var(--text); border-bottom-right-radius: 4px; }

        /* Project Cards */
        .progress-bar { height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; margin: 10px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent); transition: 1s; }
        .image-strip { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; }
        .image-strip img { width: 90px; height: 90px; border-radius: 12px; object-fit: cover; }

        /* Floating Widgets */
        #calc-bubble { position: fixed; left: 20px; bottom: 30px; width: 55px; height: 55px; background: var(--secondary); border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 22px; z-index: 100; box-shadow: 0 0 20px rgba(112,0,255,0.3); }
        #calculator { display: none; position: fixed; left: 20px; bottom: 95px; width: 260px; background: #0d1117; border: 1px solid var(--secondary); border-radius: 20px; padding: 15px; z-index: 100; }
        .fab { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #fff; color: #000; padding: 14px 28px; border-radius: 40px; font-weight: 900; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 90; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="glass-card" style="width:100%; max-width:380px; text-align:center;">
        <div class="logo" style="font-size:40px; margin-bottom:10px;">N.M.R</div>
        <input type="email" id="login-email" placeholder="אימייל">
        <input type="password" id="login-pass" placeholder="סיסמה">
        <button class="btn-main" onclick="handleAuth('login')">כניסה</button>
        <button style="background:none; border:none; color:var(--text-muted); margin-top:15px; font-size:12px;" onclick="handleAuth('signup')">הרשמה חדשה</button>
    </div>
</div>

<div id="app-content">
    <header>
        <div class="logo">N.M.R <span style="font-size:12px; color:var(--text-muted);">PROJECTS</span></div>
        <button onclick="logout()" style="background:none; border:none; color:var(--red); font-weight:700; font-size:12px;">התנתק</button>
    </header>

    <div class="nav-tabs">
        <div class="tab active" id="t-dash" onclick="showPage('dash')">📊 דשבורד</div>
        <div class="tab" id="t-projs" onclick="showPage('projs')">📋 פרויקטים</div>
        <div class="tab" id="t-quote" onclick="showPage('quote')">📄 הצעות</div>
        <div class="tab" id="t-ai" onclick="showPage('ai')">✨ היועץ AI</div>
    </div>

    <main>
        <div class="page active" id="p-dash">
            <div class="admin-only" style="display:none;">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:15px;">
                    <div class="glass-card">
                        <div style="font-size:11px; color:var(--text-muted);">רווח נקי</div>
                        <div style="font-size:22px; font-weight:900; color:var(--green);" id="total-profit">₪0</div>
                    </div>
                    <div class="glass-card">
                        <div style="font-size:11px; color:var(--text-muted);">הוצאות</div>
                        <div style="font-size:22px; font-weight:900; color:var(--red);" id="total-costs">₪0</div>
                    </div>
                </div>
            </div>
            <div class="glass-card" style="text-align:center;">
                <div style="font-size:11px; color:var(--text-muted);">פרויקטים פעילים</div>
                <div style="font-size:32px; font-weight:900;" id="count-active">0</div>
            </div>
        </div>

        <div class="page" id="p-projs">
            <div id="project-list"></div>
        </div>

        <div class="page" id="p-quote">
            <div class="glass-card">
                <input type="text" id="q-client" placeholder="שם הלקוח">
                <textarea id="q-work" rows="3" placeholder="תיאור העבודה..."></textarea>
                <input type="number" id="q-price" placeholder="מחיר (₪)">
                <button class="btn-main" onclick="generateQuote()">הפק הצעה מעוצבת</button>
            </div>
            <div id="quote-result" style="display:none; background:white; color:black; padding:20px; border-radius:20px; margin-top:15px;"></div>
        </div>

        <div class="page" id="p-ai">
            <div class="glass-card">
                <div id="ai-chat-box">
                    <div class="msg ai">שלום רן, אני היועץ של נ.מ.ר. איך אני יכול לעזור לך היום בשטח?</div>
                </div>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="ai-input" placeholder="שאל אותי משהו..." style="margin-bottom:0;">
                    <button onclick="askAI()" style="background:var(--accent); border:none; padding:15px; border-radius:15px; cursor:pointer;">🚀</button>
                </div>
            </div>
        </div>
    </main>

    <div id="calc-bubble" onclick="toggleCalc()">🧮</div>
    <div id="calculator">
        <div id="calc-display" style="background:#000; padding:10px; border-radius:10px; margin-bottom:10px; text-align:left; font-size:20px; color:var(--green);">0</div>
        <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:8px;">
            <button class="btn-main" style="padding:10px; background:#333; color:#fff;" onclick="clearCalc()">C</button>
            <button class="btn-main" style="padding:10px; background:var(--secondary); color:#fff;" onclick="pressCalc('/')">/</button>
            <button class="btn-main" style="padding:10px; background:var(--secondary); color:#fff;" onclick="pressCalc('*')">×</button>
            <button class="btn-main" style="padding:10px; background:var(--secondary); color:#fff;" onclick="pressCalc('-')">-</button>
            <button class="btn-main" style="padding:10px; background:#222; color:#fff;" onclick="pressCalc('7')">7</button>
            <button class="btn-main" style="padding:10px; background:#222; color:#fff;" onclick="pressCalc('8')">8</button>
            <button class="btn-main" style="padding:10px; background:#222; color:#fff;" onclick="pressCalc('9')">9</button>
            <button class="btn-main" style="padding:10px; background:var(--secondary); color:#fff;" onclick="pressCalc('+')">+</button>
            <button class="btn-main" style="padding:10px; background:var(--accent); color:#000; grid-column: span 2;" onclick="solveCalc()">=</button>
            <button class="btn-main" style="padding:10px; background:#222; color:#fff;" onclick="pressCalc('0')">0</button>
            <button class="btn-main" style="padding:10px; background:#222; color:#fff;" onclick="pressCalc('.')">.</button>
        </div>
    </div>

    <button class="fab" id="fab" onclick="openModal()">＋ פרויקט חדש</button>
</div>

<div id="modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:200; align-items:center; justify-content:center; padding:20px;">
    <div class="glass-card" style="width:100%; max-width:400px; background:#0d1117;">
        <h3>פרויקט חדש</h3><br>
        <input type="text" id="new-name" placeholder="שם הפרויקט">
        <select id="new-status"><option value="ביצוע">בביצוע</option><option value="הושלם">הושלם</option></select>
        <input type="number" id="new-prog" placeholder="% התקדמות">
        <div class="admin-only">
            <input type="number" id="new-income" placeholder="הכנסה (₪)">
            <input type="number" id="new-costs" placeholder="הוצאות (₪)">
        </div>
        <button class="btn-main" onclick="saveProject()">שמור</button>
        <button style="background:none; border:none; color:var(--text-muted); width:100%; margin-top:10px;" onclick="closeModal()">ביטול</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBb-7PPYP2GFIPMVnMlJRT2U5jBxDsg_vM",
        authDomain: "nmr-projects.firebaseapp.com",
        projectId: "nmr-projects",
        storageBucket: "nmr-projects.firebasestorage.app",
        messagingSenderId: "780228662939",
        appId: "1:780228662939:web:48931d5bccaa568b66583e"
    };

    const IMGBB_KEY = "7b48854ed8b84c2bfe8932316528448c";
    const GEMINI_KEY = "AIzaSyDBoI8k8TZTfqVcd7_zpP70vjWYQp1R0lw"; // המפתח שלך
    const ADMIN_EMAIL = "ransabah2@gmail.com";

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
            if (user.email === ADMIN_EMAIL) document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
            loadProjects();
        } else {
            document.getElementById('auth-screen').style.display = 'flex';
            document.getElementById('app-content').style.display = 'none';
        }
    });

    async function handleAuth(type) {
        const email = document.getElementById('login-email').value;
        const pass = document.getElementById('login-pass').value;
        if (type === 'login') await auth.signInWithEmailAndPassword(email, pass);
        else await auth.createUserWithEmailAndPassword(email, pass);
    }

    function logout() { auth.signOut(); }

    function showPage(p) {
        document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('p-'+p).classList.add('active');
        document.getElementById('t-'+p).classList.add('active');
        document.getElementById('fab').style.display = (p === 'projs' || p === 'dash') ? 'block' : 'none';
    }

    async function askAI() {
        const input = document.getElementById('ai-input');
        const chatBox = document.getElementById('ai-chat-box');
        if (!input.value) return;

        const userMsg = input.value;
        input.value = '';
        chatBox.innerHTML += `<div class="msg user">${userMsg}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `אתה עוזר אישי למנהל פרויקטים בשם רן מחברת נ.מ.ר. ענה בקיצור ובצורה מקצועית בעברית. השאלה: ${userMsg}` }] }]
                })
            });
            const data = await response.json();
            const aiText = data.candidates[0].content.parts[0].text;
            chatBox.innerHTML += `<div class="msg ai">${aiText}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        } catch (e) {
            chatBox.innerHTML += `<div class="msg ai">סליחה רן, יש לי תקלה קטנה בחיבור.</div>`;
        }
    }

    // שאר הלוגיקה של הפרויקטים והמחשבון (דומה לקוד הקודם אך מותאם לעיצוב)
    function openModal() { document.getElementById('modal').style.display = 'flex'; }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    async function saveProject() {
        await db.collection('projects').add({
            name: document.getElementById('new-name').value,
            status: document.getElementById('new-status').value,
            prog: Number(document.getElementById('new-prog').value) || 0,
            income: Number(document.getElementById('new-income').value) || 0,
            costs: Number(document.getElementById('new-costs').value) || 0,
            images: [],
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        closeModal();
    }

    async function uploadToImgBB(id, file) {
        let fd = new FormData(); fd.append("image", file);
        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: "POST", body: fd });
        const json = await res.json();
        await db.collection('projects').doc(id).update({ images: firebase.firestore.FieldValue.arrayUnion(json.data.url) });
    }

    function loadProjects() {
        db.collection('projects').orderBy('timestamp', 'desc').onSnapshot(snap => {
            let html = ''; let prof = 0; let cost = 0; let active = 0;
            snap.forEach(doc => {
                const p = doc.data(); const id = doc.id;
                if(p.status === 'ביצוע') active++;
                prof += (p.income - p.costs); cost += p.costs;
                let imgs = (p.images || []).map(i => `<img src="${i}" onclick="window.open('${i}')">`).join('');
                html += `
                <div class="glass-card">
                    <div style="display:flex; justify-content:space-between;"><b>${p.name}</b> <small>${p.status}</small></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:${p.prog}%"></div></div>
                    <div class="image-strip">${imgs}</div>
                    <label style="color:var(--accent); font-size:12px; cursor:pointer;">📷 הוסף תמונה<input type="file" style="display:none" onchange="uploadToImgBB('${id}', this.files[0])"></label>
                </div>`;
            });
            document.getElementById('project-list').innerHTML = html;
            document.getElementById('count-active').innerText = active;
            document.getElementById('total-profit').innerText = '₪' + prof.toLocaleString();
            document.getElementById('total-costs').innerText = '₪' + cost.toLocaleString();
        });
    }

    // מחשבון
    let cv = "0";
    function toggleCalc() { let c = document.getElementById('calculator'); c.style.display = (c.style.display==='block')?'none':'block'; }
    function pressCalc(v) { if(cv==="0") cv=v; else cv+=v; document.getElementById('calc-display').innerText = cv; }
    function clearCalc() { cv="0"; document.getElementById('calc-display').innerText="0"; }
    function solveCalc() { try { cv=eval(cv).toString(); document.getElementById('calc-display').innerText=cv; } catch(e){ cv="Error"; } }

    function generateQuote() {
        const c = document.getElementById('q-client').value;
        const p = Number(document.getElementById('q-price').value);
        const t = Math.round(p * 1.18);
        document.getElementById('quote-result').style.display = 'block';
        document.getElementById('quote-result').innerHTML = `<h3>הצעת מחיר: נ.מ.ר</h3><hr><p>לקוח: ${c}</p><p>${document.getElementById('q-work').value}</p><hr><h4>סה"כ כולל מע"מ: ₪${t.toLocaleString()}</h4>`;
    }
</script>
</body>
</html>
