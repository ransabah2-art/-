<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בנייה פרו — ניהול עסק</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #222536;
    --border: #2e3147;
    --accent: #f5a623;
    --accent2: #e8873a;
    --text: #eef0f8;
    --text-muted: #7b7f9e;
    --green: #27c985;
    --blue: #4c8ef7;
    --red: #f26464;
    --yellow: #f5c842;
    --radius: 16px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Heebo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    direction: rtl;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo { display: flex; align-items: center; gap: 10px; }

  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  .logo-text { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }
  .logo-text span { color: var(--accent); }
  .header-actions { display: flex; gap: 10px; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 10px 18px;
    border-radius: var(--radius-sm);
    border: none;
    font-family: 'Heebo', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s ease;
    white-space: nowrap;
  }

  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #111; }
  .btn-primary:hover { opacity: 0.88; transform: translateY(-1px); }
  .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-sm { padding: 7px 13px; font-size: 13px; }
  .btn-icon { padding: 10px; }

  main { padding: 24px 20px; max-width: 640px; margin: 0 auto; }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 28px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
  }

  .stat-num { font-size: 26px; font-weight: 800; color: var(--accent); line-height: 1; margin-bottom: 4px; }
  .stat-label { font-size: 11px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }

  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .section-title { font-size: 17px; font-weight: 700; }

  .projects-list { display: flex; flex-direction: column; gap: 10px; }

  .project-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: border-color 0.18s;
    animation: fadeIn 0.3s ease;
  }

  .project-card:hover { border-color: var(--accent); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .project-color { width: 4px; border-radius: 4px; align-self: stretch; flex-shrink: 0; }
  .project-info { flex: 1; min-width: 0; }
  .project-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .project-meta { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge-active { background: rgba(39,201,133,0.15); color: var(--green); }
  .badge-pending { background: rgba(245,200,66,0.15); color: var(--yellow); }
  .badge-done { background: rgba(76,142,247,0.15); color: var(--blue); }
  .badge-paused { background: rgba(123,127,158,0.15); color: var(--text-muted); }

  .project-actions { display: flex; gap: 6px; flex-shrink: 0; }

  .progress-wrap { margin-top: 8px; height: 4px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
  .progress-bar { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 0.4s ease; }

  .empty-state { text-align: center; padding: 48px 20px; color: var(--text-muted); }
  .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 15px; }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    z-index: 200;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  .overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px 24px 0 0;
    padding: 28px 22px 36px;
    width: 100%;
    max-width: 640px;
    transform: translateY(30px);
    transition: transform 0.3s ease;
    max-height: 92vh;
    overflow-y: auto;
  }

  .overlay.open .modal { transform: translateY(0); }

  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  .modal-title { font-size: 20px; font-weight: 800; }

  .close-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .close-btn:hover { color: var(--text); border-color: var(--text-muted); }

  .form-group { margin-bottom: 16px; }

  label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 7px; text-transform: uppercase; letter-spacing: 0.4px; }

  input, select, textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    color: var(--text);
    font-family: 'Heebo', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.18s;
    direction: rtl;
  }

  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 90px; }
  select option { background: var(--surface2); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .quote-preview {
    background: #fff;
    color: #1a1a1a;
    border-radius: var(--radius);
    padding: 28px;
    margin-top: 20px;
    font-family: 'Heebo', sans-serif;
    direction: rtl;
  }

  .quote-preview-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 2px solid #f0f0f0; }
  .quote-company { font-size: 20px; font-weight: 900; color: #111; }
  .quote-company span { color: #e07b1a; }
  .quote-date { font-size: 12px; color: #888; margin-top: 4px; }
  .quote-to { margin-bottom: 20px; }
  .quote-to-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .quote-to-name { font-size: 18px; font-weight: 700; color: #111; }
  .quote-desc-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .quote-desc { font-size: 14px; color: #333; line-height: 1.6; margin-bottom: 24px; }

  .quote-price-row {
    background: #f8f8f8;
    border-radius: 10px;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .quote-price-label { font-size: 14px; color: #555; font-weight: 600; }
  .quote-price-val { font-size: 26px; font-weight: 900; color: #111; }
  .quote-price-sub { font-size: 11px; color: #888; }
  .quote-footer { font-size: 11px; color: #aaa; text-align: center; border-top: 1px solid #f0f0f0; padding-top: 14px; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: var(--green);
    color: #0d2318;
    font-weight: 700;
    font-size: 14px;
    padding: 12px 22px;
    border-radius: 30px;
    z-index: 999;
    transition: transform 0.3s ease;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (min-width: 500px) {
    main { padding: 32px 24px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🏗️</div>
    <div class="logo-text">בנייה<span>פרו</span></div>
  </div>
  <div class="header-actions">
    <button class="btn btn-ghost btn-sm" onclick="openQuoteModal()">📄 הצעת מחיר</button>
    <button class="btn btn-primary btn-sm" onclick="openProjectModal()">＋ פרויקט</button>
  </div>
</header>

<main>
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-num" id="statTotal">0</div>
      <div class="stat-label">פרויקטים</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statActive" style="color:var(--green)">0</div>
      <div class="stat-label">פעילים</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statDone" style="color:var(--blue)">0</div>
      <div class="stat-label">הושלמו</div>
    </div>
  </div>

  <div class="section-header">
    <div class="section-title">📋 פרויקטים</div>
  </div>

  <div class="projects-list" id="projectsList">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🏚️</div>
      <p>אין פרויקטים עדיין.<br>לחץ על ״＋ פרויקט״ כדי להתחיל.</p>
    </div>
  </div>
</main>

<!-- MODAL: ADD PROJECT -->
<div class="overlay" id="projectOverlay" onclick="handleOverlayClick(event,'projectOverlay')">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">פרויקט חדש</div>
      <button class="close-btn" onclick="closeModal('projectOverlay')">✕</button>
    </div>
    <div class="form-group">
      <label>שם הפרויקט</label>
      <input type="text" id="projName" placeholder="לדוגמה: בניית וילה בנתניה">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>סטטוס</label>
        <select id="projStatus">
          <option value="active">פעיל</option>
          <option value="pending">ממתין</option>
          <option value="paused">מושהה</option>
          <option value="done">הושלם</option>
        </select>
      </div>
      <div class="form-group">
        <label>% התקדמות</label>
        <input type="number" id="projProgress" min="0" max="100" placeholder="0–100" value="0">
      </div>
    </div>
    <div class="form-group">
      <label>כמות עבודה / תיאור</label>
      <input type="text" id="projWork" placeholder="לדוגמה: 120 ימי עבודה | שלב א׳">
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:4px" onclick="addProject()">הוסף פרויקט</button>
  </div>
</div>

<!-- MODAL: QUOTE -->
<div class="overlay" id="quoteOverlay" onclick="handleOverlayClick(event,'quoteOverlay')">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">📄 הצעת מחיר</div>
      <button class="close-btn" onclick="closeModal('quoteOverlay')">✕</button>
    </div>

    <div id="quoteForm">
      <div class="form-group">
        <label>שם לקוח</label>
        <input type="text" id="qClient" placeholder="ישראל ישראלי">
      </div>
      <div class="form-group">
        <label>תיאור העבודה</label>
        <textarea id="qDesc" placeholder="תיאור מפורט של העבודה המבוצעת..."></textarea>
      </div>
      <div class="form-group">
        <label>מחיר לפני מע״מ (₪)</label>
        <input type="number" id="qPrice" placeholder="50000">
      </div>
      <div style="display:flex;gap:10px;margin-top:4px">
        <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="generateQuote()">צור הצעה</button>
        <button class="btn btn-ghost" style="flex:1;justify-content:center" onclick="clearQuoteForm()">נקה</button>
      </div>
    </div>

    <div id="quotePreviewWrap" style="display:none">
      <div class="quote-preview" id="quotePreview"></div>
      <div style="display:flex;gap:10px;margin-top:14px">
        <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="copyQuote()">📋 העתק ושתף</button>
        <button class="btn btn-ghost" style="flex:1;justify-content:center" onclick="showQuoteForm()">✏️ ערוך</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast">✓ הועתק בהצלחה!</div>

<script>
  let projects = JSON.parse(localStorage.getItem('bpProjects') || '[]');

  const statusMap = {
    active:  { label: 'פעיל',  cls: 'badge-active',  color: '#27c985' },
    pending: { label: 'ממתין', cls: 'badge-pending', color: '#f5c842' },
    done:    { label: 'הושלם', cls: 'badge-done',    color: '#4c8ef7' },
    paused:  { label: 'מושהה', cls: 'badge-paused',  color: '#7b7f9e' },
  };

  function save() { localStorage.setItem('bpProjects', JSON.stringify(projects)); }

  function render() {
    const list = document.getElementById('projectsList');
    const cards = projects.map((p, i) => {
      const s = statusMap[p.status] || statusMap.pending;
      const prog = Math.min(100, Math.max(0, Number(p.progress) || 0));
      return `
        <div class="project-card">
          <div class="project-color" style="background:${s.color}"></div>
          <div class="project-info">
            <div class="project-name">${escHtml(p.name)}</div>
            <div class="project-meta">
              <span class="badge ${s.cls}">● ${s.label}</span>
              ${p.work ? `<span>⚒ ${escHtml(p.work)}</span>` : ''}
            </div>
            <div class="progress-wrap">
              <div class="progress-bar" style="width:${prog}%"></div>
            </div>
          </div>
          <div class="project-actions">
            <button class="btn btn-ghost btn-sm btn-icon" title="מחק" onclick="deleteProject(${i})">🗑</button>
          </div>
        </div>`;
    }).join('');

    list.innerHTML = cards || `<div class="empty-state">
      <div class="empty-icon">🏚️</div>
      <p>אין פרויקטים עדיין.<br>לחץ על ״＋ פרויקט״ כדי להתחיל.</p>
    </div>`;

    document.getElementById('statTotal').textContent = projects.length;
    document.getElementById('statActive').textContent = projects.filter(p => p.status === 'active').length;
    document.getElementById('statDone').textContent = projects.filter(p => p.status === 'done').length;
  }

  function escHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function addProject() {
    const name = document.getElementById('projName').value.trim();
    if (!name) { shake('projName'); return; }
    projects.unshift({
      name,
      status: document.getElementById('projStatus').value,
      progress: document.getElementById('projProgress').value || 0,
      work: document.getElementById('projWork').value.trim(),
    });
    save(); render();
    closeModal('projectOverlay');
    clearProjectForm();
  }

  function deleteProject(i) {
    if (!confirm('למחוק את הפרויקט?')) return;
    projects.splice(i, 1);
    save(); render();
  }

  function clearProjectForm() {
    ['projName','projWork','projProgress'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('projStatus').value = 'active';
  }

  function generateQuote() {
    const client = document.getElementById('qClient').value.trim();
    const desc   = document.getElementById('qDesc').value.trim();
    const price  = document.getElementById('qPrice').value.trim();
    if (!client || !desc || !price) { showToast('אנא מלא את כל השדות', '#f5a623'); return; }

    const today = new Date().toLocaleDateString('he-IL', {year:'numeric',month:'long',day:'numeric'});
    const priceFormatted = Number(price).toLocaleString('he-IL');
    const vat = Math.round(Number(price) * 0.18).toLocaleString('he-IL');
    const total = Math.round(Number(price) * 1.18).toLocaleString('he-IL');

    document.getElementById('quotePreview').innerHTML = `
      <div class="quote-preview-header">
        <div>
          <div class="quote-company">בנייה<span>פרו</span></div>
          <div class="quote-date">הצעת מחיר · ${today}</div>
        </div>
        <div style="text-align:left">
          <div style="font-size:11px;color:#aaa;margin-bottom:2px">מסמך מס׳</div>
          <div style="font-weight:700;color:#333">#${Date.now().toString().slice(-5)}</div>
        </div>
      </div>
      <div class="quote-to">
        <div class="quote-to-label">מוגש לכבוד</div>
        <div class="quote-to-name">${escHtml(client)}</div>
      </div>
      <div class="quote-desc-label">תיאור העבודה</div>
      <div class="quote-desc">${escHtml(desc).replace(/\n/g,'<br>')}</div>
      <div class="quote-price-row">
        <div>
          <div class="quote-price-label">מחיר לפני מע״מ: ₪${priceFormatted}</div>
          <div class="quote-price-sub">+ מע״מ 18%: ₪${vat}</div>
        </div>
        <div style="text-align:left">
          <div style="font-size:11px;color:#aaa;margin-bottom:2px">סה״כ לתשלום</div>
          <div class="quote-price-val">₪${total}</div>
        </div>
      </div>
      <div class="quote-footer">הצעה זו בתוקף ל-30 יום · בנייהפרו © 2025</div>
    `;

    document.getElementById('quoteForm').style.display = 'none';
    document.getElementById('quotePreviewWrap').style.display = 'block';
  }

  function showQuoteForm() {
    document.getElementById('quoteForm').style.display = 'block';
    document.getElementById('quotePreviewWrap').style.display = 'none';
  }

  function clearQuoteForm() {
    ['qClient','qDesc','qPrice'].forEach(id => document.getElementById(id).value = '');
    showQuoteForm();
  }

  function copyQuote() {
    const text = document.getElementById('quotePreview').innerText;
    navigator.clipboard.writeText(text).then(() => showToast('✓ הועתק בהצלחה!')).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
      showToast('✓ הועתק בהצלחה!');
    });
  }

  function openProjectModal() { clearProjectForm(); document.getElementById('projectOverlay').classList.add('open'); }
  function openQuoteModal() { showQuoteForm(); document.getElementById('quoteOverlay').classList.add('open'); }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }
  function handleOverlayClick(e, id) { if (e.target === document.getElementById(id)) closeModal(id); }

  function showToast(msg, color) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    if (color) t.style.background = color;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2400);
  }

  function shake(id) {
    const el = document.getElementById(id);
    el.style.borderColor = 'var(--red)';
    setTimeout(() => el.style.borderColor = '', 1200);
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') ['projectOverlay','quoteOverlay'].forEach(id => closeModal(id));
  });

  render();
</script>
</body>
</html>
