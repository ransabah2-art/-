<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NMR - System</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        :root { --neon: #00f2ff; --bg: #05070a; --card: #111827; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding: 20px; direction: rtl; }
        .box { background: var(--card); padding: 25px; border-radius: 15px; border: 1px solid #1f2937; max-width: 400px; margin: auto; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #374151; box-sizing: border-box; }
        input { background: #030712; color: white; }
        button { background: var(--neon); color: black; font-weight: bold; cursor: pointer; border: none; }
        .project-card { background: #1f2937; padding: 15px; border-radius: 10px; margin-bottom: 10px; position: relative; }
        .delete-btn { background: #ef4444; color: white; width: auto; padding: 5px 10px; font-size: 12px; float: left; }
        .profit { color: #10b981; font-weight: bold; }
    </style>
</head>
<body>

<div id="app">
    <div id="auth-screen" class="box">
        <h2 style="color:var(--neon)">N.M.R LOGIN</h2>
        <input type="email" id="email" placeholder="אימייל">
        <input type="password" id="pass" placeholder="סיסמה">
        <button onclick="login()">כניסה למערכת</button>
        <p id="msg" style="color:red; font-size:12px;"></p>
    </div>
</div>

<script>
    // ה-Config החדש שמצאת ב-Firebase
    const firebaseConfig = {
        apiKey: "XXX", // תדביק פה את ה-API KEY החדש
        authDomain: "XXX",
        projectId: "XXX",
        appId: "XXX"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function login() {
        const e = document.getElementById('email').value.trim();
        const p = document.getElementById('pass').value.trim();
        try {
            // שומר את המחובר גם בטלפון אחרי סגירת דפדפן
            await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);
            await firebase.auth().signInWithEmailAndPassword(e, p);
        } catch(err) {
            document.getElementById('msg').innerText = "שגיאה: " + err.message;
        }
    }

    firebase.auth().onAuthStateChanged(user => {
        if(user) {
            renderDashboard();
        }
    });

    function renderDashboard() {
        document.getElementById('app').innerHTML = `
            <h2 style="color:var(--neon)">שלום רן</h2>
            <div class="box">
                <h3>פתיחת פרויקט חדש</h3>
                <input id="pName" placeholder="שם הפרויקט">
                <input type="number" id="pCost" placeholder="מחיר עלות (כמה עלה לך)">
                <input type="number" id="pPrice" placeholder="מחיר מכירה (כמה הלקוח משלם)">
                <button onclick="addProject()">שמור פרויקט</button>
            </div>
            <hr>
            <div id="projects-list">טוען פרויקטים...</div>
            <button onclick="firebase.auth().signOut().then(()=>location.reload())" style="background:none; color:gray; font-size:12px;">התנתק</button>
        `;
        loadProjects();
    }

    async function addProject() {
        const name = document.getElementById('pName').value;
        const cost = Number(document.getElementById('pCost').value);
        const price = Number(document.getElementById('pPrice').value);
        
        await db.collection("projects").add({
            name, cost, price,
            profit: price - cost,
            date: new Date()
        });
        renderDashboard();
    }

    async function loadProjects() {
        const snapshot = await db.collection("projects").orderBy("date", "desc").get();
        let html = '<h3>פרויקטים בביצוע</h3>';
        snapshot.forEach(doc => {
            const p = doc.data();
            html += `
                <div class="project-card">
                    <button class="delete-btn" onclick="deleteProject('${doc.id}')">מחק</button>
                    <strong>${p.name}</strong><br>
                    עלות: ${p.cost} ₪ | מכירה: ${p.price} ₪<br>
                    <span class="profit">רווח: ${p.profit} ₪</span>
                </div>
            `;
        });
        document.getElementById('projects-list').innerHTML = html;
    }

    async function deleteProject(id) {
        if(confirm("בטוח שרוצה למחוק?")) {
            await db.collection("projects").doc(id).delete();
            loadProjects();
        }
    }
</script>
</body>
</html>
