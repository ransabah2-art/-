<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>נ.מ.ר פרויקטים - ניהול מתקדם</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        :root {
            --bg: #0f1117; --surface: #1a1d27; --border: #2e3147;
            --accent: #f5a623; --text: #eef0f8; --text-muted: #7b7f9e;
            --green: #27c985; --red: #f26464;
        }

        body { 
            font-family: 'Heebo', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding-bottom: 100px;
        }

        /* --- ביטול הנקודה הירוקה --- */
        .green-dot, .status-indicator, div[style*="background-color: rgb(39, 201, 133)"] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
        }

        /* ניווט */
        nav { 
            background: var(--surface); 
            padding: 15px 20px; 
            display: flex; 
            justify-content: space-between; 
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
        }

        .card { 
            background: var(--surface); 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            padding: 20px; 
            margin: 20px; 
        }

        /* מחשבון צף */
        #mini-calc {
            position: fixed; left: 20px; bottom: 90px;
            width: 180px; background: var(--surface);
            border: 2px solid var(--accent); border-radius: 15px;
            padding: 10px; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #calc-screen {
            width: 100%; background: #000; color: var(--accent);
            border: none; text-align: left; padding: 10px;
            font-family: monospace; font-size: 18px; margin-bottom: 10px;
            box-sizing: border-box;
        }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        .calc-grid button { 
            padding: 10px; border: none; border-radius: 5px; 
            background: #2e3147; color: white; cursor: pointer; 
        }

        /* טבלאות */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid var(--border); }
        th { color: var(--accent); }

        .admin-only { display: none; } /* יופעל רק ע"י JS למנהלים */
