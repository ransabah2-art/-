<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>נ.מ.ר - מערכת ניהול</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        :root { --bg: #0a0e14; --accent: #00f2ff; --secondary: #7000ff; --text: #e2e8f0; --glass: rgba(255, 255, 255, 0.03); --border: rgba(255, 255, 255, 0.1); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Heebo', sans-serif; }
        body { background: var(--bg); color: var(--text); direction: rtl; min-height: 100vh; }
        
        /* תפריט ניווט עליון */
        header { padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: #0f172a; sticky: top; }
        .nav-tabs { display: flex; gap: 10px; padding: 15px; background: #0a0e14; }
        .tab { flex: 1; padding: 12px; text-align: center; background: var(--glass); border-radius: 12px; cursor: pointer; color: #94a3b8; font-weight: bold; }
        .tab.active { background: var(--accent); color: #000; }

        /* תוכן העמודים */
        main { padding: 20px; max-width: 600px; margin: 0 auto; }
        .page { display: none; }
        .page.active { display: block; }
        
        .card { background: var(--glass); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 15px; }
        input, select { width: 100%; padding: 15px; margin-bottom: 12px; border-radius: 12px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: white; font-size: 16px; }
        .btn-main { width: 100%; padding: 16px; background: var(--accent); color: #000; border: none; border-radius: 12px; font-weight: 900; cursor: pointer; }

        /* תיבת ה-AI */
        #ai-chat-box { height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 12px; }
        .msg { padding: 12px; border-radius: 15px; max-width: 80%; font-size: 14px; line-height: 1.4; }
        .msg.user { background: var(--secondary); align-self: flex-start; color: white; }
        .msg.ai { background: var(--border); align-self: flex-end; color: white; }

        /* פרויקטים */
        .proj-item { background: var(--glass); padding: 15px; border-radius: 12px; margin-bottom: 10px; border-right: 4px solid var(--accent); }
    </style>
</head>
<body>

    <header>
        <div style="font-weight:900; color:var(--accent); font-size:20px;">N.M.R</div>
        <div id="user-status" style="font-size:12px;">מחובר</div>
    </header>

    <div class="nav-tabs">
        <div class="tab active" id="t-dash" onclick="showPage('dash')">📊 ראשי</div>
        <div class="tab" id="t-projs" onclick="showPage('projs')">🏗️ פרויקטים</div>
        <div class="tab" id="t-ai" onclick="showPage('ai')">✨ יועץ AI</div>
    </div>

    <main>
        <div class="page active" id="p-dash">
            <div class="card">
                <h3>פרויקט חדש</h3>
                <input type="text" id="p-title" placeholder="שם הפרויקט">
                <input type="text" id="p-client" placeholder="שם הלקוח">
                <select id="p-status">
                    <option value="ביצוע">בביצוע</option>
                    <option value="הצעה">הצעת מחיר</option>
                </select>
                <button class="btn-main" onclick="addProject()">שמור במערכת</button>
            </div>
        </div>

        <div class="page" id="p-projs">
            <h3>רשימת עבודות</h3>
            <div id="project-list" style="margin-top:15px;"></div>
        </div>

        <div class="page" id="p-ai">
            <div class="card">
                <div id="ai-chat-box">
                    <div class="msg ai">שלום רן, במה אפשר לעזור היום?</div>
                </div>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="ai-input" placeholder="שאל אותי משהו..." style="margin-bottom:0;">
                    <button onclick="askAI()" style="background:var(--accent); border:none; padding:15px; border-radius:12px; cursor:pointer;">🚀</button>
                </div>
            </div>
        </div>
    </main>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyBb-7PPYP2GFIPMVnMlJRT2U5jBxDsg_vM", 
        authDomain: "nmr-projects.firebaseapp.com", 
        projectId: "nmr-projects", 
        storageBucket: "nmr-projects.appspot.com", 
        messagingSenderId: "780228662939", 
        appId: "1:780228662939:web:48931d5bccaa568b66583e" 
    };
    
    // המפתח החדש שלך
    const GEMINI_KEY = "AIzaSyAUK-zi5ASJ0KfjbWm9ZAMaaoFhqX_OP58";

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // מעבר בין עמודים
    function showPage(p) {
        document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('p-'+p).classList.add('active');
        document.getElementById('t-'+p).classList.add('active');
    }

    // הוספת פרויקט
    async function addProject() {
        const title = document.getElementById('p-title').value;
        const client = document.getElementById('p-client').value;
        const status = document.getElementById('p-status').value;
        if(!title) return alert("הזן שם פרויקט");

        try {
            await db.collection('projects').add({
                title, client, status, createdAt: new Date().getTime()
            });
            alert("נשמר!");
            document.getElementById('p-title').value = '';
            document.getElementById('p-client').value = '';
        } catch(e) { alert("שגיאה בשמירה: " + e.message); }
    }

    // טעינת פרויקטים
    db.collection('projects').orderBy('createdAt', 'desc').onSnapshot(snap => {
        const list = document.getElementById('project-list');
        list.innerHTML = '';
        snap.forEach(doc => {
            const p = doc.data();
            list.innerHTML += `<div class="proj-item"><strong>${p.title}</strong><br>${p.client} | ${p.status}</div>`;
        });
    });

    // פונקציית ה-AI
    async function askAI() {
        const input = document.getElementById('ai-input'), box = document.getElementById('ai-chat-box');
        if(!input.value) return;
        
        const userMsg = input.value;
        input.value = '';
        box.innerHTML += `<div class="msg user">${userMsg}</div>`;
        box.scrollTop = box.scrollHeight;

        try {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`;
            const res = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: "ענה בעברית קצרה: " + userMsg }] }] })
            });
            const data = await res.json();
            const aiMsg = data.candidates[0].content.parts[0].text;
            box.innerHTML += `<div class="msg ai">${aiMsg}</div>`;
        } catch(e) {
            box.innerHTML += `<div class="msg ai" style="color:red;">שגיאת תקשורת עם ה-AI</div>`;
        }
        box.scrollTop = box.scrollHeight;
    }
</script>
</body>
</html>
