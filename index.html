<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>נ.מ.ר - NEXT GEN</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg: #05070a;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent: #00f2ff; /* Cyan Electric */
            --secondary: #7000ff; /* Purple Glow */
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --green: #00ff9d;
            --red: #ff4b5c;
            --radius-lg: 24px;
            --radius-md: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Heebo', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: radial-gradient(circle at top right, #0a0f1d, #05070a);
            color: var(--text);
            direction: rtl;
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Glass Cards */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* Auth Screen Modern */
        #auth-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 25px; }
        .auth-card { width: 100%; max-width: 400px; text-align: center; }
        .logo-glow { font-size: 42px; font-weight: 900; letter-spacing: -1px; background: linear-gradient(to bottom right, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; }

        /* Navigation */
        header { padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .nav-tabs { 
            display: flex; 
            margin: 0 15px 20px; 
            background: rgba(255,255,255,0.02); 
            padding: 6px; 
            border-radius: 20px; 
            border: 1px solid var(--glass-border);
        }
        .tab { 
            flex: 1; padding: 10px; text-align: center; border-radius: 15px; 
            font-weight: 700; color: var(--text-muted); cursor: pointer; transition: 0.3s;
        }
        .tab.active { background: var(--accent); color: #000; box-shadow: 0 0 15px rgba(0, 242, 255, 0.4); }

        /* Dashboard Stats */
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-box { padding: 15px; border-radius: var(--radius-md); text-align: center; }
        .stat-label { font-size: 11px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; }
        .stat-val { font-size: 20px; font-weight: 900; margin-top: 5px; }

        /* Projects */
        .proj-card { transition: transform 0.2s; }
        .proj-card:active { transform: scale(0.98); }
        .progress-container { height: 8px; background: rgba(255,255,255,0.05); border-radius: 10px; margin: 15px 0; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, var(--secondary), var(--accent)); transition: 1s cubic-bezier(0.4, 0, 0.2, 1); }

        /* Inputs & Buttons */
        input, select, textarea { 
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); 
            border-radius: 16px; padding: 16px; color: white; margin-bottom: 12px; font-size: 16px;
        }
        input:focus { border-color: var(--accent); outline: none; background: rgba(255,255,255,0.08); }
        
        .btn-main { 
            background: var(--accent); color: #000; padding: 18px; border-radius: 16px; 
            border: none; font-weight: 900; width: 100%; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 242, 255, 0.2);
        }

        /* Image Strip */
        .image-strip { display: flex; gap: 12px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
        .image-strip img { width: 110px; height: 110px; border-radius: 18px; object-fit: cover; border: 2px solid var(--glass-border); }

        /* Floating Actions */
        .fab { 
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); 
            background: #fff; color: #000; padding: 16px 35px; border-radius: 40px; 
            font-weight: 900; z-index: 90; box-shadow: 0 10px 30px rgba(255,255,255,0.2);
        }

        /* Calculator Neon */
        #calc-bubble { 
            position: fixed; right: 20px; bottom: 30px; width: 60px; height: 60px; 
            background: var(--secondary); border-radius: 20px; display: flex; 
            align-items: center; justify-content: center; font-size: 24px; z-index: 100;
            box-shadow: 0 0 20px rgba(112, 0, 255, 0.4);
        }
        #calculator { 
            display: none; position: fixed; right: 20px; bottom: 100px; width: 280px; 
            background: #0d1117; border: 1px solid var(--secondary); border-radius: 24px; 
            padding: 20px; z-index: 100;
        }
        .calc-btn { background: #1a1f2e; border: none; border-radius: 12px; color: #fff; font-size: 18px; padding: 15px; font-weight: 700; }
        .calc-btn.op { color: var(--accent); }

        .page { display: none; padding: 0 15px 120px; animation: slideUp 0.4s ease-out; }
        .page.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        #app-content { display:none; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="glass-card auth-card">
        <div class="logo-glow">N.M.R</div>
        <p style="color:var(--text-muted); margin-bottom:30px">מערכת ניהול פרויקטים חכמה</p>
        <input type="email" id="login-email" placeholder="אימייל">
        <input type="password" id="login-pass" placeholder="סיסמה">
        <button class="btn-main" onclick="handleAuth('login')">כניסה למערכת</button>
        <button style="background:none; border:none; color:var(--text-muted); margin-top:15px; font-size:13px" onclick="handleAuth('signup')">הרשמה ראשונית</button>
    </div>
</div>

<div id="app-content">
    <header>
        <div class="logo-glow" style="font-size:24px">N.M.R</div>
        <button onclick="logout()" style="background:rgba(255,0,0,0.1); border:none; color:var(--red); padding:8px 15px; border-radius:12px; font-weight:700; font-size:12px">יציאה</button>
    </header>

    <div class="nav-tabs">
        <div class="tab active" id="t-dash" onclick="showPage('dash')">סקירה</div>
        <div class="tab" id="t-projs" onclick="showPage('projs')">פרויקטים</div>
        <div class="tab" id="t-quote" onclick="showPage('quote')">הצעה</div>
    </div>

    <main>
        <div class="page active" id="p-dash">
            <div class="admin-only">
                <div class="stat-grid">
                    <div class="glass-card stat-box" style="border-right: 4px solid var(--green)">
                        <div class="stat-label">רווח נקי</div>
                        <div class="stat-val" id="total-profit" style="color:var(--green)">₪0</div>
                    </div>
                    <div class="glass-card stat-box" style="border-right: 4px solid var(--red)">
                        <div class="stat-label">הוצאות</div>
                        <div class="stat-val" id="total-costs" style="color:var(--red)">₪0</div>
                    </div>
                </div>
            </div>
            <div class="glass-card stat-box" style="background: linear-gradient(135deg, rgba(112,0,255,0.1), rgba(0,242,255,0.1))">
                <div class="stat-label">פרויקטים פעילים בשטח</div>
                <div class="stat-val" id="count-active">0</div>
            </div>
        </div>

        <div class="page" id="p-projs"><div id="project-list"></div></div>

        <div class="page" id="p-quote">
            <div class="glass-card">
                <input type="text" id="q-client" placeholder="שם הלקוח">
                <textarea id="q-work" rows="4" placeholder="תיאור העבודה והמפרט..."></textarea>
                <input type="number" id="q-price" placeholder="מחיר בסיס (₪)">
                <button class="btn-main" onclick="generateQuote()">צור הצעה מעוצבת</button>
            </div>
            <div id="quote-result" style="display:none; background:#fff; color:#000; padding:25px; border-radius:24px; margin-top:20px"></div>
        </div>
    </main>

    <div id="calc-bubble" onclick="toggleCalc()">🧮</div>
    <div id="calculator">
        <div style="background:#000; padding:15px; border-radius:12px; margin-bottom:15px; text-align:left; font-size:24px; color:var(--accent)" id="calc-display">0</div>
        <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:10px">
            <button class="calc-btn" onclick="clearCalc()">C</button>
            <button class="calc-btn op" onclick="pressCalc('/')">/</button>
            <button class="calc-btn op" onclick="pressCalc('*')">×</button>
            <button class="calc-btn op" onclick="pressCalc('-')">-</button>
            <button class="calc-btn" onclick="pressCalc('7')">7</button><button class="calc-btn" onclick="pressCalc('8')">8</button><button class="calc-btn" onclick="pressCalc('9')">9</button>
            <button class="calc-btn op" onclick="pressCalc('+')">+</button>
            <button class="calc-btn" onclick="pressCalc('4')">4</button><button class="calc-btn" onclick="pressCalc('5')">5</button><button class="calc-btn" onclick="pressCalc('6')">6</button>
            <button class="calc-btn" onclick="pressCalc('.')">.</button>
            <button class="calc-btn" onclick="pressCalc('1')">1</button><button class="calc-btn" onclick="pressCalc('2')">2</button><button class="calc-btn" onclick="pressCalc('3')">3</button>
            <button class="calc-btn" style="background:var(--accent); color:#000; grid-column: span 2" onclick="solveCalc()">=</button>
            <button class="calc-btn" onclick="pressCalc('0')">0</button>
        </div>
    </div>

    <button class="fab" id="fab" onclick="openModal()">＋ פרויקט חדש</button>
</div>

<div id="modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:200; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(10px)">
    <div class="glass-card" style="width:100%; max-width:400px; background:#0d1117">
        <h2 style="margin-bottom:20px">פרויקט חדש</h2>
        <input type="text" id="new-name" placeholder="שם הפרויקט">
        <select id="new-status"><option value="ביצוע">בביצוע</option><option value="הושלם">הושלם</option></select>
        <input type="number" id="new-prog" placeholder="% התקדמות">
        <div class="admin-only">
            <input type="number" id="new-income" placeholder="הכנסה צפויה">
            <input type="number" id="new-costs" placeholder="הוצאות חומרים/פועלים">
        </div>
        <button class="btn-main" onclick="saveProject()">שמור פרויקט</button>
        <button style="background:none; border:none; color:var(--text-muted); width:100%; margin-top:15px" onclick="closeModal()">ביטול</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBb-7PPYP2GFIPMVnMlJRT2U5jBxDsg_vM",
        authDomain: "nmr-projects.firebaseapp.com",
        projectId: "nmr-projects",
        storageBucket: "nmr-projects.firebasestorage.app",
        messagingSenderId: "780228662939",
        appId: "1:780228662939:web:48931d5bccaa568b66583e"
    };

    const IMGBB_KEY = "7b48854ed8b84c2bfe8932316528448c";
    const ADMIN_EMAIL = "ransabah2@gmail.com";

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
            if (user.email === ADMIN_EMAIL) document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
            loadProjects();
        } else {
            document.getElementById('auth-screen').style.display = 'flex';
            document.getElementById('app-content').style.display = 'none';
        }
    });

    async function handleAuth(type) {
        const email = document.getElementById('login-email').value;
        const pass = document.getElementById('login-pass').value;
        if(!email || !pass) return alert("הכנס פרטים");
        try {
            if (type === 'login') await auth.signInWithEmailAndPassword(email, pass);
            else await auth.createUserWithEmailAndPassword(email, pass);
        } catch (e) { alert(e.message); }
    }

    function logout() { auth.signOut(); }
    function showPage(p) {
        document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('p-'+p).classList.add('active');
        document.getElementById('t-'+p).classList.add('active');
        document.getElementById('fab').style.display = (p === 'quote') ? 'none' : 'block';
    }

    function openModal() { document.getElementById('modal').style.display = 'flex'; }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    async function saveProject() {
        const name = document.getElementById('new-name').value;
        if(!name) return;
        await db.collection('projects').add({
            name: name,
            status: document.getElementById('new-status').value,
            prog: Number(document.getElementById('new-prog').value) || 0,
            income: Number(document.getElementById('new-income').value) || 0,
            costs: Number(document.getElementById('new-costs').value) || 0,
            images: [],
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        closeModal();
    }

    async function uploadToImgBB(projectId, file) {
        if(!file) return;
        let formData = new FormData();
        formData.append("image", file);
        const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: "POST", body: formData });
        const result = await response.json();
        await db.collection('projects').doc(projectId).update({ images: firebase.firestore.FieldValue.arrayUnion(result.data.url) });
    }

    function loadProjects() {
        db.collection('projects').orderBy('timestamp', 'desc').onSnapshot(snap => {
            let html = ''; let totalProfit = 0; let totalCosts = 0; let activeCount = 0;
            snap.forEach(doc => {
                const p = doc.data(); const id = doc.id;
                if (p.status === 'ביצוע') activeCount++;
                totalProfit += (p.income - p.costs); totalCosts += p.costs;
                let imagesHtml = (p.images || []).map(img => `<img src="${img}" onclick="window.open('${img}')">`).join('');
                html += `
                    <div class="glass-card proj-card">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start">
                            <h3 style="font-weight:900; font-size:20px">${p.name}</h3>
                            <span style="font-size:10px; color:var(--accent); background:rgba(0,242,255,0.1); padding:4px 10px; border-radius:10px">${p.status}</span>
                        </div>
                        <div class="progress-container"><div class="progress-bar" style="width:${p.prog}%"></div></div>
                        <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--text-muted)">
                            <span>${p.prog}% ביצוע</span>
                            ${auth.currentUser.email === ADMIN_EMAIL ? `<span style="color:var(--green); font-weight:700">₪${(p.income-p.costs).toLocaleString()}</span>` : ''}
                        </div>
                        <div class="image-strip">${imagesHtml}</div>
                        <label style="display:block; margin-top:10px; text-align:center; color:var(--accent); font-size:13px; font-weight:700; cursor:pointer">
                            📸 הוסף תמונה ליומן
                            <input type="file" accept="image/*" style="display:none" onchange="uploadToImgBB('${id}', this.files[0])">
                        </label>
                    </div>`;
            });
            document.getElementById('project-list').innerHTML = html;
            document.getElementById('count-active').innerText = activeCount;
            if (auth.currentUser.email === ADMIN_EMAIL) {
                document.getElementById('total-profit').innerText = '₪' + totalProfit.toLocaleString();
                document.getElementById('total-costs').innerText = '₪' + totalCosts.toLocaleString();
            }
        });
    }

    // Calc Logic
    let calcVal = "0";
    function toggleCalc() {
        const c = document.getElementById('calculator');
        c.style.display = (c.style.display === 'block') ? 'none' : 'block';
    }
    function pressCalc(v) {
        if(calcVal === "0") calcVal = v; else calcVal += v;
        document.getElementById('calc-display').innerText = calcVal;
    }
    function clearCalc() { calcVal = "0"; document.getElementById('calc-display').innerText = "0"; }
    function solveCalc() {
        try { calcVal = eval(calcVal).toString(); document.getElementById('calc-display').innerText = calcVal; }
        catch(e) { document.getElementById('calc-display').innerText = "Error"; }
    }

    function generateQuote() {
        const client = document.getElementById('q-client').value;
        const price = Number(document.getElementById('q-price').value);
        const vat = Math.round(price * 0.18);
        const total = price + vat;
        document.getElementById('quote-result').style.display = 'block';
        document.getElementById('quote-result').innerHTML = `
            <h2 style="color:var(--secondary); text-align:center; border-bottom:2px solid #eee; padding-bottom:10px">נ.מ.ר - הצעת מחיר</h2>
            <div style="margin:20px 0">
                <p><strong>לכבוד:</strong> ${client}</p>
                <p style="margin-top:10px"><strong>פירוט העבודה:</strong><br>${document.getElementById('q-work').value}</p>
            </div>
            <div style="background:#f8f9fa; padding:15px; border-radius:15px">
                <div style="display:flex; justify-content:space-between"><span>סה"כ לפני מע"מ:</span> <span>₪${price.toLocaleString()}</span></div>
                <div style="display:flex; justify-content:space-between; font-size:13px; color:#666"><span>מע"מ (18%):</span> <span>₪${vat.toLocaleString()}</span></div>
                <hr style="margin:10px 0; border:0; border-top:1px solid #ddd">
                <div style="display:flex; justify-content:space-between; font-weight:900; font-size:20px"><span>לתשלום:</span> <span>₪${total.toLocaleString()}</span></div>
            </div>`;
    }
</script>
</body>
</html>
