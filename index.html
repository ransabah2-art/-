<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>נ.מ.ר פרויקטים - ניהול פיננסי</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f1117; --surface: #1a1d27; --accent: #f5a623; --text: #eef0f8; --red: #f26464; --green: #27c985; }
        body { font-family: 'Heebo', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        .card { background: var(--surface); border: 1px solid #2e3147; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .admin-only { display: none; }
        input, select { background: #222536; border: 1px solid #2e3147; color: white; padding: 8px; border-radius: 6px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { cursor: pointer; padding: 10px; border-radius: 8px; border: none; font-weight: bold; width: 100%; margin-top: 5px; }
        .btn-main { background: var(--accent); color: #000; }
        .income { color: var(--green); }
        .expense { color: var(--red); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; border-bottom: 1px solid #2e3147; text-align: center; }
        .green-dot { display: none !important; } /* העלמת הנקודה */
    </style>
</head>
<body>

    <h2 style="color: var(--accent);">🏗️ נ.מ.ר - לוח בקרה</h2>

    <div class="admin-only" id="manager-dashboard">
        <div class="card" style="border: 2px solid var(--green);">
            <h3>📊 דשבורד מנהל - רווח והפסד</h3>
            <div id="total-summary" style="display: flex; justify-content: space-around; font-size: 1.2em;">
                <div>הכנסות: <span id="total-inc" class="income">₪0</span></div>
                <div>הוצאות: <span id="total-exp" class="expense">₪0</span></div>
                <div>רווח: <span id="total-net">₪0</span></div>
            </div>
        </div>
    </div>

    <div class="card">
        <h3>➕ הזנת תנועה כספית</h3>
        <select id="projSelect"><option value="">בחר פרויקט...</option></select>
        <input type="number" id="amount" placeholder="סכום בש״ח">
        <select id="type">
            <option value="income">הכנסה (מלקוח)</option>
            <option value="expense">הוצאה (קבלן/חומרים)</option>
        </select>
        <input type="text" id="desc" placeholder="תיאור (למשל: תשלום עבור בטון)">
        <button class="btn-main" onclick="addTransaction()">עדכן דוחות</button>
    </div>

    <div class="card">
        <h3>📂 פרויקטים פעילים</h3>
        <div id="projects-list"></div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBb-7PPYP2GFIPMVnMlJRT2U5jBxDsg_vM", projectId: "nmr-projects" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentUserRole = "partner";

        firebase.auth().onAuthStateChanged(async (user) => {
            if (!user) window.location.href = "login.html";
            else {
                const userDoc = await db.collection("users").doc(user.uid).get();
                if (userDoc.exists) {
                    currentUserRole = userDoc.data().role;
                    if (currentUserRole === "admin") document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
                }
                loadData();
            }
        });

        async function addTransaction() {
            const projId = document.getElementById('projSelect').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const type = document.getElementById('type').value;
            const desc = document.getElementById('desc').value;

            if (!projId || !amount) return alert("מלא סכום ופרויקט");

            await db.collection("transactions").add({
                projId, amount, type, desc, 
                date: new Date(),
                user: firebase.auth().currentUser.email
            });

            alert("הנתון נשמר עודכן");
            location.reload();
        }

        async function loadData() {
            // טעינת פרויקטים לסלקט
            const projsSnap = await db.collection("projects").get();
            const select = document.getElementById('projSelect');
            const list = document.getElementById('projects-list');
            
            let totalInc = 0; let totalExp = 0;

            const transSnap = await db.collection("transactions").get();
            const allTrans = transSnap.docs.map(doc => doc.data());

            projsSnap.forEach(doc => {
                const p = doc.data();
                // הוספה לסלקט
                select.innerHTML += `<option value="${doc.id}">${p.name}</option>`;
                
                // חישוב כספי לפרויקט ספציפי
                const pTrans = allTrans.filter(t => t.projId === doc.id);
                const pInc = pTrans.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
                const pExp = pTrans.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
                
                totalInc += pInc; totalExp += pExp;

                // תצוגת פרויקט לכולם (מנהל רואה כסף, שותף רואה רק שם)
                list.innerHTML += `
                    <div class="card" style="background:#222536">
                        <strong>${p.name}</strong>
                        ${currentUserRole === 'admin' ? `
                            <div style="font-size:0.9em; margin-top:5px;">
                                <span class="income">הכנסות: ₪${pInc}</span> | 
                                <span class="expense">הוצאות: ₪${pExp}</span>
                            </div>
                        ` : '<div style="font-size:0.8em; color:gray;">סטטוס: פעיל</div>'}
                    </div>`;
            });

            if (currentUserRole === 'admin') {
                document.getElementById('total-inc').innerText = `₪${totalInc}`;
                document.getElementById('total-exp').innerText = `₪${totalExp}`;
                const net = totalInc - totalExp;
                document.getElementById('total-net').innerText = `₪${net}`;
                document.getElementById('total-net').className = net >= 0 ? 'income' : 'expense';
            }
        }
    </script>
</body>
</html>
