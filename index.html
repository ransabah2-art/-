<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>נ.מ.ר - ניהול</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        :root { --bg: #0a0e14; --accent: #00f2ff; --secondary: #7000ff; --text: #e2e8f0; --glass: rgba(255, 255, 255, 0.03); --border: rgba(255, 255, 255, 0.1); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Heebo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); direction: rtl; min-height: 100vh; }
        #auth-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .auth-card { background: var(--glass); backdrop-filter: blur(15px); border: 1px solid var(--border); border-radius: 24px; padding: 30px; width: 100%; max-width: 380px; text-align: center; }
        #app-content { display: none; }
        header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .nav-tabs { display: flex; gap: 8px; padding: 12px; overflow-x: auto; }
        .tab { flex: 1; min-width: 90px; padding: 12px; text-align: center; background: var(--glass); border-radius: 14px; font-size: 14px; cursor: pointer; color: #94a3b8; }
        .tab.active { background: var(--accent); color: #000; font-weight: 800; }
        main { padding: 15px; padding-bottom: 100px; max-width: 600px; margin: 0 auto; }
        .page { display: none; }
        .page.active { display: block; }
        .glass-card { background: var(--glass); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 15px; }
        input, select { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 14px; padding: 15px; color: white; margin-bottom: 12px; font-size: 16px; outline: none; }
        .btn-main { background: var(--accent); color: #000; padding: 16px; border-radius: 14px; border: none; font-weight: 900; width: 100%; cursor: pointer; }
        .proj-item { background: var(--glass); padding: 15px; border-radius: 15px; margin-bottom: 10px; border-right: 4px solid var(--accent); }
        #ai-chat-box { height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px; padding: 10px; }
        .msg { padding: 12px; border-radius: 15px; max-width: 85%; font-size: 14px; }
        .msg.user { background: var(--secondary); align-self: flex-start; }
        .msg.ai { background: var(--border); align-self: flex-end; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-card">
        <h1 style="color:var(--accent);">N.M.R</h1>
        <input type="email" id="login-email" placeholder="אימייל">
        <input type="password" id="login-pass" placeholder="סיסמה">
        <button class="btn-main" onclick="handleAuth()">כניסה</button>
    </div>
</div>

<div id="app-content">
    <header>
        <div style="font-weight:900; color:var(--accent);">N.M.R PROJECTS</div>
        <button onclick="auth.signOut()" style="background:none; border:none; color:#ff4b5c;">יציאה</button>
    </header>

    <div class="nav-tabs">
        <div class="tab active" id="t-dash" onclick="showPage('dash')">📊 ראשי</div>
        <div class="tab" id="t-projs" onclick="showPage('projs')">🏗️ פרויקטים</div>
        <div class="tab" id="t-ai" onclick="showPage('ai')">✨ יועץ AI</div>
    </div>

    <main>
        <div class="page active" id="p-dash">
            <div class="glass-card" style="text-align:center;">
                <p>פרויקטים פעילים</p>
                <h1 id="count-active" style="color:var(--accent);">0</h1>
            </div>
            <div class="glass-card">
                <h3>הוספת פרויקט חדש</h3>
                <input type="text" id="p-title" placeholder="שם הפרויקט">
                <input type="text" id="p-client" placeholder="שם הלקוח">
                <select id="p-status">
                    <option value="ביצוע">בביצוע</option>
                    <option value="הצעה">הצעת מחיר</option>
                </select>
                <button class="btn-main" onclick="addProject()">שמור פרויקט</button>
            </div>
        </div>

        <div class="page" id="p-projs">
            <h3>כל הפרויקטים</h3>
            <div id="project-list" style="margin-top:15px;"></div>
        </div>

        <div class="page" id="p-ai">
            <div id="ai-chat-box"></div>
            <div style="display:flex; gap:10px;">
                <input type="text" id="ai-input" placeholder="שאל משהו..." style="margin-bottom:0;">
                <button onclick="askAI()" style="background:var(--accent); border:none; padding:15px; border-radius:14px; color:black; font-weight:bold;">שלח</button>
            </div>
        </div>
    </main>
</div>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyBb-7PPYP2GFIPMVnMlJRT2U5jBxDsg_vM", 
        authDomain: "nmr-projects.firebaseapp.com", 
        projectId: "nmr-projects", 
        storageBucket: "nmr-projects.appspot.com", 
        messagingSenderId: "780228662939", 
        appId: "1:780228662939:web:48931d5bccaa568b66583e" 
    };
    
    const GEMINI_KEY = "AIzaSyAUK-zi5ASJ0KfjbWm9ZAMaaoFhqX_OP58";

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.onAuthStateChanged(user => {
        document.getElementById('auth-screen').style.display = user ? 'none' : 'flex';
        document.getElementById('app-content').style.display = user ? 'block' : 'none';
        if(user) loadProjects();
    });

    async function handleAuth() {
        const e = document.getElementById('login-email').value, p = document.getElementById('login-pass').value;
        try { await auth.signInWithEmailAndPassword(e,p); } catch(err) { alert("שגיאה: " + err.message); }
    }

    function showPage(p) {
        document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('p-'+p).classList.add('active');
        document.getElementById('t-'+p).classList.add('active');
    }

    // הוספת פרויקט ל-Firebase
    async function addProject() {
        const title = document.getElementById('p-title').value;
        const client = document.getElementById('p-client').value;
        const status = document.getElementById('p-status').value;
        if(!title) return alert("חובה להזין שם פרויקט");
        
        try {
            await db.collection('projects').add({
                title, client, status, timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            document.getElementById('p-title').value = '';
            document.getElementById('p-client').value = '';
            alert("הפרויקט נשמר בהצלחה!");
        } catch(e) { alert("שגיאת שמירה: " + e.message); }
    }

    // טעינת פרויקטים בזמן אמת
    function loadProjects() {
        db.collection('projects').orderBy('timestamp', 'desc').onSnapshot(snap => {
            const list = document.getElementById('project-list');
            list.innerHTML = '';
            let activeCount = 0;
            snap.forEach(doc => {
                const p = doc.data();
                if(p.status === 'ביצוע') activeCount++;
                list.innerHTML += `
                    <div class="proj-item">
                        <strong>${p.title}</strong><br>
                        לקוח: ${p.client || 'לא צוין'} | סטטוס: ${p.status}
                    </div>`;
            });
            document.getElementById('count-active').innerText = activeCount;
        });
    }

    // פונקציית AI מתוקנת ל-v1beta
    async function askAI() {
        const input = document.getElementById('ai-input'), box = document.getElementById('ai-chat-box');
        if(!input.value) return;
        const msg = input.value; input.value = '';
        box.innerHTML += `<div class="msg user">${msg}</div>`;
        box.scrollTop = box.scrollHeight;

        try {
            // התיקון הקריטי בכתובת ה-URL
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`;
            
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: "ענה בעברית קצרה מאוד: " + msg }] }] })
            });

            const data = await response.json();
            if(data.error) {
                box.innerHTML += `<div class="msg ai" style="color:red;">שגיאה: ${data.error.message}</div>`;
            } else {
                const aiMsg = data.candidates[0].content.parts[0].text;
                box.innerHTML += `<div class="msg ai">${aiMsg}</div>`;
            }
        } catch(e) { box.innerHTML += `<div class="msg ai">שגיאת חיבור.</div>`; }
        box.scrollTop = box.scrollHeight;
    }
</script>
</body>
</html>
