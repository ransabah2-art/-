<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת ניהול פרויקטים - NMR</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .project-card {
            background: #fff;
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            transition: transform 0.2s;
        }
        .project-card:hover {
            transform: scale(1.01);
            border-color: #3498db;
        }
        #loading {
            text-align: center;
            font-style: italic;
            color: #7f8c8d;
        }
        .error {
            color: #e74c3c;
            background: #fdf2f2;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>לוח בקרה - NMR Projects</h1>
    
    <div id="loading">טוען נתונים מהמערכת...</div>
    <div id="data-container"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  // הגדרות ה-Firebase שלך (מעודכן לפי הצילומים ששלחת)
  const firebaseConfig = {
    apiKey: "AIzaSyBb-7PPYP2GFIPMVnMlJRT2U5jBxDsg_vM",
    authDomain: "nmr-projects.firebaseapp.com",
    projectId: "nmr-projects",
    storageBucket: "nmr-projects.appspot.com",
    messagingSenderId: "635398254882",
    appId: "1:635398254882:web:785f7a0b5a3e1458e08d66"
  };

  // אתחול המערכת
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // פונקציה למשיכת הפרויקטים מה-Database
  async function loadProjects() {
    const container = document.getElementById('data-container');
    const loading = document.getElementById('loading');

    try {
        // ניסיון למשוך נתונים מאוסף שנקרא 'projects'
        const querySnapshot = await getDocs(collection(db, "projects"));
        loading.style.display = 'none';

        if (querySnapshot.empty) {
            container.innerHTML = "<p>לא נמצאו פרויקטים במסד הנתונים. הוסף נתונים ב-Firebase Console.</p>";
            return;
        }

        let html = "";
        querySnapshot.forEach((doc) => {
            const data = doc.data();
            html += `
                <div class="project-card">
                    <h3>${data.name || 'פרויקט ללא שם'}</h3>
                    <p><strong>סטטוס:</strong> ${data.status || 'בביצוע'}</p>
                    <p><strong>תיאור:</strong> ${data.description || 'אין פירוט זמין'}</p>
                </div>
            `;
        });
        container.innerHTML = html;

    } catch (error) {
        console.error("Error loading data:", error);
        loading.style.display = 'none';
        container.innerHTML = `
            <div class="error">
                <h3>שגיאה בחיבור לנתונים</h3>
                <p>וודא שהגדרת את ה-Rules ב-Firebase ל-Public (if true).</p>
                <p>קוד שגיאה: ${error.code}</p>
            </div>
        `;
    }
  }

  // הפעלה
  loadProjects();
</script>

</body>
</html>
