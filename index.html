<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>נ.מ.ר - NEXT GEN AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg: #05070a;
            --accent: #00f2ff;
            --secondary: #7000ff;
            --text: #e2e8f0;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Heebo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #05070a; color: var(--text); direction: rtl; min-height: 100vh; }

        .glass-card { background: var(--glass); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px; margin-bottom: 15px; }
        
        /* Auth */
        #auth-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        #app-content { display: none; }

        header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.5); }
        .logo { font-size: 24px; font-weight: 900; color: var(--accent); }

        /* Tabs */
        .nav-tabs { display: flex; padding: 10px; gap: 5px; overflow-x: auto; }
        .tab { flex: 1; padding: 10px; text-align: center; background: var(--glass); border-radius: 12px; font-size: 14px; cursor: pointer; color: #94a3b8; }
        .tab.active { background: var(--accent); color: #000; font-weight: 700; }

        main { padding: 15px; padding-bottom: 100px; }
        .page { display: none; }
        .page.active { display: block; }

        input, textarea { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 12px; padding: 15px; color: white; margin-bottom: 10px; font-size: 16px; outline: none; }
        .btn-main { background: var(--accent); color: #000; padding: 15px; border-radius: 12px; border: none; font-weight: 900; width: 100%; cursor: pointer; }

        /* AI Chat */
        #ai-chat-box { height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
        .msg { padding: 12px; border-radius: 15px; max-width: 80%; font-size: 15px; }
        .msg.user { background: var(--secondary); align-self: flex-start; }
        .msg.ai { background: var(--glass-border); align-self: flex-end; }

        /* Calculator FIX */
        #calc-bubble { position: fixed; right: 20px; bottom: 20px; width: 65px; height: 65px; background: var(--secondary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; z-index: 9999; cursor: pointer; box-shadow: 0 0 20px rgba(112,0,255,0.5); }
        #calculator { display: none; position: fixed; right: 20px; bottom: 95px; width: 300px; background: #111; border: 2px solid var(--secondary); border-radius: 20px; padding: 15px; z-index: 9999; }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .calc-btn { background: #222; border: none; color: white; padding: 18px; font-size: 20px; font-weight: 700; border-radius: 10px; cursor: pointer; }
        .calc-btn.op { background: var(--secondary); }
        .calc-btn.eq { background: var(--accent); color: #000; grid-column: span 2; }
        
        .fab { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: white; color: black; padding: 15px 30px; border-radius: 30px; font-weight: 900; border: none; z-index: 100; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="glass-card" style="width:100%; max-width:350px; text-align:center;">
        <h1 style="color:var(--accent); margin-bottom:20px;">N.M.R</h1>
        <input type="email" id="login-email" placeholder="אימייל">
        <input type="password" id="login-pass" placeholder="סיסמה">
        <button class="btn-main" onclick="handleAuth('login')">כניסה</button>
        <button style="background:none; border:none; color:#94a3b8; margin-top:15px;" onclick="handleAuth('signup')">הרשמה</button>
    </div>
</div>

<div id="app-content">
    <header><div class="logo">N.M.R</div><button onclick="logout()" style="background:none; border:none; color:var(--accent);">יציאה</button></header>
    
    <div class="nav-tabs">
        <div class="tab active" id="t-dash" onclick="showPage('dash')">דשבורד</div>
        <div class="tab" id="t-projs" onclick="showPage('projs')">פרויקטים</div>
        <div class="tab" id="t-quote" onclick="showPage('quote')">הצעות</div>
        <div class="tab" id="t-ai" onclick="showPage('ai')">היועץ AI</div>
    </div>

    <main>
        <div class="page active" id="p-dash">
            <div class="glass-card" style="text-align:center;">
                <p>פרויקטים פעילים</p>
                <h1 id="count-active" style="font-size:50px;">0</h1>
            </div>
        </div>
        <div class="page" id="p-projs"><div id="project-list"></div></div>
        <div class="page" id="p-quote">
            <div class="glass-card">
                <input type="text" id="q-client" placeholder="שם הלקוח">
                <textarea id="q-work" rows="4" placeholder="תיאור העבודה"></textarea>
                <input type="number" id="q-price" placeholder="מחיר בסיס">
                <button class="btn-main" onclick="generateQuote()">הפק הצעה</button>
            </div>
            <div id="quote-result" style="display:none; background:white; color:black; padding:20px; border-radius:15px; margin-top:10px;"></div>
        </div>
        <div class="page" id="p-ai">
            <div class="glass-card">
                <div id="ai-chat-box"></div>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="ai-input" placeholder="שאל את AI..." style="margin-bottom:0;">
                    <button onclick="askAI()" style="background:var(--accent); border:none; padding:10px 20px; border-radius:12px;">🚀</button>
                </div>
            </div>
        </div>
    </main>

    <div id="calc-bubble" onclick="toggleCalc()">🧮</div>
    <div id="calculator">
        <div id="calc-display" style="background:#000; padding:15px; border-radius:10px; margin-bottom:10px; text-align:left; font-size:24px; color:var(--accent);">0</div>
        <div class="calc-grid">
            <button class="calc-btn" onclick="clearCalc()">C</button>
            <button class="calc-btn op" onclick="pressCalc('/')">/</button>
            <button class="calc-btn op" onclick="pressCalc('*')">×</button>
            <button class="calc-btn op" onclick="pressCalc('-')">-</button>
            <button class="calc-btn" onclick="pressCalc('7')">7</button>
            <button class="calc-btn" onclick="pressCalc('8')">8</button>
            <button class="calc-btn" onclick="pressCalc('9')">9</button>
            <button class="calc-btn op" onclick="pressCalc('+')">+</button>
            <button class="calc-btn" onclick="pressCalc('4')">4</button>
            <button class="calc-btn" onclick="pressCalc('5')">5</button>
            <button class="calc-btn" onclick="pressCalc('6')">6</button>
            <button class="calc-btn eq" onclick="solveCalc()">=</button>
            <button class="calc-btn" onclick="pressCalc('1')">1</button>
            <button class="calc-btn" onclick="pressCalc('2')">2</button>
            <button class="calc-btn" onclick="pressCalc('3')">3</button>
            <button class="calc-btn" onclick="pressCalc('0')">0</button>
        </div>
    </div>

    <button class="fab" id="fab" onclick="openModal()">＋ פרויקט חדש</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBb-7PPYP2GFIPMVnMlJRT2U5jBxDsg_vM",
        authDomain: "nmr-projects.firebaseapp.com",
        projectId: "nmr-projects",
        storageBucket: "nmr-projects.firebasestorage.app",
        messagingSenderId: "780228662939",
        appId: "1:780228662939:web:48931d5bccaa568b66583e"
    };

    const GEMINI_KEY = "AIzaSyDBoI8k8TZTfqVcd7_zpP70vjWYQp1R0lw"; // המפתח ששלחת

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
            loadProjects();
        } else {
            document.getElementById('auth-screen').style.display = 'flex';
            document.getElementById('app-content').style.display = 'none';
        }
    });

    async function handleAuth(type) {
        const e = document.getElementById('login-email').value;
        const p = document.getElementById('login-pass').value;
        try {
            if(type==='login') await auth.signInWithEmailAndPassword(e,p);
            else await auth.createUserWithEmailAndPassword(e,p);
        } catch(err) { alert("שגיאה: " + err.message); }
    }

    function logout() { auth.signOut(); }
    function showPage(p) {
        document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('p-'+p).classList.add('active');
        document.getElementById('t-'+p).classList.add('active');
    }

    // AI FIX: שימוש ב-URL הנכון ובפורמט הנכון
    async function askAI() {
        const input = document.getElementById('ai-input');
        const chatBox = document.getElementById('ai-chat-box');
        if(!input.value) return;
        const val = input.value;
        input.value = '';
        chatBox.innerHTML += `<div class="msg user">${val}</div>`;
        
        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: `אתה עוזר למנהל עבודה בשם רן. ענה בעברית קצרה. השאלה: ${val}` }] }] })
            });
            const data = await response.json();
            const aiMsg = data.candidates[0].content.parts[0].text;
            chatBox.innerHTML += `<div class="msg ai">${aiMsg}</div>`;
        } catch(e) {
            chatBox.innerHTML += `<div class="msg ai">שגיאה בחיבור ל-AI. וודא שהמפתח פעיל.</div>`;
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Calculator FIX: סדר כפתורים נכון
    let cv = "0";
    function toggleCalc() { 
        const c = document.getElementById('calculator');
        c.style.display = (c.style.display==='block') ? 'none' : 'block';
    }
    function pressCalc(v) { if(cv === "0") cv = v; else cv += v; document.getElementById('calc-display').innerText = cv; }
    function clearCalc() { cv = "0"; document.getElementById('calc-display').innerText = "0"; }
    function solveCalc() { try { cv = eval(cv).toString(); document.getElementById('calc-display').innerText = cv; } catch(e) { cv = "Error"; } }

    function loadProjects() {
        db.collection('projects').onSnapshot(snap => {
            let active = 0;
            snap.forEach(doc => { if(doc.data().status === 'ביצוע') active++; });
            document.getElementById('count-active').innerText = active;
        });
    }

    function generateQuote() {
        const p = Number(document.getElementById('q-price').value);
        document.getElementById('quote-result').style.display = 'block';
        document.getElementById('quote-result').innerHTML = `<h3>הצעה נ.מ.ר</h3><p>סה"כ כולל מע"מ: ₪${Math.round(p*1.18)}</p>`;
    }

    function openModal() { alert("פונקציית הוספה תופעל בשלב הבא"); }
</script>
</body>
</html>
