<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>נ.מ.ר - תיקון 404</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: system-ui; background: #0f172a; color: white; text-align: center; padding: 50px; }
        .card { background: #1e293b; padding: 20px; border-radius: 20px; border: 1px solid #334155; max-width: 400px; margin: auto; }
        .status { padding: 10px; border-radius: 10px; margin-top: 10px; font-weight: bold; }
        .error { background: #7f1d1d; color: #fecaca; }
        .success { background: #064e3b; color: #d1fae5; }
    </style>
</head>
<body>

    <div class="card">
        <h2>אבחון מערכת נ.מ.ר</h2>
        <div id="fb-status" class="status">בודק חיבור ל-Firebase...</div>
        <hr style="opacity: 0.1; margin: 20px 0;">
        <button onclick="testAI()" style="width:100%; padding:15px; border-radius:10px; border:none; background:#00f2ff; font-weight:bold; cursor:pointer;">בדוק חיבור ל-AI</button>
        <div id="ai-status" class="status"></div>
    </div>

<script>
    // הגדרות שלך
    const firebaseConfig = { apiKey: "AIzaSyBb-7PPYP2GFIPMVnMlJRT2U5jBxDsg_vM", projectId: "nmr-projects" };
    const GEMINI_KEY = "AIzaSyAUK-zi5ASJ0KfjbWm9ZAMaaoFhqX_OP58";

    // בדיקת Firebase
    try {
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        document.getElementById('fb-status').innerText = "✅ Firebase מחובר";
        document.getElementById('fb-status').className = "status success";
    } catch (e) {
        document.getElementById('fb-status').innerText = "❌ שגיאת Firebase: " + e.message;
        document.getElementById('fb-status').className = "status error";
    }

    // בדיקת AI עם הכתובת הכי מעודכנת ל-2026
    async function testAI() {
        const status = document.getElementById('ai-status');
        status.innerText = "שולח בקשה...";
        status.className = "status";

        try {
            // כתובת V1BETA עם המודל העדכני
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`;
            
            const res = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: "תגיד היי" }] }] })
            });

            if (res.status === 404) {
                throw new Error("כתובת ה-API לא נמצאה (404). וודא שהמודל קיים ב-AI Studio.");
            }

            const data = await res.json();
            if (data.error) throw new Error(data.error.message);

            status.innerText = "✅ ה-AI עובד! תשובה: " + data.candidates[0].content.parts[0].text;
            status.className = "status success";
        } catch (e) {
            status.innerText = "❌ שגיאה: " + e.message;
            status.className = "status error";
        }
    }
</script>
</body>
</html>
