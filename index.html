<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NMR Performance - דשבורד ניהול</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #1a1a1a; /* שחור-פחם לרקע */
            --bg-panel: #2d2d2d; /* אפור-כהה לפאנלים */
            --text-light: #f4f4f4; /* לבן-קרם לטקסט */
            --primary-blue: #3498db; /* כחול-רויאל לנגיעות */
            --accent-orange: #e67e22; /* כתום-אש לדגשים ופעולות */
            --danger: #e74c3c;
        }

        body {
            font-family: 'Assistant', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0; padding: 0;
            display: flex; height: 100vh;
        }

        /* סרגל צדדי - ניווט */
        .sidebar {
            width: 250px; background: #111;
            display: flex; flex-direction: column;
            padding: 20px; border-left: 1px solid #333;
        }

        .logo-area {
            text-align: center; margin-bottom: 40px;
        }

        .logo-text {
            font-size: 22px; font-weight: 800; color: var(--text-light);
            letter-spacing: 1px;
        }

        .logo-sub {
            font-size: 12px; color: var(--accent-orange); font-weight: 600;
        }

        .nav-link {
            padding: 15px; color: #aaa; text-decoration: none;
            border-radius: 8px; margin-bottom: 10px; cursor: pointer;
            transition: 0.3s; font-weight: 600;
        }

        .nav-link:hover, .nav-link.active {
            background: rgba(52, 152, 219, 0.15); color: var(--primary-blue);
        }

        /* אזור התוכן הראשי */
        .main-content {
            flex: 1; padding: 40px; overflow-y: auto;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.5s; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        h1 { border-right: 5px solid var(--accent-orange); padding-right: 15px; margin-bottom: 30px; }

        /* כרטיסיות נתונים ויזואליות */
        .card {
            background: var(--bg-panel); border-radius: 12px;
            padding: 25px; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            margin-bottom: 20px; border: 1px solid #444;
        }

        .calc-input {
            width: 100%; padding: 12px; margin: 10px 0;
            background: #222; border: 1px solid #555;
            color: white; border-radius: 6px; font-size: 16px;
        }

        .btn {
            padding: 12px 24px; border: none; border-radius: 6px;
            cursor: pointer; font-weight: 700; transition: 0.3s;
            width: 100%; font-size: 16px;
        }

        .btn-orange { background: var(--accent-orange); color: white; }
        .btn-orange:hover { background: #d35400; }
        
        .btn-whatsapp { background: #25d366; color: white; margin-top: 15px; }

        .btn-danger { background: var(--danger); color: white; width: auto; padding: 8px 15px; }

        /* עיצוב רשימות */
        .item-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px; border-bottom: 1px solid #444; background: rgba(255,255,255,0.02);
            margin-bottom: 5px; border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo-area">
            <div class="logo-text">NMR PERFORMANCE</div>
            <div class="logo-sub">בשיתוף מנק"ף (מוף)</div>
        </div>
        <div class="nav-link active" onclick="showTab('projects')">📁 פרויקטים</div>
        <div class="nav-link" onclick="showTab('quote')">✉️ הצעת מחיר (WhatsApp)</div>
        <div class="nav-link" onclick="showTab('calc')">🧮 מחשבון עלויות</div>
        <div class="nav-link" onclick="showTab('contacts')">👥 אנשי קשר</div>
    </div>

    <div class="main-content">

        <div id="projects" class="tab-content active">
            <h1>פרויקטים פעילים</h1>
            <div class="card">
                <div id="projects-list">טוען נתונים...</div>
            </div>
        </div>

        <div id="quote" class="tab-content">
            <h1>הצעת מחיר מהירה (WhatsApp)</h1>
            <div class="card">
                <label>שם הלקוח:</label>
                <input type="text" id="cust-name" class="calc-input" placeholder="ישראל ישראלי">
                <label>סכום לפני מע"מ:</label>
                <input type="number" id="amount" class="calc-input" placeholder="0.00" oninput="calculateTotal()">
                
                <div style="background: rgba(230, 126, 34, 0.1); padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px solid var(--accent-orange);">
                    <p>מע"מ (18%): <span id="vat-amount" style="color: var(--accent-orange); font-weight: 700;">0</span> ₪</p>
                    <h3>סה"כ לתשלום: <span id="total-amount">0</span> ₪</h3>
                </div>
                
                <button class="btn btn-whatsapp" onclick="sendWhatsApp()">שלח הצעה בוואטסאפ</button>
            </div>
        </div>

        <div id="calc" class="tab-content">
            <h1>מחשבון עלויות</h1>
            <div class="card">
                <label>כמות מ"ר:</label>
                <input type="number" id="sqm" class="calc-input" placeholder="כמות מ"ר">
                <label>מחיר למ"ר:</label>
                <input type="number" id="price-sqm" class="calc-input" placeholder="מחיר ליחידה">
                <button class="btn btn-orange" onclick="calculateCost()">חשב עלות סופית</button>
            </div>
        </div>

        <div id="contacts" class="tab-content">
            <h1>אנשי קשר</h1>
            <div class="card">
                <div id="contacts-list"></div>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // הגדרות Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBb-7PPYP2GFIPMVnMlJRT2U5jBxDsg_vM",
            authDomain: "nmr-projects.firebaseapp.com",
            projectId: "nmr-projects",
            storageBucket: "nmr-projects.appspot.com",
            messagingSenderId: "635398254882",
            appId: "1:635398254882:web:785f7a0b5a3e1458e08d66"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // פונקציית מעבר בין דשבורדים (Tabs)
        window.showTab = (tabId) => {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        };

        // חישובים
        window.calculateTotal = () => {
            const amount = parseFloat(document.getElementById('amount').value) || 0;
            const vat = amount * 0.18;
            const total = amount + vat;
            document.getElementById('vat-amount').innerText = vat.toFixed(2);
            document.getElementById('total-amount').innerText = total.toFixed(2);
        };

        window.calculateCost = () => {
            const sqm = document.getElementById('sqm').value;
            const price = document.getElementById('price-sqm').value;
            alert('העלות הסופית היא: ' + (sqm * price) + ' ₪');
        };

        // שליחת וואטסאפ
        window.sendWhatsApp = () => {
            const name = document.getElementById('cust-name').value;
            const total = document.getElementById('total-amount').innerText;
            const text = `שלום ${name}, הצעת המחיר עבורך מחברת NMR Performance היא ${total} ש"ח כולל מע"מ (בשיתוף מוף).`;
            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
        };

        // טעינת ומחיקת נתונים
        async function loadData() {
            // פרויקטים
            const projSnap = await getDocs(collection(db, "projects"));
            const projList = document.getElementById('projects-list');
            projList.innerHTML = "";
            projSnap.forEach(projDoc => {
                const d = projDoc.data();
                const div = document.createElement('div');
                div.className = 'item-row';
                div.innerHTML = `
                    <div><strong>${d.name || 'פרויקט'}</strong> - ${d.status || 'פעיל'}</div>
                    <button class="btn-danger" onclick="deleteItem('projects', '${projDoc.id}')">מחק</button>
                `;
                projList.appendChild(div);
            });
        }

        window.deleteItem = async (folder, id) => {
            if(confirm("בטוח שברצונך למחוק לצמיתות?")) {
                await deleteDoc(doc(db, folder, id));
                location.reload();
            }
        };

        loadData();
    </script>
</body>
</html>
