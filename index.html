<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NMR Pro Mobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505; --panel: #121214; --orange: #ff9f1c; --blue: #00a8ff;
            --text: #ffffff; --gray: #999; --success: #00ff88; --danger: #ff4d4d;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            font-family: 'Assistant', sans-serif; background-color: var(--bg); color: var(--text); 
            margin: 0; padding: 0; padding-bottom: 80px; /* רווח לסרגל תחתון */
        }

        /* Header קומפקטי לנייד */
        header {
            background: #000; padding: 15px 20px; display: flex; align-items: center; gap: 10px;
            border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 1000;
        }
        .crane-icon { width: 24px; height: 24px; fill: var(--orange); }
        .brand-name { font-size: 18px; font-weight: 800; letter-spacing: 1px; }

        /* סרגל ניווט תחתון - Mobile Style */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 70px;
            background: rgba(18, 18, 20, 0.95); backdrop-filter: blur(15px);
            display: flex; justify-content: space-around; align-items: center;
            border-top: 1px solid #333; z-index: 1000; padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item { 
            display: flex; flex-direction: column; align-items: center; 
            color: var(--gray); font-size: 11px; font-weight: 600; text-decoration: none;
        }
        .nav-item i { font-size: 20px; margin-bottom: 4px; }
        .nav-item.active { color: var(--orange); }

        .container { padding: 20px; }

        /* כרטיסיות נתונים */
        .card { 
            background: var(--panel); padding: 20px; border-radius: 20px; 
            border: 1px solid #222; margin-bottom: 15px;
        }
        
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-box { background: #1a1a1c; padding: 15px; border-radius: 15px; text-align: center; }
        .stat-box.full { grid-column: span 2; }
        .stat-label { font-size: 12px; color: var(--gray); display: block; }
        .stat-val { font-size: 20px; font-weight: 800; }

        /* טפסים */
        input, textarea { 
            background: #1a1a1c; border: 1px solid #333; color: white; 
            padding: 15px; border-radius: 12px; width: 100%; margin-bottom: 10px; 
            font-size: 16px; /* מונע זום באייפון */
        }

        .btn { 
            padding: 16px; border-radius: 12px; border: none; font-weight: 800; 
            width: 100%; cursor: pointer; font-size: 16px;
        }
        .btn-orange { background: var(--orange); color: #000; }
        .btn-blue { background: var(--blue); color: #fff; }

        /* רשימות מותאמות לנייד */
        .list-item {
            background: #1a1a1c; padding: 15px; border-radius: 15px;
            margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
        }
        .list-info { display: flex; flex-direction: column; }
        .list-title { font-weight: 700; color: #fff; }
        .list-sub { font-size: 13px; color: var(--gray); }

        /* מחשבון צף קטן יותר */
        #calc-trigger { 
            position: fixed; bottom: 85px; left: 20px; background: var(--blue); 
            width: 50px; height: 50px; border-radius: 50%; display: flex; 
            align-items: center; justify-content: center; z-index: 999;
        }
        
        #calc-floating {
            position: fixed; bottom: 0; left: 0; right: 0; height: 75vh;
            background: #000; border-radius: 25px 25px 0 0; display: none; z-index: 2000;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    </style>
</head>
<body>

    <header>
        <svg class="crane-icon" viewBox="0 0 24 24"><path d="M18,16H16V13.82L13,11V16H11V8.33L14.75,11.08L16.17,9.67L12.08,6.58C12.72,6.21 13.37,6 14,6C16.21,6 18,7.79 18,10V16M11,18H13V22H11V18M2,22V18H4V16.18L2.83,15.17L4.25,13.75L6,15.18V16H8V15.18L9.75,13.75L11.17,15.17L10,16.18V18H12V16H10.18L13.18,13H11V11.18L9.18,13H7V11.18L5.18,13H3V11.18L1,13V22H2M22,10V16H20V11.82L17,9V16H15V6.33L18.75,9.08L20.17,7.67L16.08,4.58C16.72,4.21 17.37,4 18,4C20.21,4 22,5.79 22,8V10Z" /></svg>
        <span class="brand-name">NMR PERFORMANCE</span>
    </header>

    <div class="container">
        <div id="dashboard" class="tab-content active">
            <div class="stat-grid">
                <div class="stat-box full"><span class="stat-label">רווח נקי</span><div id="m-profit" class="stat-val" style="color:var(--success)">0 ₪</div></div>
                <div class="stat-box"><span class="stat-label">מחזור</span><div id="m-sales" class="stat-val" style="color:var(--blue)">0 ₪</div></div>
                <div class="stat-box"><span class="stat-label">עלויות</span><div id="m-costs" class="stat-val" style="color:var(--danger)">0 ₪</div></div>
            </div>
            <h3 style="margin-top:25px;">רווחיות פרויקטים</h3>
            <div id="profit-list-mobile"></div>
        </div>

        <div id="projects" class="tab-content">
            <div class="card">
                <h3>פרויקט חדש</h3>
                <input type="text" id="p-name" placeholder="שם הפרויקט">
                <input type="text" id="p-contractor" placeholder="קבלן">
                <input type="number" id="p-cost" placeholder="עלות">
                <input type="number" id="p-price" placeholder="מכירה">
                <button class="btn btn-orange" onclick="addProject()">שמור פרויקט</button>
            </div>
            <div id="projects-list-mobile"></div>
        </div>

        <div id="contacts" class="tab-content">
            <div class="card">
                <h3>הוסף איש קשר</h3>
                <input type="text" id="c-name" placeholder="שם מלא">
                <input type="tel" id="c-phone" placeholder="טלפון">
                <button class="btn btn-blue" onclick="addContact()">הוסף לרשימה</button>
            </div>
            <div id="contacts-list-mobile"></div>
        </div>

        <div id="quote" class="tab-content">
            <div class="card">
                <h3>הצעה בוואטסאפ</h3>
                <input type="text" id="q-client" placeholder="שם הלקוח">
                <textarea id="q-desc" placeholder="פירוט עבודה..." rows="3"></textarea>
                <input type="number" id="q-amount" placeholder="סכום לפני מע''מ" oninput="calcQ()">
                <div style="background:#000; padding:15px; border-radius:12px; margin:15px 0; text-align:center;">
                    <span style="color:var(--gray)">סה''כ כולל מע''מ</span>
                    <h1 id="q-total" style="margin:5px 0; color:var(--orange)">0 ₪</h1>
                </div>
                <button class="btn btn-orange" style="background:#25d366;" onclick="sendWA()">שלח הצעה ✉️</button>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="showTab('dashboard', this)"><span>📊</span>דוחות</div>
        <div class="nav-item" onclick="showTab('projects', this)"><span>📂</span>פרויקטים</div>
        <div class="nav-item" onclick="showTab('contacts', this)"><span>👥</span>קשר</div>
        <div class="nav-item" onclick="showTab('quote', this)"><span>✉️</span>הצעה</div>
    </div>

    <div id="calc-trigger" onclick="alert('בנייד מומלץ להשתמש במחשבון הטלפון לנוחות מירבית')">🧮</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBb-7PPYP2GFIPMVnMlJRT2U5jBxDsg_vM", authDomain: "nmr-projects.firebaseapp.com", projectId: "nmr-projects", storageBucket: "nmr-projects.appspot.com", messagingSenderId: "635398254882", appId: "1:635398254882:web:785f7a0b5a3e1458e08d66" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.showTab = (id, el) => {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
            window.scrollTo(0,0);
        };

        window.addProject = async () => {
            await addDoc(collection(db, "projects_pro"), { name: document.getElementById('p-name').value, contractor: document.getElementById('p-contractor').value, cost: parseFloat(document.getElementById('p-cost').value)||0, price: parseFloat(document.getElementById('p-price').value)||0 });
            location.reload();
        };

        window.addContact = async () => {
            await addDoc(collection(db, "contacts"), { name: document.getElementById('c-name').value, phone: document.getElementById('c-phone').value });
            location.reload();
        };

        window.del = async (c, id) => { if(confirm("למחוק?")) { await deleteDoc(doc(db, c, id)); location.reload(); } };

        window.calcQ = () => { const v = parseFloat(document.getElementById('q-amount').value)||0; document.getElementById('q-total').innerText = (v*1.18).toLocaleString() + ' ₪'; };
        
        window.sendWA = () => { window.open(`https://wa.me/?text=${encodeURIComponent("הצעה מ-NMR PERFORMANCE ל"+document.getElementById('q-client').value+": "+document.getElementById('q-total').innerText)}`); };

        async function load() {
            const pSnap = await getDocs(collection(db, "projects_pro"));
            let s=0, c=0;
            pSnap.forEach(d => {
                const p = d.data(); s+=p.price; c+=p.cost;
                document.getElementById('profit-list-mobile').innerHTML += `
                    <div class="list-item">
                        <div class="list-info"><span class="list-title">${p.name}</span><span class="list-sub">רווח: ${(p.price-p.cost).toLocaleString()} ₪</span></div>
                        <span style="color:var(--success); font-weight:800;">${Math.round(((p.price-p.cost)/p.price)*100)}%</span>
                    </div>`;
                document.getElementById('projects-list-mobile').innerHTML += `
                    <div class="list-item">
                        <div class="list-info"><span class="list-title">${p.name}</span><span class="list-sub">קבלן: ${p.contractor}</span></div>
                        <button onclick="del('projects_pro','${d.id}')" style="background:none; border:none; color:var(--danger)">מחק</button>
                    </div>`;
            });
            document.getElementById('m-sales').innerText = s.toLocaleString() + ' ₪';
            document.getElementById('m-costs').innerText = c.toLocaleString() + ' ₪';
            document.getElementById('m-profit').innerText = (s-c).toLocaleString() + ' ₪';

            const cSnap = await getDocs(collection(db, "contacts"));
            cSnap.forEach(d => {
                document.getElementById('contacts-list-mobile').innerHTML += `
                    <div class="list-item">
                        <div class="list-info"><span class="list-title">${d.data().name}</span><span class="list-sub">${d.data().phone}</span></div>
                        <a href="tel:${d.data().phone}" style="text-decoration:none;">📞</a>
                    </div>`;
            });
        }
        load();
    </script>
</body>
</html>
