<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>נ.מ.ר - NEXT GEN AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg: #05070a;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent: #00f2ff;
            --secondary: #7000ff;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --green: #00ff9d;
            --red: #ff4b5c;
            --radius-lg: 24px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Heebo', sans-serif; }
        body { background: radial-gradient(circle at top right, #0a0f1d, #05070a); color: var(--text); direction: rtl; min-height: 100vh; overflow-x: hidden; }

        .glass-card { background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 15px; }

        #auth-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 25px; }
        #app-content { display: none; }

        header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass-border); }
        .logo { font-size: 24px; font-weight: 900; background: linear-gradient(to right, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .nav-tabs { display: flex; overflow-x: auto; margin: 15px; background: rgba(255,255,255,0.02); padding: 5px; border-radius: 20px; gap: 5px; scrollbar-width: none; }
        .tab { flex: 1; min-width: 80px; padding: 12px; text-align: center; border-radius: 15px; font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer; white-space: nowrap; transition: 0.3s; }
        .tab.active { background: var(--accent); color: #000; box-shadow: 0 0 15px rgba(0,242,255,0.3); }

        main { padding: 0 15px 120px; max-width: 800px; margin: 0 auto; }
        .page { display: none; animation: slideUp 0.4s ease; }
        .page.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        input, select, textarea { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 16px; padding: 16px; color: white; margin-bottom: 12px; outline: none; font-size: 16px; }
        input:focus { border-color: var(--accent); }
        .btn-main { background: var(--accent); color: #000; padding: 18px; border-radius: 16px; border: none; font-weight: 900; width: 100%; cursor: pointer; font-size: 16px; box-shadow: 0 5px 15px rgba(0,242,255,0.2); }

        /* AI Chat */
        #ai-chat-box { height: 400px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px; padding: 10px; border-radius: 15px; background: rgba(0,0,0,0.2); }
        .msg { padding: 14px 18px; border-radius: 20px; max-width: 80%; font-size: 15px; line-height: 1.5; }
        .msg.user { background: var(--secondary); align-self: flex-start; color: white; border-bottom-left-radius: 4px; }
        .msg.ai { background: var(--glass-border); align-self: flex-end; color: var(--text); border-bottom-right-radius: 4px; }

        /* Floating Actions */
        #calc-bubble { position: fixed; right: 20px; bottom: 30px; width: 60px; height: 60px; background: var(--secondary); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 24px; z-index: 100; box-shadow: 0 0 20px rgba(112,0,255,0.4); cursor: pointer; }
        #calculator { display: none; position: fixed; right: 20px; bottom: 100px; width: 280px; background: #0d1117; border: 1px solid var(--secondary); border-radius: 24px; padding: 20px; z-index: 100; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        .fab { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #fff; color: #000; padding: 16px 35px; border-radius: 40px; font-weight: 900; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 90; cursor: pointer; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="glass-card" style="width:100%; max-width:400px; text-align:center;">
        <div class="logo" style="font-size:42px; margin-bottom:10px;">N.M.R</div>
        <p style="color:var(--text-muted); margin-bottom:30px;">ניהול פרויקטים וביצוע</p>
        <input type="email" id="login-email" placeholder="אימייל">
        <input type="password" id="login-pass" placeholder="סיסמה">
        <button class="btn-main" onclick="handleAuth('login')">כניסה למערכת</button>
        <button style="background:none; border:none; color:var(--text-muted); margin-top:20px; font-size:13px; cursor:pointer;" onclick="handleAuth('signup')">אין לך חשבון? הרשם כאן</button>
    </div>
</div>

<div id="app-content">
    <header>
        <div class="logo">N.M.R <span style="font-size:12px; color:var(--text-muted); font-weight:400;">BUILDER</span></div>
        <button onclick="logout()" style="background:rgba(255,75,92,0.1); border:none; color:var(--red); padding:8px 15px; border-radius:12px; font-weight:700; font-size:12px; cursor:pointer;">יציאה</button>
    </header>

    <div class="nav-tabs">
        <div class="tab active" id="t-dash" onclick="showPage('dash')">📊 דשבורד</div>
        <div class="tab" id="t-projs" onclick="showPage('projs')">🏗️ פרויקטים</div>
        <div class="tab" id="t-quote" onclick="showPage('quote')">📄 הצעות מחיר</div>
        <div class="tab" id="t-ai" onclick="showPage('ai')">✨ היועץ AI</div>
    </div>

    <main>
        <div class="page active" id="p-dash">
            <div class="admin-only" style="display:none;">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:20px;">
                    <div class="glass-card" style="border-right: 4px solid var(--green)">
                        <div style="font-size:11px; color:var(--text-muted); text-transform:uppercase;">רווח נקי</div>
                        <div style="font-size:24px; font-weight:900; color:var(--green);" id="total-profit">₪0</div>
                    </div>
                    <div class="glass-card" style="border-right: 4px solid var(--red)">
                        <div style="font-size:11px; color:var(--text-muted); text-transform:uppercase;">הוצאות</div>
                        <div style="font-size:24px; font-weight:900; color:var(--red);" id="total-costs">₪0</div>
                    </div>
                </div>
            </div>
            <div class="glass-card" style="text-align:center; background: linear-gradient(135deg, rgba(112,0,255,0.05), rgba(0,242,255,0.05))">
                <div style="font-size:11px; color:var(--text-muted);">פרויקטים פעילים בשטח</div>
                <div style="font-size:48px; font-weight:900;" id="count-active">0</div>
            </div>
        </div>

        <div class="page" id="p-projs"><div id="project-list"></div></div>

        <div class="page" id="p-quote">
            <div class="glass-card">
                <input type="text" id="q-client" placeholder="שם הלקוח">
                <textarea id="q-work" rows="4" placeholder="תיאור העבודה... (ניתן להיעזר ביועץ AI לניסוח)"></textarea>
                <input type="number" id="q-price" placeholder="מחיר בסיס (₪)">
                <button class="btn-main" onclick="generateQuote()">הפק הצעת מחיר</button>
            </div>
            <div id="quote-result" style="display:none; background:white; color:black; padding:30px; border-radius:24px; margin-top:20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);"></div>
        </div>

        <div class="page" id="p-ai">
            <div class="glass-card">
                <div id="ai-chat-box">
                    <div class="msg ai">אהלן רן, אני כאן לעזור לך בחישובים, ניסוחים או ייעוץ טכני. מה על הפרק?</div>
                </div>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="ai-input" placeholder="שאל אותי משהו..." style="margin-bottom:0;">
                    <button onclick="askAI()" style="background:var(--accent); border:none; padding:0 20px; border-radius:16px; cursor:pointer; font-size:20px;">🚀</button>
                </div>
            </div>
        </div>
    </main>

    <div id="calc-bubble" onclick="toggleCalc()">🧮</div>
    <div id="calculator">
        <div id="calc-display" style="background:#000; padding:15px; border-radius:12px; margin-bottom:15px; text-align:left; font-size:26px; color:var(--accent); font-family: monospace;">0</div>
        <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:10px;">
            <button class="btn-main" style="padding:12px; background:#333; color:#fff;" onclick="clearCalc()">C</button>
            <button class="btn-main" style="padding:12px; background:var(--secondary); color:#fff;" onclick="pressCalc('/')">/</button>
            <button class="btn-main" style="padding:12px; background:var(--secondary); color:#fff;" onclick="pressCalc('*')">×</button>
            <button class="btn-main" style="padding:12px; background:var(--secondary); color:#fff;" onclick="pressCalc('-')">-</button>
            <button class="btn-main" style="padding:12px; background:#1a1f2e; color:#fff;" onclick="pressCalc('7')">7</button>
            <button class="btn-main" style="padding:12px; background:#1a1f2e; color:#fff;" onclick="pressCalc('8')">8</button>
            <button class="btn-main" style="padding:12px; background:#1a1f2e; color:#fff;" onclick="pressCalc('9')">9</button>
            <button class="btn-main" style="padding:12px; background:var(--secondary); color:#fff;" onclick="pressCalc('+')">+</button>
            <button class="btn-main" style="padding:12px; background:var(--accent); color:#000; grid-column: span 2;" onclick="solveCalc()">=</button>
            <button class="btn-main" style="padding:12px; background:#1a1f2e; color:#fff;" onclick="pressCalc('0')">0</button>
            <button class="btn-main" style="padding:12px; background:#1a1f2e; color:#fff;" onclick="pressCalc('.')">.</button>
        </div>
    </div>

    <button class="fab" id="fab" onclick="openModal()">＋ פרויקט חדש</button>
</div>

<div id="modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:200; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(10px);">
    <div class="glass-card" style="width:100%; max-width:400px; background:#0d1117;">
        <h2 style="margin-bottom:20px;">פרויקט חדש</h2>
        <input type="text" id="new-name" placeholder="שם הפרויקט">
        <select id="new-status"><option value="ביצוע">בביצוע</option><option value="הושלם">הושלם</option></select>
        <input type="number" id="new-prog" placeholder="% התקדמות">
        <div class="admin-only">
            <input type="number" id="new-income" placeholder="הכנסה צפויה (₪)">
            <input type="number" id="new-costs" placeholder="הוצאות (₪)">
        </div>
        <button class="btn-main" onclick="saveProject()">שמור במערכת</button>
        <button style="background:none; border:none; color:var(--text-muted); width:100%; margin-top:15px; cursor:pointer;" onclick="closeModal()">ביטול</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBb-7PPYP2GFIPMVnMlJRT2U5jBxDsg_vM",
        authDomain: "nmr-projects.firebaseapp.com",
        projectId: "nmr-projects",
        storageBucket: "nmr-projects.firebasestorage.app",
        messagingSenderId: "780228662939",
        appId: "1:780228662939:web:48931d5bccaa568b66583e"
    };

    const IMGBB_KEY = "7b48854ed8b84c2bfe8932316528448c";
    const GEMINI_KEY = "AIzaSyDBoI8k8TZTfqVcd7_zpP70vjWYQp1R0lw"; 
    const ADMIN_EMAIL = "ransabah2@gmail.com";

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
            if (user.email === ADMIN_EMAIL) document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
            loadProjects();
        } else {
            document.getElementById('auth-screen').style.display = 'flex';
            document.getElementById('app-content').style.display = 'none';
        }
    });

    async function handleAuth(type) {
        const e = document.getElementById('login-email').value;
        const p = document.getElementById('login-pass').value;
        try {
            if (type === 'login') await auth.signInWithEmailAndPassword(e, p);
            else await auth.createUserWithEmailAndPassword(e, p);
        } catch (err) { alert("שגיאה: " + err.message); }
    }

    function logout() { auth.signOut(); }
    function showPage(p) {
        document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('p-'+p).classList.add('active');
        document.getElementById('t-'+p).classList.add('active');
        document.getElementById('fab').style.display = (p === 'projs' || p === 'dash') ? 'block' : 'none';
    }

    async function askAI() {
        const input = document.getElementById('ai-input');
        const chatBox = document.getElementById('ai-chat-box');
        if (!input.value) return;
        const userMsg = input.value;
        input.value = '';
        chatBox.innerHTML += `<div class="msg user">${userMsg}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: `אתה עוזר אישי למנהל פרויקטים בשם רן מחברת נ.מ.ר. ענה בקיצור, במקצועיות ובעברית בלבד. שאלה: ${userMsg}` }] }] })
            });
            const data = await res.json();
            const aiText = data.candidates[0].content.parts[0].text;
            chatBox.innerHTML += `<div class="msg ai">${aiText}</div>`;
        } catch (e) { chatBox.innerHTML += `<div class="msg ai">רן, יש לי בעיית חיבור זמנית. נסה שוב.</div>`; }
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function openModal() { document.getElementById('modal').style.display = 'flex'; }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    async function saveProject() {
        await db.collection('projects').add({
            name: document.getElementById('new-name').value,
            status: document.getElementById('new-status').value,
            prog: Number(document.getElementById('new-prog').value) || 0,
            income: Number(document.getElementById('new-income').value) || 0,
            costs: Number(document.getElementById('new-costs').value) || 0,
            images: [],
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        closeModal();
    }

    async function uploadToImgBB(id, file) {
        let fd = new FormData(); fd.append("image", file);
        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: "POST", body: fd });
        const json = await res.json();
        await db.collection('projects').doc(id).update({ images: firebase.firestore.FieldValue.arrayUnion(json.data.url) });
    }

    function loadProjects() {
        db.collection('projects').orderBy('timestamp', 'desc').onSnapshot(snap => {
            let html = ''; let prof = 0; let cost = 0; let active = 0;
            snap.forEach(doc => {
                const p = doc.data(); const id = doc.id;
                if(p.status === 'ביצוע') active++;
                prof += (p.income - p.costs); cost += p.costs;
                let imgs = (p.images || []).map(i => `<img src="${i}" onclick="window.open('${i}')">`).join('');
                html += `
                <div class="glass-card">
                    <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                        <h3 style="font-weight:900;">${p.name}</h3>
                        <span style="font-size:10px; background:rgba(0,242,255,0.1); color:var(--accent); padding:4px 10px; border-radius:10px;">${p.status}</span>
                    </div>
                    <div style="height:6px; background:rgba(255,255,255,0.1); border-radius:10px; overflow:hidden; margin-bottom:10px;">
                        <div style="height:100%; background:var(--accent); width:${p.prog}%"></div>
                    </div>
                    <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--text-muted); margin-bottom:15px;">
                        <span>${p.prog}% ביצוע</span>
                        ${auth.currentUser.email === ADMIN_EMAIL ? `<span style="color:var(--green); font-weight:700">₪${(p.income-p.costs).toLocaleString()}</span>` : ''}
                    </div>
                    <div class="image-strip" style="display:flex; gap:10px; overflow-x:auto;">${imgs}</div>
                    <label style="display:block; margin-top:15px; text-align:center; color:var(--accent); font-size:13px; font-weight:700; cursor:pointer;">📸 הוסף תמונת שטח<input type="file" style="display:none" onchange="uploadToImgBB('${id}', this.files[0])"></label>
                </div>`;
            });
            document.getElementById('project-list').innerHTML = html;
            document.getElementById('count-active').innerText = active;
            document.getElementById('total-profit').innerText = '₪' + prof.toLocaleString();
            document.getElementById('total-costs').innerText = '₪' + cost.toLocaleString();
        });
    }

    let cv = "0";
    function toggleCalc() { let c = document.getElementById('calculator'); c.style.display = (c.style.display==='block')?'none':'block'; }
    function pressCalc(v) { if(cv==="0") cv=v; else cv+=v; document.getElementById('calc-display').innerText = cv; }
    function clearCalc() { cv="0"; document.getElementById('calc-display').innerText="0"; }
    function solveCalc() { try { cv=eval(cv).toString(); document.getElementById('calc-display').innerText=cv; } catch(e){ cv="Error"; } }

    function generateQuote() {
        const c = document.getElementById('q-client').value;
        const p = Number(document.getElementById('q-price').value);
        const vat = Math.round(p * 0.18);
        const t = p + vat;
        document.getElementById('quote-result').style.display = 'block';
        document.getElementById('quote-result').innerHTML = `
            <div style="text-align:center; border-bottom:2px solid var(--secondary); padding-bottom:15px; margin-bottom:20px;">
                <h2 style="color:var(--secondary);">נ.מ.ר - הצעת מחיר</h2>
            </div>
            <p><strong>לכבוד:</strong> ${c}</p>
            <p style="margin:15px 0;"><strong>פירוט העבודה:</strong><br>${document.getElementById('q-work').value}</p>
            <div style="background:#f8f9fa; padding:15px; border-radius:15px;">
                <div style="display:flex; justify-content:space-between;"><span>סה"כ לפני מע"מ:</span> <span>₪${p.toLocaleString()}</span></div>
                <div style="display:flex; justify-content:space-between; font-size:13px; color:#666;"><span>מע"מ (18%):</span> <span>₪${vat.toLocaleString()}</span></div>
                <hr style="margin:10px 0; border:none; border-top:1px solid #ddd;">
                <div style="display:flex; justify-content:space-between; font-weight:900; font-size:22px;"><span>לתשלום:</span> <span>₪${t.toLocaleString()}</span></div>
            </div>`;
    }
</script>
</body>
</html>
