<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>N.M.R - Control Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --bg: #05070a; --card: #111827; --accent: #00f2ff; --purple: #7000ff; --danger: #ff4b5c; --text: #f3f4f6; --border: rgba(255,255,255,0.1); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Heebo', sans-serif; }
        body { background: var(--bg); color: var(--text); direction: rtl; min-height: 100vh; }

        #auth-screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .auth-card { background: var(--card); padding: 30px; border-radius: 24px; border: 1px solid var(--border); width: 100%; max-width: 380px; text-align: center; }

        header { padding: 15px 20px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .s-card { background: #1f2937; padding: 12px; border-radius: 15px; text-align: center; border: 1px solid var(--border); }
        .s-card h2 { color: var(--accent); font-size: 22px; }

        nav { display: flex; background: #000; padding: 8px; gap: 5px; position: sticky; top: 0; z-index: 100; overflow-x: auto; }
        .tab { flex: 1; min-width: 80px; padding: 10px; text-align: center; border-radius: 10px; cursor: pointer; background: #1f2937; color: #9ca3af; font-size: 13px; font-weight: bold; }
        .tab.active { background: var(--accent); color: #000; }

        main { padding: 15px; max-width: 600px; margin: 0 auto; padding-bottom: 100px; }
        .page { display: none; }
        .page.active { display: block; }
        .glass { background: var(--card); padding: 15px; border-radius: 20px; border: 1px solid var(--border); margin-bottom: 15px; }
        
        input, select, textarea { width: 100%; padding: 12px; margin: 6px 0; border-radius: 10px; border: 1px solid var(--border); background: #030712; color: white; font-size: 16px; }
        .btn-main { width: 100%; padding: 15px; background: var(--accent); border: none; border-radius: 10px; font-weight: 900; cursor: pointer; }

        .p-card { background: var(--card); padding: 15px; border-radius: 15px; margin-bottom: 10px; border-right: 4px solid var(--accent); position: relative; }
        .p-actions { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-edit { background: var(--purple); color: white; padding: 8px 12px; border-radius: 8px; font-size: 12px; border: none; cursor: pointer; }
        .btn-delete { background: var(--danger); color: white; padding: 8px 12px; border-radius: 8px; font-size: 12px; border: none; cursor: pointer; }

        #calc-btn { position: fixed; left: 20px; bottom: 30px; width: 60px; height: 60px; background: var(--purple); border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 28px; z-index: 1000; cursor: pointer; }
        #calc-ui { display: none; position: fixed; left: 20px; bottom: 100px; width: 280px; background: #111827; border: 2px solid var(--purple); border-radius: 20px; padding: 15px; z-index: 1000; }
        .c-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .c-btn { background: #1f2937; border: none; color: white; padding: 15px; font-size: 18px; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-card">
            <h1 style="color:var(--accent);">N.M.R LOGIN</h1>
            <input type="email" id="l-email" placeholder="אימייל">
            <input type="password" id="l-pass" placeholder="סיסמה">
            <button class="btn-main" onclick="handleAuth()">כניסה</button>
        </div>
    </div>

    <div id="app-body" style="display:none;">
        <header>
            <h2 style="color:var(--accent);">N.M.R</h2>
            <button onclick="firebase.auth().signOut()" style="background:none; border:none; color:#ff4b5c;">יציאה</button>
        </header>

        <div class="stats">
            <div class="s-card"><p>פרויקטים</p><h2 id="st-count">0</h2></div>
            <div class="s-card"><p>רווח נקי (₪)</p><h2 id="st-profit">0</h2></div>
        </div>

        <nav>
            <div class="tab active" onclick="showP('dash', this)">🏠 פתיחה</div>
            <div class="tab" onclick="showP('list', this)">🏗️ ניהול</div>
            <div class="tab" onclick="showP('pdf', this)">📄 הצעה</div>
            <div class="tab" onclick="showP('ai', this)">🤖 AI</div>
        </nav>

        <main>
            <div id="pg-dash" class="page active">
                <div class="glass">
                    <h3>פרויקט חדש</h3>
                    <input type="text" id="in-t" placeholder="שם הפרויקט">
                    <input type="text" id="in-c" placeholder="לקוח">
                    <div style="display:flex; gap:10px;">
                        <input type="number" id="in-cost" placeholder="מחיר עלות">
                        <input type="number" id="in-sell" placeholder="מחיר מכירה">
                    </div>
                    <select id="in-s">
                        <option value="בביצוע">בביצוע</option>
                        <option value="הצעה">הצעה</option>
                        <option value="הושלם">הושלם</option>
                    </select>
                    <button class="btn-main" onclick="saveProject()">צור פרויקט</button>
                </div>
            </div>

            <div id="pg-list" class="page">
                <div id="list-container"></div>
            </div>

            <div id="pg-pdf" class="page">
                <div class="glass">
                    <h3>יצירת הצעת מחיר</h3>
                    <input type="text" id="pdf-client" placeholder="לכבוד: שם הלקוח">
                    <textarea id="pdf-desc" placeholder="תיאור העבודה..." rows="4"></textarea>
                    <input type="number" id="pdf-price" placeholder="מחיר כולל מע''מ">
                    <button class="btn-main" style="background:#22c55e;" onclick="generatePDF()">הורד PDF ושתף</button>
                </div>
            </div>

            <div id="pg-ai" class="page">
                <div id="chat-box" style="height:250px; background:#000; padding:10px; border-radius:10px; overflow-y:auto; margin-bottom:10px;"></div>
                <input type="text" id="ai-msg" placeholder="שאל את המומחה...">
                <button class="btn-main" onclick="askAI()">שלח</button>
            </div>
        </main>
    </div>

    <div id="calc-btn" onclick="toggleCalc()">🧮</div>
    <div id="calc-ui">
        <div id="c-res" style="background:#000; padding:10px; border-radius:8px; margin-bottom:10px; text-align:left; font-size:22px; color:var(--accent);">0</div>
        <div class="c-grid">
            <button class="c-btn" onclick="cClear()">C</button>
            <button class="c-btn" onclick="cPress('/')">/</button>
            <button class="c-btn" onclick="cPress('*')">×</button>
            <button class="c-btn" onclick="cPress('-')">-</button>
            <button class="c-btn" onclick="cPress('7')">7</button>
            <button class="c-btn" onclick="cPress('8')">8</button>
            <button class="c-btn" onclick="cPress('9')">9</button>
            <button class="c-btn" onclick="cPress('+')">+</button>
            <button class="c-btn" onclick="cSolve()" style="background:var(--accent); color:#000;">=</button>
            <button class="c-btn" onclick="cPress('4')">4</button>
            <button class="c-btn" onclick="cPress('5')">5</button>
            <button class="c-btn" onclick="cPress('6')">6</button>
            <button class="c-btn" onclick="cPress('0')">0</button>
        </div>
    </div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyBb-7PPYP2GFIPMVnMlJRT2U5jBxDsg_vM", authDomain: "nmr-projects.firebaseapp.com", projectId: "nmr-projects", storageBucket: "nmr-projects.appspot.com", messagingSenderId: "780228662939", appId: "1:780228662939:web:48931d5bccaa568b66583e" };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth(), db = firebase.firestore();

    auth.onAuthStateChanged(user => {
        document.getElementById('auth-screen').style.display = user ? 'none' : 'flex';
        document.getElementById('app-body').style.display = user ? 'block' : 'none';
        if(user) loadData();
    });

    async function handleAuth() {
        const e = document.getElementById('l-email').value, p = document.getElementById('l-pass').value;
        try { await auth.signInWithEmailAndPassword(e, p); } catch(err) { alert(err.message); }
    }

    function showP(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('pg-'+id).classList.add('active');
        el.classList.add('active');
    }

    async function saveProject() {
        const title = document.getElementById('in-t').value;
        const cost = Number(document.getElementById('in-cost').value) || 0;
        const sell = Number(document.getElementById('in-sell').value) || 0;
        if(!title) return alert("שם פרויקט חובה");

        await db.collection('projs').add({
            title, client: document.getElementById('in-c').value,
            cost, sell, profit: sell - cost, status: document.getElementById('in-s').value,
            notes: '', time: Date.now()
        });
        alert("נשמר!");
        showP('list', document.querySelectorAll('.tab')[1]);
    }

    // פונקציית מחיקה
    async function deleteProject(id) {
        if(confirm("האם אתה בטוח שברצונך למחוק את הפרויקט לצמיתות?")) {
            try {
                await db.collection('projs').doc(id).delete();
                alert("הפרויקט נמחק");
            } catch(e) { alert("שגיאה במחיקה: " + e.message); }
        }
    }

    function loadData() {
        db.collection('projs').orderBy('time', 'desc').onSnapshot(snap => {
            const container = document.getElementById('list-container');
            let count = 0, totalProfit = 0;
            container.innerHTML = '';
            snap.forEach(doc => {
                const p = doc.data();
                count++; totalProfit += p.profit;
                container.innerHTML += `
                    <div class="p-card">
                        <div style="float:left; text-align:left;">
                            <span style="color:var(--accent); font-weight:bold;">₪${p.profit} רווח</span>
                        </div>
                        <strong>${p.title}</strong><br>
                        <small>${p.client} | ${p.status}</small>
                        <div class="p-actions">
                            <button class="btn-edit" onclick="toggleEdit('${doc.id}')">📝 הערות</button>
                            <button class="btn-delete" onclick="deleteProject('${doc.id}')">🗑️ מחיקה</button>
                        </div>
                        <div id="notes-${doc.id}" style="display:none; margin-top:10px;">
                            <textarea id="txt-${doc.id}" placeholder="הוסף הערות...">${p.notes}</textarea>
                            <button onclick="updateNotes('${doc.id}')" style="width:100%; padding:8px; background:var(--accent); border:none; border-radius:8px; color:black; font-weight:bold;">עדכן הערות</button>
                        </div>
                    </div>`;
            });
            document.getElementById('st-count').innerText = count;
            document.getElementById('st-profit').innerText = totalProfit.toLocaleString();
        });
    }

    function toggleEdit(id) {
        const div = document.getElementById('notes-'+id);
        div.style.display = div.style.display === 'none' ? 'block' : 'none';
    }

    async function updateNotes(id) {
        const val = document.getElementById('txt-'+id).value;
        await db.collection('projs').doc(id).update({ notes: val });
        alert("עודכן");
    }

    function generatePDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ format: 'a4' });
        const client = document.getElementById('pdf-client').value;
        const desc = document.getElementById('pdf-desc').value;
        const price = document.getElementById('pdf-price').value;

        doc.text("N.M.R PROJECTS", 10, 10);
        doc.text("Client: " + client, 10, 20);
        doc.text("Description: " + desc, 10, 30);
        doc.text("Total: " + price + " NIS", 10, 60);
        doc.save(`NMR_${client}.pdf`);
    }

    // מחשבון
    let cur = "0";
    function toggleCalc() { const u = document.getElementById('calc-ui'); u.style.display = u.style.display==='block'?'none':'block'; }
    function cPress(v) { if(cur==="0") cur=v; else cur+=v; document.getElementById('c-res').innerText=cur; }
    function cClear() { cur="0"; document.getElementById('c-res').innerText="0"; }
    function cSolve() { try { cur=eval(cur).toString(); document.getElementById('c-res').innerText=cur; } catch(e){ cur="Error"; } }
</script>
</body>
</html>
