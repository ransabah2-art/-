<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>N.M.R - AI Control Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --bg: #05070a; --card: #111827; --accent: #00f2ff; --purple: #7000ff; --danger: #ff4b5c; --text: #f3f4f6; --border: rgba(255,255,255,0.1); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Heebo', sans-serif; }
        body { background: var(--bg); color: var(--text); direction: rtl; min-height: 100vh; overflow-x: hidden; }

        #auth-screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .auth-card { background: var(--card); padding: 30px; border-radius: 24px; border: 1px solid var(--border); width: 100%; max-width: 380px; text-align: center; }

        header { padding: 15px 20px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .s-card { background: #1f2937; padding: 12px; border-radius: 15px; text-align: center; border: 1px solid var(--border); }
        .s-card h2 { color: var(--accent); font-size: 22px; }

        nav { display: flex; background: #000; padding: 8px; gap: 5px; position: sticky; top: 0; z-index: 100; }
        .tab { flex: 1; padding: 10px; text-align: center; border-radius: 10px; cursor: pointer; background: #1f2937; color: #9ca3af; font-size: 13px; font-weight: bold; }
        .tab.active { background: var(--accent); color: #000; }

        main { padding: 15px; max-width: 600px; margin: 0 auto; padding-bottom: 100px; }
        .page { display: none; }
        .page.active { display: block; }
        .glass { background: var(--card); padding: 15px; border-radius: 20px; border: 1px solid var(--border); margin-bottom: 15px; }
        
        input, select, textarea { width: 100%; padding: 12px; margin: 6px 0; border-radius: 10px; border: 1px solid var(--border); background: #030712; color: white; font-size: 16px; }
        .btn-main { width: 100%; padding: 15px; background: var(--accent); border: none; border-radius: 10px; font-weight: 900; cursor: pointer; transition: 0.3s; }
        .btn-main:active { transform: scale(0.98); }

        /* AI Chat Styles */
        #chat-container { height: 350px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; padding: 5px; }
        .bubble { padding: 12px 16px; border-radius: 18px; max-width: 85%; font-size: 14px; line-height: 1.5; }
        .bubble.u { background: var(--purple); color: white; align-self: flex-start; border-bottom-right-radius: 4px; }
        .bubble.a { background: #374151; color: white; align-self: flex-end; border-bottom-left-radius: 4px; border: 1px solid var(--border); }

        .p-card { background: var(--card); padding: 15px; border-radius: 15px; margin-bottom: 10px; border-right: 4px solid var(--accent); }
        #calc-btn { position: fixed; left: 20px; bottom: 30px; width: 60px; height: 60px; background: var(--purple); border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 28px; z-index: 1000; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        #calc-ui { display: none; position: fixed; left: 20px; bottom: 100px; width: 280px; background: #111827; border: 2px solid var(--purple); border-radius: 20px; padding: 15px; z-index: 1000; }
        .c-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .c-btn { background: #1f2937; border: none; color: white; padding: 15px; font-size: 18px; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-card">
            <h1 style="color:var(--accent); font-weight:900;">N.M.R LOGIN</h1>
            <input type="email" id="l-email" placeholder="אימייל">
            <input type="password" id="l-pass" placeholder="סיסמה">
            <button class="btn-main" onclick="handleAuth()">כניסה למערכת</button>
        </div>
    </div>

    <div id="app-body" style="display:none;">
        <header>
            <h2 style="font-weight:900; color:var(--accent);">N.M.R HUB</h2>
            <button onclick="firebase.auth().signOut()" style="background:none; border:none; color:var(--danger); font-weight:bold;">יציאה</button>
        </header>

        <div class="stats">
            <div class="s-card"><p style="font-size:12px; color:#9ca3af;">פרויקטים</p><h2 id="st-count">0</h2></div>
            <div class="s-card"><p style="font-size:12px; color:#9ca3af;">רווח מצטבר</p><h2 id="st-profit">0</h2></div>
        </div>

        <nav>
            <div class="tab active" onclick="showP('dash', this)">🏠 ראשי</div>
            <div class="tab" onclick="showP('list', this)">🏗️ ניהול</div>
            <div class="tab" onclick="showP('pdf', this)">📄 הצעה</div>
            <div class="tab" onclick="showP('ai', this)">🤖 ה-AI שלי</div>
        </nav>

        <main>
            <div id="pg-dash" class="page active">
                <div class="glass">
                    <h3 style="margin-bottom:10px;">פתיחת פרויקט</h3>
                    <input type="text" id="in-t" placeholder="שם הפרויקט (למשל: שיפוץ אמבטיה)">
                    <input type="text" id="in-c" placeholder="שם הלקוח">
                    <div style="display:flex; gap:10px;">
                        <input type="number" id="in-cost" placeholder="עלות חומרים/פועלים">
                        <input type="number" id="in-sell" placeholder="מחיר ללקוח">
                    </div>
                    <select id="in-s">
                        <option value="בביצוע">בביצוע</option>
                        <option value="הצעה">רק הצעה</option>
                        <option value="הושלם">הושלם</option>
                    </select>
                    <button class="btn-main" onclick="saveProject()">שמור במערכת</button>
                </div>
            </div>

            <div id="pg-list" class="page">
                <div id="list-container"></div>
            </div>

            <div id="pg-pdf" class="page">
                <div class="glass">
                    <h3>מחולל הצעות מחיר</h3>
                    <input type="text" id="pdf-client" placeholder="שם הלקוח">
                    <textarea id="pdf-desc" placeholder="מה כוללת העבודה?" rows="4"></textarea>
                    <input type="number" id="pdf-price" placeholder="מחיר כולל (₪)">
                    <button class="btn-main" style="background:#22c55e; margin-bottom:10px;" onclick="sendWhatsApp()">📱 שלח לווטסאפ</button>
                    <button class="btn-main" style="background:white; color:black;" onclick="generatePDF()">📥 שמור כ-PDF</button>
                </div>
            </div>

            <div id="pg-ai" class="page">
                <div class="glass">
                    <div id="chat-container">
                        <div class="bubble a">שלום רן, אני העוזר החכם שלך. איך אני יכול לעזור בעסק היום?</div>
                    </div>
                    <div style="display:flex; gap:10px;">
                        <input type="text" id="ai-msg" placeholder="כתוב כאן שאלה..." style="margin:0;">
                        <button onclick="askAI()" style="background:var(--accent); border:none; width:60px; border-radius:12px; font-size:20px;">🚀</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="calc-btn" onclick="toggleCalc()">🧮</div>
    <div id="calc-ui">
        <div id="c-res" style="background:#000; padding:10px; border-radius:8px; margin-bottom:10px; text-align:left; font-size:22px; color:var(--accent);">0</div>
        <div class="c-grid">
            <button class="c-btn" onclick="cClear()">C</button>
            <button class="c-btn" onclick="cPress('/')">/</button>
            <button class="c-btn" onclick="cPress('*')">×</button>
            <button class="c-btn" onclick="cPress('-')">-</button>
            <button class="c-btn" onclick="cPress('7')">7</button>
            <button class="c-btn" onclick="cPress('8')">8</button>
            <button class="c-btn" onclick="cPress('9')">9</button>
            <button class="c-btn" onclick="cPress('+')">+</button>
            <button class="c-btn" onclick="cSolve()" style="background:var(--accent); color:#000;">=</button>
            <button class="c-btn" onclick="cPress('4')">4</button>
            <button class="c-btn" onclick="cPress('5')">5</button>
            <button class="c-btn" onclick="cPress('6')">6</button>
            <button class="c-btn" onclick="cPress('0')">0</button>
        </div>
    </div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyBb-7PPYP2GFIPMVnMlJRT2U5jBxDsg_vM", authDomain: "nmr-projects.firebaseapp.com", projectId: "nmr-projects", storageBucket: "nmr-projects.appspot.com", messagingSenderId: "780228662939", appId: "1:780228662939:web:48931d5bccaa568b66583e" };
    const GEMINI_KEY = "AIzaSyAUK-zi5ASJ0KfjbWm9ZAMaaoFhqX_OP58";

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth(), db = firebase.firestore();

    auth.onAuthStateChanged(user => {
        document.getElementById('auth-screen').style.display = user ? 'none' : 'flex';
        document.getElementById('app-body').style.display = user ? 'block' : 'none';
        if(user) loadData();
    });

    async function handleAuth() {
        const e = document.getElementById('l-email').value, p = document.getElementById('l-pass').value;
        try { await auth.signInWithEmailAndPassword(e, p); } catch(err) { alert("פרטי כניסה שגויים"); }
    }

    function showP(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('pg-'+id).classList.add('active');
        el.classList.add('active');
    }

    async function saveProject() {
        const t = document.getElementById('in-t').value, cost = Number(document.getElementById('in-cost').value), sell = Number(document.getElementById('in-sell').value);
        if(!t) return alert("חובה לתת שם לפרויקט");
        await db.collection('projs').add({ title: t, client: document.getElementById('in-c').value, cost, sell, profit: sell-cost, status: document.getElementById('in-s').value, time: Date.now() });
        alert("הפרויקט נוסף בהצלחה!");
        document.getElementById('in-t').value = '';
    }

    function loadData() {
        db.collection('projs').orderBy('time', 'desc').onSnapshot(snap => {
            const container = document.getElementById('list-container');
            let count = 0, profit = 0;
            container.innerHTML = '';
            snap.forEach(doc => {
                const p = doc.data();
                count++; profit += p.profit;
                container.innerHTML += `<div class="p-card"><div style="float:left; color:var(--accent); font-weight:bold;">₪${p.profit}</div><strong>${p.title}</strong><br><small>${p.client} | ${p.status}</small><br><button onclick="deleteP('${doc.id}')" style="background:none; border:none; color:var(--danger); font-size:12px; margin-top:5px; cursor:pointer;">🗑️ מחק פרויקט</button></div>`;
            });
            document.getElementById('st-count').innerText = count;
            document.getElementById('st-profit').innerText = profit.toLocaleString() + " ₪";
        });
    }

    async function deleteP(id) { if(confirm("למחוק פרויקט זה?")) await db.collection('projs').doc(id).delete(); }

    // פונקציית AI משופרת
    async function askAI() {
        const inpt = document.getElementById('ai-msg'), cont = document.getElementById('chat-container');
        if(!inpt.value) return;
        const msg = inpt.value; inpt.value = '';
        cont.innerHTML += `<div class="bubble u">${msg}</div>`;
        cont.scrollTop = cont.scrollHeight;

        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: "אתה עוזר אישי מקצועי של רן, בעל עסק לניהול פרויקטים ובנייה בשם NMR. ענה בעברית ברורה ועניינית: " + msg }] }] })
            });
            const data = await res.json();
            const reply = data.candidates[0].content.parts[0].text;
            cont.innerHTML += `<div class="bubble a">${reply}</div>`;
        } catch(e) {
            cont.innerHTML += `<div class="bubble a" style="color:red;">סליחה רן, יש תקלה בחיבור ל-AI. נסה שוב בעוד רגע.</div>`;
        }
        cont.scrollTop = cont.scrollHeight;
    }

    function sendWhatsApp() {
        const client = document.getElementById('pdf-client').value, desc = document.getElementById('pdf-desc').value, price = document.getElementById('pdf-price').value;
        const text = `שלום ${client},%0Aלהלן הצעת מחיר מ-N.M.R:%0A%0A*תיאור:*%0A${desc}%0A%0A*סה"כ לתשלום:* ₪${price}%0A%0Aנשמח לעמוד לשירותך!`;
        window.open(`https://wa.me/?text=${text}`, '_blank');
    }

    function generatePDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const client = document.getElementById('pdf-client').value, desc = document.getElementById('pdf-desc').value, price = document.getElementById('pdf-price').value;
        doc.text("N.M.R PROJECTS - QUOTATION", 10, 10);
        doc.text(`Client: ${client}`, 10, 25);
        doc.text(`Description: ${desc}`, 10, 40);
        doc.text(`Total Price: ${price} NIS`, 10, 100);
        doc.save(`NMR_Quote_${client}.pdf`);
    }

    let cur = "0";
    function toggleCalc() { const u = document.getElementById('calc-ui'); u.style.display = u.style.display==='block'?'none':'block'; }
    function cPress(v) { if(cur==="0") cur=v; else cur+=v; document.getElementById('c-res').innerText=cur; }
    function cClear() { cur="0"; document.getElementById('c-res').innerText="0"; }
    function cSolve() { try { cur=eval(cur).toString(); document.getElementById('c-res').innerText=cur; } catch(e){ cur="Error"; } }
</script>
</body>
</html>
