<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>נ.מ.ר ביצוע פרויקטים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #222536;
    --border: #2e3147;
    --accent: #f5a623;
    --accent2: #e8873a;
    --text: #eef0f8;
    --text-muted: #7b7f9e;
    --green: #27c985;
    --blue: #4c8ef7;
    --red: #f26464;
    --yellow: #f5c842;
    --radius: 16px;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Heebo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; direction: rtl; }

  /* HEADER */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo { display: flex; align-items: center; gap: 8px; }
  .logo-icon { width: 34px; height: 34px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
  .logo-text { font-size: 15px; font-weight: 800; letter-spacing: -0.3px; line-height: 1.2; }
  .logo-text span { color: var(--accent); }
  .header-actions { display: flex; gap: 8px; }

  /* TABS */
  .tabs {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    gap: 4px;
  }
  .tab {
    padding: 12px 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.18s;
    white-space: nowrap;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* BUTTONS */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 16px;
    border-radius: var(--radius-sm);
    border: none;
    font-family: 'Heebo', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s ease;
    white-space: nowrap;
  }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #111; }
  .btn-primary:hover { opacity: 0.88; transform: translateY(-1px); }
  .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-sm { padding: 7px 12px; font-size: 12px; }
  .btn-icon { padding: 8px; }

  /* MAIN */
  main { padding: 20px 16px 100px; max-width: 640px; margin: 0 auto; }

  /* PAGE */
  .page { display: none; }
  .page.active { display: block; }

  /* STATS */
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 10px; text-align: center; }
  .stat-num { font-size: 24px; font-weight: 800; color: var(--accent); line-height: 1; margin-bottom: 4px; }
  .stat-label { font-size: 10px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }

  /* DASHBOARD OVERVIEW */
  .overview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .overview-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .overview-card-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; font-weight: 600; }
  .overview-card-val { font-size: 22px; font-weight: 800; }
  .overview-card-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  .status-breakdown { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 20px; }
  .status-breakdown-title { font-size: 13px; font-weight: 700; margin-bottom: 14px; }
  .status-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .status-row:last-child { margin-bottom: 0; }
  .status-row-label { font-size: 12px; color: var(--text-muted); width: 50px; flex-shrink: 0; }
  .status-row-bar-wrap { flex: 1; height: 6px; background: var(--surface2); border-radius: 6px; overflow: hidden; }
  .status-row-bar { height: 100%; border-radius: 6px; transition: width 0.5s ease; }
  .status-row-count { font-size: 12px; font-weight: 700; width: 20px; text-align: left; flex-shrink: 0; }

  .recent-activity { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .recent-activity-title { font-size: 13px; font-weight: 700; margin-bottom: 14px; }
  .activity-item { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
  .activity-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
  .activity-text { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
  .activity-text strong { color: var(--text); }

  /* SECTION HEADER */
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .section-title { font-size: 16px; font-weight: 700; }

  /* PROJECT CARD */
  .projects-list { display: flex; flex-direction: column; gap: 10px; }
  .project-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    transition: border-color 0.18s;
    animation: fadeIn 0.3s ease;
    cursor: pointer;
  }
  .project-card:hover { border-color: var(--accent); }
  .project-card-top { display: flex; align-items: center; gap: 12px; }
  .project-color { width: 4px; border-radius: 4px; height: 44px; flex-shrink: 0; }
  .project-info { flex: 1; min-width: 0; }
  .project-name { font-size: 14px; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .project-meta { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .project-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .progress-wrap { margin-top: 10px; }
  .progress-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
  .progress-bar-bg { height: 5px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
  .progress-bar { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 0.4s ease; }

  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; }
  .badge-active { background: rgba(39,201,133,0.15); color: var(--green); }
  .badge-pending { background: rgba(245,200,66,0.15); color: var(--yellow); }
  .badge-done { background: rgba(76,142,247,0.15); color: var(--blue); }
  .badge-paused { background: rgba(123,127,158,0.15); color: var(--text-muted); }

  /* TRACKING */
  .tracking-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-top: 10px; display: none; }
  .tracking-section.open { display: block; }
  .tracking-title { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
  .log-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; max-height: 180px; overflow-y: auto; }
  .log-item { background: var(--surface2); border-radius: 8px; padding: 8px 10px; font-size: 12px; }
  .log-item-date { color: var(--text-muted); font-size: 10px; margin-bottom: 2px; }
  .log-item-text { color: var(--text); line-height: 1.4; }
  .log-input-row { display: flex; gap: 8px; }
  .log-input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; color: var(--text); font-family: 'Heebo', sans-serif; font-size: 13px; outline: none; direction: rtl; }
  .log-input:focus { border-color: var(--accent); }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .empty-state { text-align: center; padding: 48px 20px; color: var(--text-muted); }
  .empty-state .empty-icon { font-size: 44px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; line-height: 1.6; }

  /* MODAL */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(4px);
    z-index: 200;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px 24px 0 0;
    padding: 24px 18px 40px;
    width: 100%;
    max-width: 640px;
    transform: translateY(30px);
    transition: transform 0.3s ease;
    max-height: 88vh;
    overflow-y: auto;
  }
  .overlay.open .modal { transform: translateY(0); }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .modal-title { font-size: 18px; font-weight: 800; }
  .close-btn { width: 32px; height: 32px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--border); color: var(--text-muted); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .close-btn:hover { color: var(--text); }

  /* FORM */
  .form-group { margin-bottom: 14px; }
  label { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.4px; }
  input, select, textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 11px 12px; color: var(--text); font-family: 'Heebo', sans-serif; font-size: 14px; outline: none; transition: border-color 0.18s; direction: rtl; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 80px; }
  select option { background: var(--surface2); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* QUOTE PREVIEW */
  .quote-preview { background: #fff; color: #1a1a1a; border-radius: var(--radius); padding: 24px; margin-top: 18px; font-family: 'Heebo', sans-serif; direction: rtl; }
  .quote-preview-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 2px solid #f0f0f0; }
  .quote-company { font-size: 16px; font-weight: 900; color: #111; }
  .quote-company span { color: #e07b1a; }
  .quote-date { font-size: 11px; color: #888; margin-top: 3px; }
  .quote-to { margin-bottom: 16px; }
  .quote-to-label { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
  .quote-to-name { font-size: 16px; font-weight: 700; color: #111; }
  .quote-desc-label { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .quote-desc { font-size: 13px; color: #333; line-height: 1.6; margin-bottom: 20px; }
  .quote-price-row { background: #f8f8f8; border-radius: 10px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .quote-price-label { font-size: 13px; color: #555; font-weight: 600; }
  .quote-price-val { font-size: 22px; font-weight: 900; color: #111; }
  .quote-price-sub { font-size: 10px; color: #888; }
  .quote-footer { font-size: 10px; color: #aaa; text-align: center; border-top: 1px solid #f0f0f0; padding-top: 12px; }

  /* FAB */
  .fab-row {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 99;
    padding: 0 16px;
  }
  .fab {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 13px 20px;
    border-radius: 30px;
    border: none;
    font-family: 'Heebo', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    transition: all 0.18s;
    white-space: nowrap;
  }
  .fab-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #111; }
  .fab-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(245,166,35,0.4); }
  .fab-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .fab-secondary:hover { border-color: var(--accent); color: var(--accent); }

  /* TOAST */
  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(60px); background: var(--green); color: #0d2318; font-weight: 700; font-size: 13px; padding: 11px 20px; border-radius: 30px; z-index: 999; transition: transform 0.3s ease; white-space: nowrap; }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🏗️</div>
    <div class="logo-text">נ.מ.ר <span>ביצוע פרויקטים</span></div>
  </div>
</header>

<!-- TABS -->
<div class="tabs">
  <div class="tab active" onclick="switchTab('dashboard')">📊 דשבורד</div>
  <div class="tab" onclick="switchTab('projects')">📋 פרויקטים</div>
  <div class="tab" onclick="switchTab('quote')">📄 הצעת מחיר</div>
</div>

<main>

  <!-- PAGE: DASHBOARD -->
  <div class="page active" id="page-dashboard">
    <div style="margin-bottom:16px;margin-top:4px">
      <div style="font-size:20px;font-weight:800;margin-bottom:2px">שלום 👋</div>
      <div style="font-size:13px;color:var(--text-muted)">סקירת כלל הפרויקטים</div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num" id="dash-total">0</div>
        <div class="stat-label">סה״כ</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="dash-active" style="color:var(--green)">0</div>
        <div class="stat-label">פעילים</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="dash-done" style="color:var(--blue)">0</div>
        <div class="stat-label">הושלמו</div>
      </div>
    </div>

    <div class="overview-grid">
      <div class="overview-card">
        <div class="overview-card-title">ממתינים</div>
        <div class="overview-card-val" id="dash-pending" style="color:var(--yellow)">0</div>
        <div class="overview-card-sub">פרויקטים</div>
      </div>
      <div class="overview-card">
        <div class="overview-card-title">מושהים</div>
        <div class="overview-card-val" id="dash-paused" style="color:var(--text-muted)">0</div>
        <div class="overview-card-sub">פרויקטים</div>
      </div>
    </div>

    <div class="status-breakdown">
      <div class="status-breakdown-title">📈 פילוח לפי סטטוס</div>
      <div id="status-bars"></div>
    </div>

    <div class="recent-activity">
      <div class="recent-activity-title">🕐 עדכונים אחרונים</div>
      <div id="recent-list">
        <div style="color:var(--text-muted);font-size:13px;text-align:center;padding:12px 0">אין עדכונים עדיין</div>
      </div>
    </div>
  </div>

  <!-- PAGE: PROJECTS -->
  <div class="page" id="page-projects">
    <div class="section-header" style="margin-top:4px">
      <div class="section-title">📋 פרויקטים</div>
    </div>
    <div class="projects-list" id="projectsList">
      <div class="empty-state">
        <div class="empty-icon">🏚️</div>
        <p>אין פרויקטים עדיין.<br>לחץ על ״＋ פרויקט״ כדי להתחיל.</p>
      </div>
    </div>
  </div>

  <!-- PAGE: QUOTE -->
  <div class="page" id="page-quote">
    <div style="margin-top:4px;margin-bottom:16px;font-size:16px;font-weight:800">📄 הצעת מחיר</div>
    <div id="quoteForm">
      <div class="form-group">
        <label>שם לקוח</label>
        <input type="text" id="qClient" placeholder="ישראל ישראלי">
      </div>
      <div class="form-group">
        <label>תיאור העבודה</label>
        <textarea id="qDesc" placeholder="תיאור מפורט של העבודה המבוצעת..."></textarea>
      </div>
      <div class="form-group">
        <label>מחיר לפני מע״מ (₪)</label>
        <input type="number" id="qPrice" placeholder="50000">
      </div>
      <div style="display:flex;gap:10px;margin-top:8px">
        <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="generateQuote()">צור הצעה</button>
        <button class="btn btn-ghost" style="flex:1;justify-content:center" onclick="clearQuoteForm()">נקה</button>
      </div>
    </div>
    <div id="quotePreviewWrap" style="display:none">
      <div class="quote-preview" id="quotePreview"></div>
      <div style="display:flex;gap:10px;margin-top:14px;padding-bottom:20px">
        <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="copyQuote()">📋 העתק ושתף</button>
        <button class="btn btn-ghost" style="flex:1;justify-content:center" onclick="showQuoteForm()">✏️ ערוך</button>
      </div>
    </div>
  </div>

</main>

<!-- FAB -->
<div class="fab-row" id="fabRow">
  <button class="fab fab-secondary" onclick="switchTab('quote')">📄 הצעת מחיר</button>
  <button class="fab fab-primary" onclick="openProjectModal()">＋ פרויקט</button>
</div>

<!-- MODAL: ADD PROJECT -->
<div class="overlay" id="projectOverlay" onclick="handleOverlayClick(event,'projectOverlay')">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">פרויקט חדש</div>
      <button class="close-btn" onclick="closeModal('projectOverlay')">✕</button>
    </div>
    <div class="form-group">
      <label>שם הפרויקט</label>
      <input type="text" id="projName" placeholder="לדוגמה: בניית וילה בנתניה">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>סטטוס</label>
        <select id="projStatus">
          <option value="active">פעיל</option>
          <option value="pending">ממתין</option>
          <option value="paused">מושהה</option>
          <option value="done">הושלם</option>
        </select>
      </div>
      <div class="form-group">
        <label>% התקדמות</label>
        <input type="number" id="projProgress" min="0" max="100" placeholder="0–100" value="0">
      </div>
    </div>
    <div class="form-group">
      <label>כמות עבודה / תיאור</label>
      <input type="text" id="projWork" placeholder="לדוגמה: 120 ימי עבודה | שלב א׳">
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:4px;padding:13px" onclick="addProject()">הוסף פרויקט</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let projects = JSON.parse(localStorage.getItem('nmr_projects') || '[]');
  let activity = JSON.parse(localStorage.getItem('nmr_activity') || '[]');

  const statusMap = {
    active:  { label: 'פעיל',  cls: 'badge-active',  color: '#27c985' },
    pending: { label: 'ממתין', cls: 'badge-pending', color: '#f5c842' },
    done:    { label: 'הושלם', cls: 'badge-done',    color: '#4c8ef7' },
    paused:  { label: 'מושהה', cls: 'badge-paused',  color: '#7b7f9e' },
  };

  function save() {
    localStorage.setItem('nmr_projects', JSON.stringify(projects));
    localStorage.setItem('nmr_activity', JSON.stringify(activity));
  }

  function addActivityLog(text, color) {
    activity.unshift({ text, color, date: new Date().toLocaleString('he-IL') });
    if (activity.length > 20) activity = activity.slice(0, 20);
  }

  // ── TABS ──
  let currentTab = 'dashboard';
  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach((t, i) => {
      const tabs = ['dashboard','projects','quote'];
      t.classList.toggle('active', tabs[i] === tab);
    });
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + tab).classList.add('active');
    document.getElementById('fabRow').style.display = (tab === 'quote') ? 'none' : 'flex';
    if (tab === 'dashboard') renderDashboard();
    if (tab === 'projects') renderProjects();
  }

  // ── DASHBOARD ──
  function renderDashboard() {
    const total = projects.length;
    const activeN = projects.filter(p => p.status === 'active').length;
    const doneN = projects.filter(p => p.status === 'done').length;
    const pendingN = projects.filter(p => p.status === 'pending').length;
    const pausedN = projects.filter(p => p.status === 'paused').length;

    document.getElementById('dash-total').textContent = total;
    document.getElementById('dash-active').textContent = activeN;
    document.getElementById('dash-done').textContent = doneN;
    document.getElementById('dash-pending').textContent = pendingN;
    document.getElementById('dash-paused').textContent = pausedN;

    // Status bars
    const bars = document.getElementById('status-bars');
    const statuses = [
      { label: 'פעיל', count: activeN, color: '#27c985' },
      { label: 'ממתין', count: pendingN, color: '#f5c842' },
      { label: 'הושלם', count: doneN, color: '#4c8ef7' },
      { label: 'מושהה', count: pausedN, color: '#7b7f9e' },
    ];
    bars.innerHTML = statuses.map(s => {
      const pct = total ? Math.round((s.count / total) * 100) : 0;
      return `<div class="status-row">
        <div class="status-row-label">${s.label}</div>
        <div class="status-row-bar-wrap">
          <div class="status-row-bar" style="width:${pct}%;background:${s.color}"></div>
        </div>
        <div class="status-row-count" style="color:${s.color}">${s.count}</div>
      </div>`;
    }).join('');

    // Recent activity
    const recentEl = document.getElementById('recent-list');
    if (activity.length === 0) {
      recentEl.innerHTML = '<div style="color:var(--text-muted);font-size:13px;text-align:center;padding:12px 0">אין עדכונים עדיין</div>';
    } else {
      recentEl.innerHTML = activity.slice(0, 6).map(a => `
        <div class="activity-item">
          <div class="activity-dot" style="background:${a.color}"></div>
          <div class="activity-text"><strong>${a.text}</strong><br>${a.date}</div>
        </div>`).join('');
    }
  }

  // ── PROJECTS ──
  function renderProjects() {
    const list = document.getElementById('projectsList');
    if (projects.length === 0) {
      list.innerHTML = `<div class="empty-state"><div class="empty-icon">🏚️</div><p>אין פרויקטים עדיין.<br>לחץ על ״＋ פרויקט״ כדי להתחיל.</p></div>`;
      return;
    }
    list.innerHTML = projects.map((p, i) => {
      const s = statusMap[p.status] || statusMap.pending;
      const prog = Math.min(100, Math.max(0, Number(p.progress) || 0));
      const logs = p.logs || [];
      return `
        <div>
          <div class="project-card" onclick="toggleTracking(${i})">
            <div class="project-card-top">
              <div class="project-color" style="background:${s.color}"></div>
              <div class="project-info">
                <div class="project-name">${escHtml(p.name)}</div>
                <div class="project-meta">
                  <span class="badge ${s.cls}">● ${s.label}</span>
                  ${p.work ? `<span>⚒ ${escHtml(p.work)}</span>` : ''}
                </div>
              </div>
              <div class="project-actions">
                <button class="btn btn-ghost btn-sm btn-icon" title="מחק" onclick="event.stopPropagation();deleteProject(${i})">🗑</button>
              </div>
            </div>
            <div class="progress-wrap">
              <div class="progress-label">
                <span>התקדמות</span>
                <span>${prog}%</span>
              </div>
              <div class="progress-bar-bg">
                <div class="progress-bar" style="width:${prog}%"></div>
              </div>
            </div>
          </div>
          <div class="tracking-section" id="tracking-${i}">
            <div class="tracking-title">📝 יומן מעקב — ${escHtml(p.name)}</div>
            <div class="log-list" id="logs-${i}">
              ${logs.length === 0
                ? '<div style="color:var(--text-muted);font-size:12px;text-align:center;padding:8px">אין עדכונים עדיין</div>'
                : logs.map(l => `<div class="log-item"><div class="log-item-date">${l.date}</div><div class="log-item-text">${escHtml(l.text)}</div></div>`).join('')
              }
            </div>
            <div class="log-input-row">
              <input class="log-input" id="log-input-${i}" placeholder="הוסף עדכון..." onkeydown="if(event.key==='Enter')addLog(${i})">
              <button class="btn btn-primary btn-sm" onclick="addLog(${i})">שמור</button>
            </div>
            <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
              <select class="log-input" style="flex:1;min-width:120px" id="status-select-${i}" onchange="updateStatus(${i})">
                <option value="">שנה סטטוס...</option>
                <option value="active">פעיל</option>
                <option value="pending">ממתין</option>
                <option value="paused">מושהה</option>
                <option value="done">הושלם</option>
              </select>
              <input type="number" class="log-input" style="flex:1;min-width:100px" id="prog-input-${i}" placeholder="% התקדמות" min="0" max="100" value="${prog}" onchange="updateProgress(${i})">
            </div>
          </div>
        </div>`;
    }).join('');
  }

  function toggleTracking(i) {
    const el = document.getElementById('tracking-' + i);
    el.classList.toggle('open');
  }

  function addLog(i) {
    const input = document.getElementById('log-input-' + i);
    const text = input.value.trim();
    if (!text) return;
    if (!projects[i].logs) projects[i].logs = [];
    const entry = { text, date: new Date().toLocaleString('he-IL') };
    projects[i].logs.unshift(entry);
    addActivityLog('עדכון ב' + projects[i].name + ': ' + text, statusMap[projects[i].status].color);
    save(); renderProjects();
    setTimeout(() => {
      document.getElementById('tracking-' + i).classList.add('open');
    }, 50);
    showToast('✓ עדכון נשמר');
  }

  function updateStatus(i) {
    const sel = document.getElementById('status-select-' + i);
    const val = sel.value;
    if (!val) return;
    const oldStatus = projects[i].status;
    projects[i].status = val;
    addActivityLog(projects[i].name + ': ' + statusMap[oldStatus].label + ' → ' + statusMap[val].label, statusMap[val].color);
    save(); renderProjects();
    setTimeout(() => document.getElementById('tracking-' + i).classList.add('open'), 50);
    showToast('✓ סטטוס עודכן');
  }

  function updateProgress(i) {
    const inp = document.getElementById('prog-input-' + i);
    const val = Math.min(100, Math.max(0, Number(inp.value) || 0));
    projects[i].progress = val;
    addActivityLog(projects[i].name + ': התקדמות עודכנה ל-' + val + '%', '#f5a623');
    save(); renderProjects();
    setTimeout(() => document.getElementById('tracking-' + i).classList.add('open'), 50);
  }

  function addProject() {
    const name = document.getElementById('projName').value.trim();
    if (!name) { shake('projName'); return; }
    const proj = {
      name,
      status: document.getElementById('projStatus').value,
      progress: document.getElementById('projProgress').value || 0,
      work: document.getElementById('projWork').value.trim(),
      logs: [],
    };
    projects.unshift(proj);
    addActivityLog('פרויקט חדש נוצר: ' + name, '#27c985');
    save();
    closeModal('projectOverlay');
    clearProjectForm();
    switchTab('projects');
    showToast('✓ פרויקט נוסף!');
  }

  function deleteProject(i) {
    if (!confirm('למחוק את הפרויקט?')) return;
    addActivityLog('פרויקט נמחק: ' + projects[i].name, '#f26464');
    projects.splice(i, 1);
    save(); renderProjects();
    if (currentTab === 'dashboard') renderDashboard();
  }

  function clearProjectForm() {
    ['projName','projWork','projProgress'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('projStatus').value = 'active';
  }

  // ── QUOTE ──
  function generateQuote() {
    const client = document.getElementById('qClient').value.trim();
    const desc = document.getElementById('qDesc').value.trim();
    const price = document.getElementById('qPrice').value.trim();
    if (!client || !desc || !price) { showToast('אנא מלא את כל השדות'); return; }
    const today = new Date().toLocaleDateString('he-IL', {year:'numeric',month:'long',day:'numeric'});
    const priceFormatted = Number(price).toLocaleString('he-IL');
    const vat = Math.round(Number(price) * 0.18).toLocaleString('he-IL');
    const total = Math.round(Number(price) * 1.18).toLocaleString('he-IL');
    document.getElementById('quotePreview').innerHTML = `
      <div class="quote-preview-header">
        <div>
          <div class="quote-company">נ.מ.ר <span>ביצוע פרויקטים</span></div>
          <div class="quote-date">הצעת מחיר · ${today}</div>
        </div>
        <div style="text-align:left">
          <div style="font-size:10px;color:#aaa;margin-bottom:2px">מסמך מס׳</div>
          <div style="font-weight:700;color:#333">#${Date.now().toString().slice(-5)}</div>
        </div>
      </div>
      <div class="quote-to">
        <div class="quote-to-label">מוגש לכבוד</div>
        <div class="quote-to-name">${escHtml(client)}</div>
      </div>
      <div class="quote-desc-label">תיאור העבודה</div>
      <div class="quote-desc">${escHtml(desc).replace(/\n/g,'<br>')}</div>
      <div class="quote-price-row">
        <div>
          <div class="quote-price-label">מחיר לפני מע״מ: ₪${priceFormatted}</div>
          <div class="quote-price-sub">+ מע״מ 18%: ₪${vat}</div>
        </div>
        <div style="text-align:left">
          <div style="font-size:10px;color:#aaa;margin-bottom:2px">סה״כ לתשלום</div>
          <div class="quote-price-val">₪${total}</div>
        </div>
      </div>
      <div class="quote-footer">הצעה זו בתוקף ל-30 יום · נ.מ.ר ביצוע פרויקטים</div>
    `;
    document.getElementById('quoteForm').style.display = 'none';
    document.getElementById('quotePreviewWrap').style.display = 'block';
  }

  function showQuoteForm() {
    document.getElementById('quoteForm').style.display = 'block';
    document.getElementById('quotePreviewWrap').style.display = 'none';
  }

  function clearQuoteForm() {
    ['qClient','qDesc','qPrice'].forEach(id => document.getElementById(id).value = '');
    showQuoteForm();
  }

  function copyQuote() {
    const text = document.getElementById('quotePreview').innerText;
    navigator.clipboard.writeText(text).then(() => showToast('✓ הועתק!')).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
      showToast('✓ הועתק!');
    });
  }

  // ── MODALS ──
  function openProjectModal() { clearProjectForm(); document.getElementById('projectOverlay').classList.add('open'); }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }
  function handleOverlayClick(e, id) { if (e.target === document.getElementById(id)) closeModal(id); }

  // ── HELPERS ──
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  function shake(id) {
    const el = document.getElementById(id);
    el.style.borderColor = 'var(--red)';
    setTimeout(() => el.style.borderColor = '', 1200);
  }

  function escHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal('projectOverlay');
  });

  // INIT
  renderDashboard();
</script>
</body>
</html>
