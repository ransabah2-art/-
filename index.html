<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NMR Performance | לוח בקרה</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f0f0f;
            --panel-dark: #1e1e1e;
            --accent-orange: #f39c12;
            --primary-blue: #2980b9;
            --text-light: #e0e0e0;
            --danger: #c0392b;
        }

        body {
            font-family: 'Assistant', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0; padding: 0;
        }

        /* סרגל כלים עליון לרוחב */
        nav {
            background: #000;
            border-bottom: 2px solid var(--accent-orange);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            height: 70px;
            position: sticky; top: 0; z-index: 1000;
        }

        .logo-box { display: flex; flex-direction: column; }
        .logo-main { font-size: 20px; font-weight: 800; color: white; }
        .logo-sub { font-size: 11px; color: var(--accent-orange); font-weight: 600; }

        .nav-links { display: flex; gap: 20px; }
        .nav-item {
            color: #bbb; text-decoration: none; font-weight: 600;
            padding: 10px 15px; border-radius: 5px; cursor: pointer; transition: 0.3s;
        }
        .nav-item:hover, .nav-item.active {
            color: white; background: rgba(243, 156, 18, 0.2);
        }

        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }

        .tab-content { display: none; animation: fadeIn 0.4s; }
        .tab-content.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* כרטיסיות ועיצוב טפסים */
        .card {
            background: var(--panel-dark); padding: 25px;
            border-radius: 12px; border: 1px solid #333; margin-bottom: 20px;
        }

        input, select {
            width: 100%; padding: 12px; margin: 10px 0;
            background: #111; border: 1px solid #444; color: white;
            border-radius: 6px; box-sizing: border-box;
        }

        .btn {
            padding: 12px 20px; border: none; border-radius: 6px;
            cursor: pointer; font-weight: 700; transition: 0.2s;
        }
        .btn-add { background: var(--accent-orange); color: black; width: 100%; margin-top: 10px; }
        .btn-delete { background: var(--danger); color: white; padding: 5px 12px; font-size: 12px; }

        .item-list { margin-top: 20px; }
        .item-row {
            display: flex; justify-content: space-between; align-items: center;
            background: #252525; padding: 15px; margin-bottom: 10px;
            border-radius: 8px; border-right: 4px solid var(--primary-blue);
        }

        h2 { color: var(--accent-orange); border-bottom: 1px solid #333; padding-bottom: 10px; }

    </style>
</head>
<body>

    <nav>
        <div class="logo-box">
            <span class="logo-main">NMR PERFORMANCE</span>
            <span class="logo-sub">בשיתוף מנק"ף (מוף)</span>
        </div>
        <div class="nav-links">
            <div class="nav-item active" onclick="showTab('projects', this)">📁 פרויקטים</div>
            <div class="nav-item" onclick="showTab('contacts', this)">👥 אנשי קשר</div>
            <div class="nav-item" onclick="showTab('quote', this)">✉️ הצעת מחיר</div>
            <div class="nav-item" onclick="showTab('calc', this)">🧮 מחשבון</div>
        </div>
    </nav>

    <div class="container">

        <div id="projects" class="tab-content active">
            <h2>ניהול פרויקטים</h2>
            <div class="card">
                <h3>הוסף פרויקט חדש</h3>
                <input type="text" id="p-name" placeholder="שם הפרויקט">
                <input type="text" id="p-status" placeholder="סטטוס (למשל: בביצוע)">
                <button class="btn btn-add" onclick="addItem('projects', {name: document.getElementById('p-name').value, status: document.getElementById('p-status').value})">שמור פרויקט +</button>
            </div>
            <div id="projects-list" class="item-list">טוען...</div>
        </div>

        <div id="contacts" class="tab-content">
            <h2>אנשי קשר</h2>
            <div class="card">
                <h3>הוסף איש קשר</h3>
                <input type="text" id="c-name" placeholder="שם מלא">
                <input type="text" id="c-phone" placeholder="טלפון">
                <button class="btn btn-add" onclick="addItem('contacts', {name: document.getElementById('c-name').value, phone: document.getElementById('c-phone').value})">הוסף איש קשר +</button>
            </div>
            <div id="contacts-list" class="item-list"></div>
        </div>

        <div id="quote" class="tab-content">
            <h2>הצעת מחיר לוואטסאפ</h2>
            <div class="card">
                <input type="text" id="q-name" placeholder="שם הלקוח">
                <input type="number" id="q-amount" placeholder="סכום לפני מע"מ" oninput="updateVat()">
                <div style="background: #111; padding: 15px; border-radius: 8px; margin: 15px 0;">
                    <p>מע"מ (18%): <span id="vat">0</span> ₪</p>
                    <p><strong>סה"כ: <span id="total" style="color: var(--accent-orange)">0</span> ₪</strong></p>
                </div>
                <button class="btn btn-add" style="background:#25d366;" onclick="sendWA()">שלח בוואטסאפ ✉️</button>
            </div>
        </div>

        <div id="calc" class="tab-content">
            <h2>מחשבון עלויות</h2>
            <div class="card">
                <input type="number" id="calc-sqm" placeholder="כמות מטר רבוע">
                <input type="number" id="calc-price" placeholder="מחיר למטר">
                <button class="btn btn-add" onclick="alert('סהכ: ' + (document.getElementById('calc-sqm').value * document.getElementById('calc-price').value) + ' ₪')">חשב עלות</button>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBb-7PPYP2GFIPMVnMlJRT2U5jBxDsg_vM",
            authDomain: "nmr-projects.firebaseapp.com",
            projectId: "nmr-projects",
            storageBucket: "nmr-projects.appspot.com",
            messagingSenderId: "635398254882",
            appId: "1:635398254882:web:785f7a0b5a3e1458e08d66"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ניווט
        window.showTab = (id, el) => {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        };

        // הוספת נתונים
        window.addItem = async (coll, data) => {
            if(!data.name) return alert("נא למלא שם");
            await addDoc(collection(db, coll), data);
            location.reload();
        };

        // מחיקת נתונים
        window.removeItem = async (coll, id) => {
            if(confirm("למחוק לצמיתות?")) {
                await deleteDoc(doc(db, coll, id));
                location.reload();
            }
        };

        // טעינת רשימות
        async function load() {
            const pSnap = await getDocs(collection(db, "projects"));
            const pList = document.getElementById('projects-list');
            pList.innerHTML = "";
            pSnap.forEach(d => {
                const item = d.data();
                pList.innerHTML += `<div class="item-row"><span>${item.name} (${item.status})</span><button class="btn-delete" onclick="removeItem('projects','${d.id}')">מחק</button></div>`;
            });

            const cSnap = await getDocs(collection(db, "contacts"));
            const cList = document.getElementById('contacts-list');
            cSnap.forEach(d => {
                const item = d.data();
                cList.innerHTML += `<div class="item-row"><span>${item.name} - ${item.phone}</span><button class="btn-delete" onclick="removeItem('contacts','${d.id}')">מחק</button></div>`;
            });
        }

        // חישובי הצעת מחיר
        window.updateVat = () => {
            const amt = parseFloat(document.getElementById('q-amount').value) || 0;
            const v = amt * 0.18;
            document.getElementById('vat').innerText = v.toFixed(2);
            document.getElementById('total').innerText = (amt + v).toFixed(2);
        };

        window.sendWA = () => {
            const name = document.getElementById('q-name').value;
            const tot = document.getElementById('total').innerText;
            window.open(`https://wa.me/?text=${encodeURIComponent("שלום " + name + ", הצעת המחיר מ-NMR היא " + tot + " שח כולל מעמ")}`);
        };

        load();
    </script>
</body>
</html>
