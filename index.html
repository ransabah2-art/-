<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NMR Pro | מערכת ניהול ורווחיות</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0b;
            --panel: #161618;
            --orange: #ff8c00;
            --blue: #007bff;
            --text: #ffffff;
            --gray: #888;
            --success: #2ecc71;
            --danger: #e74c3c;
        }

        body {
            font-family: 'Assistant', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; padding: 0;
            overflow-x: hidden;
        }

        /* Nav Bar - Premium Style */
        nav {
            background: rgba(0,0,0,0.9);
            border-bottom: 1px solid #333;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 50px; height: 80px; position: sticky; top: 0; z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .brand { line-height: 1.1; }
        .brand .main { font-size: 24px; font-weight: 800; color: var(--text); }
        .brand .sub { font-size: 12px; color: var(--orange); font-weight: 600; letter-spacing: 1px; }

        .nav-links { display: flex; gap: 15px; }
        .nav-item {
            padding: 10px 20px; border-radius: 30px; cursor: pointer;
            font-weight: 600; color: var(--gray); transition: 0.3s;
        }
        .nav-item:hover, .nav-item.active { background: var(--orange); color: #000; }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }

        /* Dashboard Stats Cards */
        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px; margin-bottom: 40px;
        }
        .stat-card {
            background: var(--panel); padding: 25px; border-radius: 20px;
            border: 1px solid #333; text-align: center;
        }
        .stat-card h4 { margin: 0; color: var(--gray); font-size: 14px; }
        .stat-card div { font-size: 28px; font-weight: 800; margin-top: 10px; }

        /* Forms & Cards */
        .card {
            background: var(--panel); padding: 30px; border-radius: 24px;
            border: 1px solid #333; margin-bottom: 30px;
        }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        input {
            background: #222; border: 1px solid #444; color: white;
            padding: 15px; border-radius: 12px; font-size: 16px; width: 100%;
            box-sizing: border-box;
        }

        .btn-action {
            background: var(--blue); color: white; border: none; padding: 15px;
            border-radius: 12px; font-weight: 700; width: 100%; cursor: pointer;
            margin-top: 20px; font-size: 18px; transition: 0.3s;
        }
        .btn-action:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,123,255,0.3); }

        /* Projects Table Style */
        .data-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .data-table th { text-align: right; padding: 15px; color: var(--gray); border-bottom: 1px solid #333; }
        .data-table td { padding: 15px; border-bottom: 1px solid #222; }

        .profit-pos { color: var(--success); font-weight: 700; }
        .profit-neg { color: var(--danger); font-weight: 700; }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: slideUp 0.4s ease-out; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>

    <nav>
        <div class="brand">
            <div class="main">NMR PERFORMANCE</div>
            <div class="sub">BY MONKAF (MOF) SYSTEM</div>
        </div>
        <div class="nav-links">
            <div class="nav-item active" onclick="showTab('dashboard', this)">📊 דוחות</div>
            <div class="nav-item" onclick="showTab('projects', this)">📂 פרויקטים</div>
            <div class="nav-item" onclick="showTab('quote', this)">✉️ הצעה</div>
        </div>
    </nav>

    <div class="container">

        <div id="dashboard" class="tab-content active">
            <div class="stats-grid">
                <div class="stat-card"><h4>סה"כ מחזור (מכירה)</h4><div id="stat-sales" style="color: var(--blue);">0 ₪</div></div>
                <div class="stat-card"><h4>סה"כ עלויות קבלן</h4><div id="stat-costs" style="color: var(--danger);">0 ₪</div></div>
                <div class="stat-card"><h4>רווח נקי</h4><div id="stat-profit" style="color: var(--success);">0 ₪</div></div>
            </div>
            <div class="card">
                <h3>פירוט רווחיות פרויקטים</h3>
                <table class="data-table" id="profit-table">
                    <thead>
                        <tr>
                            <th>פרויקט</th>
                            <th>קבלן</th>
                            <th>עלות</th>
                            <th>מכירה</th>
                            <th>רווח/הפסד</th>
                        </tr>
                    </thead>
                    <tbody id="profit-body"></tbody>
                </table>
            </div>
        </div>

        <div id="projects" class="tab-content">
            <div class="card">
                <h3>יצירת פרויקט חדש</h3>
                <div class="form-grid">
                    <input type="text" id="p-name" placeholder="שם הפרויקט">
                    <input type="text" id="p-contractor" placeholder="קבלן מבצע">
                    <input type="number" id="p-cost" placeholder="מחיר עלות (₪)">
                    <input type="number" id="p-price" placeholder="מחיר מכירה (₪)">
                </div>
                <button class="btn-action" style="background: var(--orange); color: black;" onclick="addProject()">צור פרויקט ושמור נתונים +</button>
            </div>
            <div id="full-list" class="card" style="background: transparent; border: none; padding: 0;"></div>
        </div>

        <div id="quote" class="tab-content">
            <div class="card">
                <h3>מחשבון הצעה לוואטסאפ</h3>
                <input type="text" id="q-client" placeholder="שם לקוח">
                <input type="number" id="q-val" placeholder="סכום לפני מע"מ" oninput="calcVAT()">
                <div style="margin: 20px 0; padding: 20px; background: #000; border-radius: 15px;">
                    <p>מע"מ (18%): <span id="q-vat" style="color: var(--orange)">0.00</span> ₪</p>
                    <h2>סה"כ לתשלום: <span id="q-total" style="color: var(--blue)">0.00</span> ₪</h2>
                </div>
                <button class="btn-action" style="background: #25d366;" onclick="sendWA()">שלח הצעה רשמית ✉️</button>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBb-7PPYP2GFIPMVnMlJRT2U5jBxDsg_vM",
            authDomain: "nmr-projects.firebaseapp.com",
            projectId: "nmr-projects",
            storageBucket: "nmr-projects.appspot.com",
            messagingSenderId: "635398254882",
            appId: "1:635398254882:web:785f7a0b5a3e1458e08d66"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.showTab = (id, el) => {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        };

        window.addProject = async () => {
            const data = {
                name: document.getElementById('p-name').value,
                contractor: document.getElementById('p-contractor').value,
                cost: parseFloat(document.getElementById('p-cost').value) || 0,
                price: parseFloat(document.getElementById('p-price').value) || 0,
                date: new Date().toLocaleDateString()
            };
            if(!data.name) return alert("שם פרויקט חובה");
            await addDoc(collection(db, "projects_pro"), data);
            location.reload();
        };

        async function load() {
            const snap = await getDocs(collection(db, "projects_pro"));
            let sales = 0, costs = 0;
            const body = document.getElementById('profit-body');
            const list = document.getElementById('full-list');
            
            snap.forEach(d => {
                const p = d.data();
                sales += p.price; costs += p.cost;
                const profit = p.price - p.cost;
                const profitClass = profit >= 0 ? 'profit-pos' : 'profit-neg';

                body.innerHTML += `
                    <tr>
                        <td>${p.name}</td>
                        <td>${p.contractor}</td>
                        <td>${p.cost.toLocaleString()} ₪</td>
                        <td>${p.price.toLocaleString()} ₪</td>
                        <td class="${profitClass}">${profit.toLocaleString()} ₪</td>
                    </tr>
                `;

                list.innerHTML += `
                    <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
                        <div><strong>${p.name}</strong> | קבלן: ${p.contractor}</div>
                        <button onclick="del('${d.id}')" style="background:var(--danger); border:none; color:white; padding:5px 15px; border-radius:8px; cursor:pointer;">מחק</button>
                    </div>
                `;
            });

            document.getElementById('stat-sales').innerText = sales.toLocaleString() + ' ₪';
            document.getElementById('stat-costs').innerText = costs.toLocaleString() + ' ₪';
            document.getElementById('stat-profit').innerText = (sales - costs).toLocaleString() + ' ₪';
        }

        window.del = async (id) => {
            if(confirm("למחוק?")) { await deleteDoc(doc(db, "projects_pro", id)); location.reload(); }
        }

        window.calcVAT = () => {
            const v = parseFloat(document.getElementById('q-val').value) || 0;
            const vat = v * 0.18;
            document.getElementById('q-vat').innerText = vat.toFixed(2);
            document.getElementById('q-total').innerText = (v + vat).toFixed(2);
        }

        window.sendWA = () => {
            const txt = `הצעה מחברת NMR: עבור ${document.getElementById('q-client').value}, סה"כ לתשלום ${document.getElementById('q-total').innerText} ש"ח כולל מע"מ.`;
            window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`);
        }

        load();
    </script>
</body>
</html>
