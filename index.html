<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NMR - ניהול פרויקטים</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://unpkg.com/docx@7.1.0/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 10px; direction: rtl; background-color: #fff; color: #000; }
        .container { max-width: 100%; margin: auto; }
        h2 { text-align: center; font-size: 20px; margin-bottom: 10px; }
        input, button, select { padding: 12px; margin: 5px 0; width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { background-color: #4CAF50; color: white; border: none; font-weight: bold; }
        
        /* מחשבון בעיצוב נקי */
        .calc-box { border: 1px solid #ddd; padding: 10px; margin: 15px 0; background: #f9f9f9; }
        .calc-display { background: #fff; border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 20px; margin-bottom: 10px; min-height: 30px; }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        .calc-btn { background-color: #eee; color: #000; padding: 15px; font-size: 18px; width: auto; margin: 0; }
        
        /* טבלה נקייה */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; }
        .actions { display: flex; gap: 4px; justify-content: center; }
        .btn-small { width: auto; padding: 5px 8px; font-size: 12px; margin: 0; }
        .btn-red { background-color: #f44336; }
        .btn-blue { background-color: #2196F3; }
        .btn-orange { background-color: #ff9800; }
    </style>
</head>
<body>

<div class="container" id="app">טוען מערכת...</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBb-7PPYP2GFIPMVnMlJRT2U5jBxDsg_vM",
        authDomain: "nmr-projects.firebaseapp.com",
        projectId: "nmr-projects",
        appId: "1:780228662939:web:48931d5bccaa568b66583e"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    firebase.auth().onAuthStateChanged(user => {
        if(user) renderDashboard();
        else renderLogin();
    });

    function renderLogin() {
        document.getElementById('app').innerHTML = `
            <h2>כניסה למערכת</h2>
            <input type="email" id="email" placeholder="אימייל">
            <input type="password" id="password" placeholder="סיסמה">
            <button onclick="login()">התחבר</button>
        `;
    }

    async function login() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        try { await firebase.auth().signInWithEmailAndPassword(email, pass); } catch(e) { alert("שגיאה בפרטים"); }
    }

    function renderDashboard() {
        document.getElementById('app').innerHTML = `
            <h2>NMR - ניהול פרויקטים</h2>
            
            <input type="text" id="pName" placeholder="שם הפרויקט">
            <div style="display:flex; gap:5px;">
                <input type="number" id="pCost" placeholder="עלות">
                <input type="number" id="pPrice" placeholder="מחיר">
            </div>
            <button onclick="addProject()">+ שמור פרויקט</button>
            
            <div class="calc-box">
                <div class="calc-display" id="calcDisplay">0</div>
                <div class="calc-grid">
                    <button class="calc-btn" onclick="calcInput('7')">7</button>
                    <button class="calc-btn" onclick="calcInput('8')">8</button>
                    <button class="calc-btn" onclick="calcInput('9')">9</button>
                    <button class="calc-btn" onclick="calcInput('/')">/</button>
                    <button class="calc-btn" onclick="calcInput('4')">4</button>
                    <button class="calc-btn" onclick="calcInput('5')">5</button>
                    <button class="calc-btn" onclick="calcInput('6')">6</button>
                    <button class="calc-btn" onclick="calcInput('*')">×</button>
                    <button class="calc-btn" onclick="calcInput('1')">1</button>
                    <button class="calc-btn" onclick="calcInput('2')">2</button>
                    <button class="calc-btn" onclick="calcInput('3')">3</button>
                    <button class="calc-btn" onclick="calcInput('-')">-</button>
                    <button class="calc-btn" onclick="calcInput('0')">0</button>
                    <button class="calc-btn" onclick="calcClear()">C</button>
                    <button class="calc-btn" style="background:#4CAF50; color:#fff;" onclick="calcEquals()">=</button>
                    <button class="calc-btn" onclick="calcInput('+')">+</button>
                </div>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th>שם</th>
                        <th>מחיר</th>
                        <th>רווח</th>
                        <th>פעולות</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
            <button onclick="firebase.auth().signOut()" style="background:gray; margin-top:30px;">התנתק</button>
        `;
        loadProjects();
    }

    // מחשבון
    let currentCalc = "";
    function calcInput(val) { currentCalc += val; document.getElementById('calcDisplay').innerText = currentCalc; }
    function calcClear() { currentCalc = ""; document.getElementById('calcDisplay').innerText = "0"; }
    function calcEquals() { try { currentCalc = eval(currentCalc).toString(); document.getElementById('calcDisplay').innerText = currentCalc; } catch(e) { calcClear(); } }

    async function addProject() {
        const name = document.getElementById('pName').value;
        const cost = Number(document.getElementById('pCost').value);
        const price = Number(document.getElementById('pPrice').value);
        if (name && price) {
            await db.collection("projects").add({
                name, cost, price, profit: price - cost, status: 'בתהליך', date: new Date()
            });
            renderDashboard();
        }
    }

    async function loadProjects() {
        const snapshot = await db.collection("projects").orderBy("date", "desc").get();
        const body = document.getElementById('tableBody');
        body.innerHTML = "";
        snapshot.forEach(doc => {
            const p = doc.data();
            const profit = p.price - (p.cost || 0);
            body.innerHTML += `
                <tr>
                    <td>${p.name}</td>
                    <td>${p.price}</td>
                    <td style="color:${profit >= 0 ? 'green' : 'red'}">${profit}</td>
                    <td class="actions">
                        <button class="btn-small btn-red" onclick="deleteP('${doc.id}')">X</button>
                        <button class="btn-small btn-orange" onclick="exportWord('${p.name}', ${p.price})">W</button>
                    </td>
                </tr>
            `;
        });
    }

    async function deleteP(id) { if(confirm("למחוק?")) { await db.collection("projects").doc(id).delete(); loadProjects(); } }

    function exportWord(name, price) {
        const doc = new docx.Document({
            sections: [{
                children: [
                    new docx.Paragraph({ text: "NMR הצעת מחיר", heading: docx.HeadingLevel.HEADING_1 }),
                    new docx.Paragraph({ text: `לכבוד: ${name}` }),
                    new docx.Paragraph({ text: `סה"כ לתשלום: ${price} ₪` })
                ],
            }],
        });
        docx.Packer.toBlob(doc).then(blob => saveAs(blob, `NMR_${name}.docx`));
    }
</script>
</body>
</html>
