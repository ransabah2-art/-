<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>נ.מ.ר - ניהול מתקדם</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        :root {
            --bg: #0f1117; --surface: #1a1d27; --border: #2e3147;
            --accent: #f5a623; --text: #eef0f8; --text-muted: #7b7f9e;
            --green: #27c985; --red: #f26464;
        }
        body { font-family: 'Heebo', sans-serif; background: var(--bg); color: var(--text); margin: 0; direction: rtl; }
        
        /* Navigation */
        nav { background: var(--surface); padding: 10px 20px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); sticky; top: 0; z-index: 1000; }
        .nav-tabs { display: flex; gap: 15px; }
        .nav-tab { cursor: pointer; padding: 5px 10px; color: var(--text-muted); font-weight: 600; }
        .nav-tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }

        main { padding: 20px; max-width: 1000px; margin: 0 auto; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        
        /* Calculator Mini Style */
        .calc-mini { position: fixed; left: 20px; bottom: 80px; width: 200px; background: var(--surface); border: 1px solid var(--accent); padding: 10px; border-radius: 10px; z-index: 100; }
        .calc-mini input { width: 100%; background: #000; color: var(--accent); border: none; padding: 5px; text-align: left; margin-bottom: 5px; }

        /* Tables */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: right; border-bottom: 1px solid var(--border); }
        .profit { color: var(--green); }
        .loss { color: var(--red); }

        .hidden { display: none !important; }
        .fab-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
        .btn { padding: 10px 20px; border-radius: 25px; border: none; font-weight: 700; cursor: pointer; }
        .btn-main { background: var(--accent); color: #000; }
        
        /* Remove the green dot bug */
        .green-dot-fix { display: none; }
    </style>
</head>
<body>

<nav>
    <div class="logo">🏗️ <strong>נ.מ.ר פרויקטים</strong></div>
    <div class="nav-tabs">
        <div class="nav-tab active" onclick="showPage('dash')">דשבורד</div>
        <div class="nav-tab" onclick="showPage('projects')">פרויקטים</div>
        <div class="nav-tab" onclick="showPage('contacts')">אנשי קשר</div>
        <div class="nav-tab admin-only" onclick="showPage('finance')">כספים 💰</div>
    </div>
</nav>

<main>
    <section id="page-dash">
        <div class="card">
            <h2>סיכום רווחים חודשי (מנהל בלבד)</h2>
            <div class="admin-only">
                <table id="monthly-summary">
                    <thead><tr><th>חודש</th><th>הכנסות</th><th>הוצאות</th><th>רווח נקי</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
            <p class="partner-msg hidden">אין לך הרשאה לצפות בנתונים כספיים.</p>
        </div>
    </section>

    <section id="page-contacts" class="hidden">
        <div class="card">
            <h3>אנשי קשר וקבלנים</h3>
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <input type="text" id="conName" placeholder="שם הקבלן/ספק">
                <input type="text" id="conPhone" placeholder="טלפון">
                <button class="btn btn-main" onclick="addContact()">הוסף</button>
            </div>
            <table id="contactsTable">
                <thead><tr><th>שם</th><th>טלפון</th><th>פעולות</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </section>

    <section id="page-projects" class="hidden">
        <div id="projectList"></div>
    </section>
</main>

<div class="calc-mini">
    <input type="text" id="calcDisplay" readonly value="0">
    <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:5px;">
        <button onclick="calcIn('7')">7</button><button onclick="calcIn('8')">8</button><button onclick="calcIn('9')">9</button><button onclick="calcOp('/')">/</button>
        <button onclick="calcIn('4')">4</button><button onclick="calcIn('5')">5</button><button onclick="calcIn('6')">6</button><button onclick="calcOp('*')">*</button>
        <button onclick="calcIn('1')">1</button><button onclick="calcIn('2')">2</button><button onclick="calcIn('3')">3</button><button onclick="calcOp('-')">-</button>
        <button onclick="calcIn('0')">0</button><button onclick="clearCalc()">C</button><button onclick="doCalc()" style="grid-column: span 2; background:var(--accent);">=</button>
    </div>
</div>

<div class="fab-container">
    <button class="btn btn-main" onclick="openProjectModal()">+ פרויקט חדש</button>
</div>

<script>
    // --- הגדרות משתמש והרשאות ---
    // כאן אתה מגדיר מי אתה. במציאות נשתמש ב-Firebase Auth
    const USER_ROLE = "admin"; // שנה ל-"partner" כדי לבדוק את הגישה המוגבלת

    function checkPermissions() {
        if (USER_ROLE === "partner") {
            document.querySelectorAll('.admin-only').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.partner-msg').forEach(el => el.classList.remove('hidden'));
        }
    }

    // --- מחשבון ---
    let currentExp = "";
    function calcIn(v) { currentExp += v; document.getElementById('calcDisplay').value = currentExp; }
    function calcOp(o) { currentExp += " " + o + " "; document.getElementById('calcDisplay').value = currentExp; }
    function clearCalc() { currentExp = ""; document.getElementById('calcDisplay').value = "0"; }
    function doCalc() { 
        try { currentExp = eval(currentExp).toString(); document.getElementById('calcDisplay').value = currentExp; }
        catch { document.getElementById('calcDisplay').value = "Error"; currentExp = ""; }
    }

    // --- ניווט ---
    function showPage(id) {
        document.querySelectorAll('main section').forEach(s => s.classList.add('hidden'));
        document.getElementById('page-' + id).classList.remove('hidden');
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        checkPermissions();
    }

    // --- Firebase Logic (סימולציה של פונקציות) ---
    // הערה: יש להשתמש ב-config שלך מהצילום מסך
    const p1 = "AIzaSyBb-7PPYP2";
    const p2 = "GFIPMVnMlJRT2U5jBxDsg_vM";
    firebase.initializeApp({ apiKey: p1+p2, projectId: "nmr-projects" });
    const db = firebase.firestore();

    async function addContact() {
        const name = document.getElementById('conName').value;
        const phone = document.getElementById('conPhone').value;
        if(!name || !phone) return;
        await db.collection("contacts").add({ name, phone, addedBy: USER_ROLE });
        document.getElementById('conName').value = '';
        document.getElementById('conPhone').value = '';
        loadContacts();
    }

    async function loadContacts() {
        const snap = await db.collection("contacts").get();
        let html = "";
        snap.forEach(doc => {
            const c = doc.data();
            html += `<tr><td>${c.name}</td><td>${c.phone}</td><td><button onclick="deleteDoc('contacts','${doc.id}')">🗑️</button></td></tr>`;
        });
        document.querySelector("#contactsTable tbody").innerHTML = html;
    }

    // הפעלה ראשונית
    checkPermissions();
    loadContacts();
</script>
</body>
</html>
