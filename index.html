<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>N.M.R - Executive Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        :root { --bg: #05070a; --card: #111827; --accent: #00f2ff; --purple: #7000ff; --text: #f3f4f6; --border: rgba(255,255,255,0.1); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Heebo', sans-serif; }
        body { background: var(--bg); color: var(--text); direction: rtl; min-height: 100vh; }

        /* מסך כניסה */
        #auth-screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .auth-card { background: var(--card); padding: 30px; border-radius: 24px; border: 1px solid var(--border); width: 100%; max-width: 380px; text-align: center; }

        /* דשבורד עליון */
        header { padding: 20px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
        .s-card { background: linear-gradient(145deg, #1f2937, #111827); padding: 15px; border-radius: 18px; border: 1px solid var(--border); text-align: center; }
        .s-card h2 { color: var(--accent); font-size: 24px; }

        /* ניווט */
        nav { display: flex; background: #000; padding: 10px; gap: 8px; position: sticky; top: 0; z-index: 100; }
        .tab { flex: 1; padding: 12px; text-align: center; border-radius: 12px; cursor: pointer; background: #1f2937; color: #9ca3af; font-size: 14px; font-weight: bold; }
        .tab.active { background: var(--accent); color: #000; }

        /* תוכן עמודים */
        main { padding: 15px; max-width: 600px; margin: 0 auto; padding-bottom: 100px; }
        .page { display: none; }
        .page.active { display: block; }
        .glass { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid var(--border); margin-bottom: 15px; }
        
        input, select { width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px; border: 1px solid var(--border); background: #030712; color: white; font-size: 16px; }
        .btn-main { width: 100%; padding: 16px; background: var(--accent); border: none; border-radius: 12px; font-weight: 900; cursor: pointer; margin-top: 10px; }

        /* פרויקטים */
        .p-card { background: var(--card); padding: 15px; border-radius: 15px; margin-bottom: 10px; border-right: 4px solid var(--accent); position: relative; }
        .p-img { width: 100%; height: 150px; object-fit: cover; border-radius: 10px; margin-top: 10px; display: none; }

        /* AI Chat */
        #chat-box { height: 300px; overflow-y: auto; background: #030712; border-radius: 12px; padding: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--border); }
        .msg { padding: 10px 14px; border-radius: 15px; max-width: 85%; font-size: 14px; }
        .msg.u { background: var(--purple); align-self: flex-start; }
        .msg.a { background: #374151; align-self: flex-end; }

        /* מחשבון צף */
        #calc-btn { position: fixed; left: 20px; bottom: 30px; width: 60px; height: 60px; background: var(--purple); border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 28px; z-index: 1000; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        #calc-ui { display: none; position: fixed; left: 20px; bottom: 100px; width: 280px; background: #111827; border: 2px solid var(--purple); border-radius: 20px; padding: 15px; z-index: 1000; }
        .c-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .c-btn { background: #1f2937; border: none; color: white; padding: 15px; font-size: 18px; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-card">
            <h1 style="color:var(--accent); margin-bottom:20px;">N.M.R LOGIN</h1>
            <input type="email" id="login-email" placeholder="אימייל">
            <input type="password" id="login-pass" placeholder="סיסמה">
            <button class="btn-main" onclick="handleAuth()">כניסה למערכת</button>
        </div>
    </div>

    <div id="app-body" style="display:none;">
        <header>
            <h2 style="font-weight:900; color:var(--accent);">N.M.R</h2>
            <button onclick="firebase.auth().signOut()" style="background:none; border:none; color:#ff4b5c;">יציאה</button>
        </header>

        <div class="stats">
            <div class="s-card"><p>פרויקטים</p><h2 id="stat-count">0</h2></div>
            <div class="s-card"><p>רווח (₪)</p><h2 id="stat-profit">0</h2></div>
        </div>

        <nav>
            <div class="tab active" onclick="showP('dash', this)">🏠 ראשי</div>
            <div class="tab" onclick="showP('list', this)">🏗️ ניהול</div>
            <div class="tab" onclick="showP('ai', this)">🤖 יועץ</div>
        </nav>

        <main>
            <div id="pg-dash" class="page active">
                <div class="glass">
                    <h3>פרויקט חדש</h3>
                    <input type="text" id="in-t" placeholder="שם הפרויקט">
                    <input type="text" id="in-c" placeholder="לקוח">
                    <input type="number" id="in-p" placeholder="רווח משוער (₪)">
                    <label style="font-size:12px; color:#9ca3af;">צילום/תמונה:</label>
                    <input type="file" id="in-img" accept="image/*">
                    <select id="in-s">
                        <option value="בביצוע">בביצוע</option>
                        <option value="הצעה">הצעת מחיר</option>
                        <option value="הושלם">הושלם</option>
                    </select>
                    <button class="btn-main" onclick="saveProject()">שמור פרויקט</button>
                </div>
            </div>

            <div id="pg-list" class="page">
                <div id="list-container"></div>
            </div>

            <div id="pg-ai" class="page">
                <div id="chat-box"></div>
                <div style="display:flex; gap:8px;">
                    <input type="text" id="ai-msg" placeholder="שאל אותי..." style="margin:0;">
                    <button onclick="askAI()" style="background:var(--accent); border:none; width:55px; border-radius:12px;">🚀</button>
                </div>
            </div>
        </main>
    </div>

    <div id="calc-btn" onclick="toggleCalc()">🧮</div>
    <div id="calc-ui">
        <div id="c-res" style="background:#000; padding:10px; border-radius:8px; margin-bottom:10px; text-align:left; font-size:22px; color:var(--accent);">0</div>
        <div class="c-grid">
            <button class="c-btn" onclick="cClear()">C</button>
            <button class="c-btn" onclick="cPress('/')">/</button>
            <button class="c-btn" onclick="cPress('*')">×</button>
            <button class="c-btn" onclick="cPress('-')">-</button>
            <button class="c-btn" onclick="cPress('7')">7</button>
            <button class="c-btn" onclick="cPress('8')">8</button>
            <button class="c-btn" onclick="cPress('9')">9</button>
            <button class="c-btn" onclick="cPress('+')">+</button>
            <button class="c-btn" onclick="cSolve()" style="background:var(--accent); color:#000; grid-row: span 2;">=</button>
            <button class="c-btn" onclick="cPress('4')">4</button>
            <button class="c-btn" onclick="cPress('5')">5</button>
            <button class="c-btn" onclick="cPress('6')">6</button>
            <button class="c-btn" onclick="cPress('1')">1</button>
            <button class="c-btn" onclick="cPress('2')">2</button>
            <button class="c-btn" onclick="cPress('3')">3</button>
            <button class="c-btn" onclick="cPress('0')">0</button>
        </div>
    </div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyBb-7PPYP2GFIPMVnMlJRT2U5jBxDsg_vM", authDomain: "nmr-projects.firebaseapp.com", projectId: "nmr-projects", storageBucket: "nmr-projects.appspot.com", messagingSenderId: "780228662939", appId: "1:780228662939:web:48931d5bccaa568b66583e" };
    const GEMINI_KEY = "AIzaSyAUK-zi5ASJ0KfjbWm9ZAMaaoFhqX_OP58";

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ניהול כניסה
    auth.onAuthStateChanged(user => {
        document.getElementById('auth-screen').style.display = user ? 'none' : 'flex';
        document.getElementById('app-body').style.display = user ? 'block' : 'none';
        if(user) loadData();
    });

    async function handleAuth() {
        const e = document.getElementById('login-email').value, p = document.getElementById('login-pass').value;
        try { await auth.signInWithEmailAndPassword(e, p); } catch(err) { alert("שגיאת כניסה: " + err.message); }
    }

    function showP(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('pg-'+id).classList.add('active');
        el.classList.add('active');
    }

    // שמירת פרויקט
    async function saveProject() {
        const title = document.getElementById('in-t').value;
        const profit = Number(document.getElementById('in-p').value) || 0;
        if(!title) return alert("שם פרויקט חובה");

        await db.collection('projs').add({
            title, client: document.getElementById('in-c').value,
            profit, status: document.getElementById('in-s').value,
            time: Date.now()
        });
        alert("הפרויקט נשמר!");
        document.getElementById('in-t').value = '';
        document.getElementById('in-p').value = '';
    }

    function loadData() {
        db.collection('projs').orderBy('time', 'desc').onSnapshot(snap => {
            const container = document.getElementById('list-container');
            let count = 0, profit = 0;
            container.innerHTML = '';
            snap.forEach(doc => {
                const p = doc.data();
                count++; profit += p.profit;
                container.innerHTML += `
                    <div class="p-card">
                        <span style="float:left; color:var(--accent);">₪${p.profit}</span>
                        <strong>${p.title}</strong><br>
                        <small>${p.client} | ${p.status}</small>
                    </div>`;
            });
            document.getElementById('stat-count').innerText = count;
            document.getElementById('stat-profit').innerText = profit.toLocaleString();
        });
    }

    // AI
    async function askAI() {
        const inpt = document.getElementById('ai-msg'), box = document.getElementById('chat-box');
        if(!inpt.value) return;
        const msg = inpt.value; inpt.value = '';
        box.innerHTML += `<div class="msg u">${msg}</div>`;
        
        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: "ענה בעברית קצרה מאוד: " + msg }] }] })
            });
            const data = await res.json();
            box.innerHTML += `<div class="msg a">${data.candidates[0].content.parts[0].text}</div>`;
        } catch(e) { box.innerHTML += `<div class="msg a" style="color:red;">שגיאת תקשורת</div>`; }
        box.scrollTop = box.scrollHeight;
    }

    // מחשבון
    let cur = "0";
    function toggleCalc() { const ui = document.getElementById('calc-ui'); ui.style.display = ui.style.display==='block'?'none':'block'; }
    function cPress(v) { if(cur==="0") cur=v; else cur+=v; document.getElementById('c-res').innerText=cur; }
    function cClear() { cur="0"; document.getElementById('c-res').innerText="0"; }
    function cSolve() { try { cur=eval(cur).toString(); document.getElementById('c-res').innerText=cur; } catch(e){ cur="Error"; } }
</script>
</body>
</html>
