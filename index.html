<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>נ.מ.ר ביצוע פרויקטים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #222536;
    --border: #2e3147;
    --accent: #f5a623;
    --accent2: #e8873a;
    --text: #eef0f8;
    --text-muted: #7b7f9e;
    --green: #27c985;
    --blue: #4c8ef7;
    --red: #f26464;
    --yellow: #f5c842;
    --radius: 16px;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Heebo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; direction: rtl; overflow-x: hidden; }

  /* HEADER */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo { display: flex; align-items: center; gap: 8px; }
  .logo-icon { width: 34px; height: 34px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
  .logo-text { font-size: 15px; font-weight: 800; letter-spacing: -0.3px; line-height: 1.2; }
  .logo-text span { color: var(--accent); }

  /* TABS */
  .tabs {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    gap: 4px;
  }
  .tab {
    padding: 12px 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.18s;
    white-space: nowrap;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* BUTTONS */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 16px;
    border-radius: var(--radius-sm);
    border: none;
    font-family: 'Heebo', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s ease;
  }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #111; }
  .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-sm { padding: 7px 12px; font-size: 12px; }

  /* MAIN */
  main { padding: 20px 16px 120px; max-width: 640px; margin: 0 auto; }

  /* PAGE */
  .page { display: none; }
  .page.active { display: block; }

  /* STATS */
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 10px; text-align: center; }
  .stat-num { font-size: 24px; font-weight: 800; color: var(--accent); line-height: 1; margin-bottom: 4px; }
  .stat-label { font-size: 10px; color: var(--text-muted); font-weight: 500; }

  /* DASHBOARD */
  .status-breakdown { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 20px; }
  .status-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .status-row-bar-wrap { flex: 1; height: 6px; background: var(--surface2); border-radius: 6px; overflow: hidden; }
  .status-row-bar { height: 100%; border-radius: 6px; transition: width 0.5s ease; }

  /* PROJECTS */
  .projects-list { display: flex; flex-direction: column; gap: 10px; }
  .project-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    cursor: pointer;
  }
  .progress-bar-bg { height: 5px; background: var(--surface2); border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .progress-bar { height: 100%; background: var(--accent); transition: width 0.4s; }

  .badge { padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; }
  .badge-active { background: rgba(39,201,133,0.15); color: var(--green); }

  /* QUOTE PREVIEW */
  .quote-preview { background: #fff; color: #1a1a1a; border-radius: var(--radius); padding: 24px; margin-top: 18px; direction: rtl; }
  .quote-price-row { background: #f8f8f8; border-radius: 10px; padding: 14px 16px; display: flex; justify-content: space-between; margin-top: 15px; }

  /* FAB - FIXED AND CLEANED */
  .fab-row {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 99;
    padding: 0 16px;
    background: transparent; /* הסרת כל רקע אפשרי */
  }
  .fab {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 22px;
    border-radius: 30px;
    border: none;
    font-family: 'Heebo', sans-serif;
    font-size: 14px;
    font-weight: 700;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    cursor: pointer;
  }
  .fab-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #111; }
  .fab-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }

  /* TOAST - ADJUSTED POSITION */
  .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--green); color: #0d2318; font-weight: 700; padding: 12px 24px; border-radius: 30px; z-index: 1000; transition: transform 0.3s; }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* MODAL */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; display: none; align-items: flex-end; }
  .overlay.open { display: flex; }
  .modal { background: var(--surface); width: 100%; border-radius: 24px 24px 0 0; padding: 24px 20px 40px; }
  
  input, select, textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; color: var(--text); margin-bottom: 15px; font-family: inherit; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🏗️</div>
    <div class="logo-text">נ.מ.ר <span>ביצוע פרויקטים</span></div>
  </div>
</header>

<div class="tabs">
  <div class="tab active" id="tab-dashboard" onclick="switchTab('dashboard')">📊 דשבורד</div>
  <div class="tab" id="tab-projects" onclick="switchTab('projects')">📋 פרויקטים</div>
  <div class="tab" id="tab-quote" onclick="switchTab('quote')">📄 הצעת מחיר</div>
</div>

<main>
  <div class="page active" id="page-dashboard">
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num" id="dash-total">0</div><div class="stat-label">סה״כ</div></div>
      <div class="stat-card"><div class="stat-num" id="dash-active" style="color:var(--green)">0</div><div class="stat-label">פעילים</div></div>
      <div class="stat-card"><div class="stat-num" id="dash-done" style="color:var(--blue)">0</div><div class="stat-label">הושלמו</div></div>
    </div>
    <div class="status-breakdown" id="status-bars"></div>
  </div>

  <div class="page" id="page-projects">
    <div class="projects-list" id="projectsList"></div>
  </div>

  <div class="page" id="page-quote">
    <div id="quoteForm">
      <label>שם לקוח</label>
      <input type="text" id="qClient">
      <label>תיאור עבודה</label>
      <textarea id="qDesc"></textarea>
      <label>מחיר לפני מע״מ (₪)</label>
      <input type="number" id="qPrice">
      <button class="btn btn-primary" style="width:100%" onclick="generateQuote()">צור הצעה</button>
    </div>
    <div id="quotePreviewWrap" style="display:none">
      <div class="quote-preview" id="quotePreview"></div>
      <button class="btn btn-primary" style="width:100%; margin-top:15px" onclick="copyQuote()">📋 העתק ללקוח</button>
      <button class="btn btn-ghost" style="width:100%; margin-top:10px" onclick="showQuoteForm()">ערוך</button>
    </div>
  </div>
</main>

<div class="fab-row" id="fabRow">
  <button class="fab fab-secondary" onclick="switchTab('quote')">📄 הצעה</button>
  <button class="fab fab-primary" onclick="openProjectModal()">＋ פרויקט</button>
</div>

<div class="overlay" id="projectOverlay">
  <div class="modal">
    <h3 style="margin-bottom:20px">פרויקט חדש</h3>
    <input type="text" id="projName" placeholder="שם הפרויקט">
    <select id="projStatus">
      <option value="active">פעיל</option>
      <option value="pending">ממתין</option>
      <option value="done">הושלם</option>
    </select>
    <input type="number" id="projProgress" placeholder="% התקדמות" value="0">
    <button class="btn btn-primary" style="width:100%" onclick="addProject()">שמור פרויקט</button>
    <button class="btn btn-ghost" style="width:100%; margin-top:10px" onclick="closeModal()">ביטול</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let projects = JSON.parse(localStorage.getItem('nmr_projects') || '[]');

  function save() { localStorage.setItem('nmr_projects', JSON.stringify(projects)); }

  function switchTab(tab) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('page-' + tab).classList.add('active');
    document.getElementById('tab-' + tab).classList.add('active');
    document.getElementById('fabRow').style.display = (tab === 'quote') ? 'none' : 'flex';
    if(tab === 'dashboard') renderDashboard();
    if(tab === 'projects') renderProjects();
  }

  function renderDashboard() {
    const total = projects.length;
    document.getElementById('dash-total').textContent = total;
    document.getElementById('dash-active').textContent = projects.filter(p => p.status === 'active').length;
    document.getElementById('dash-done').textContent = projects.filter(p => p.status === 'done').length;
  }

  function renderProjects() {
    const list = document.getElementById('projectsList');
    if (projects.length === 0) {
      list.innerHTML = '<p style="text-align:center; color:var(--text-muted)">אין פרויקטים כרגע</p>';
      return;
    }
    list.innerHTML = projects.map((p, i) => `
      <div class="project-card">
        <div style="display:flex; justify-content:space-between">
          <strong>${p.name}</strong>
          <span class="badge badge-active">${p.status}</span>
        </div>
        <div class="progress-bar-bg"><div class="progress-bar" style="width:${p.progress}%"></div></div>
        <button onclick="deleteProject(${i})" style="background:none; border:none; color:var(--red); font-size:12px; margin-top:10px">מחק פרויקט</button>
      </div>
    `).join('');
  }

  function openProjectModal() { document.getElementById('projectOverlay').classList.add('open'); }
  function closeModal() { document.getElementById('projectOverlay').classList.remove('open'); }

  function addProject() {
    const name = document.getElementById('projName').value;
    if(!name) return;
    projects.push({
      name,
      status: document.getElementById('projStatus').value,
      progress: document.getElementById('projProgress').value
    });
    save(); closeModal(); renderProjects(); showToast('הפרויקט נוסף!');
  }

  function deleteProject(i) {
    if(confirm('למחוק?')) { projects.splice(i,1); save(); renderProjects(); }
  }

  function generateQuote() {
    const client = document.getElementById('qClient').value;
    const price = document.getElementById('qPrice').value;
    if(!client || !price) return;
    
    const vat = Math.round(price * 0.18);
    const total = Math.round(price * 1.18);

    document.getElementById('quotePreview').innerHTML = `
      <h2 style="color:#e07b1a">נ.מ.ר ביצוע פרויקטים</h2>
      <p>לכבוד: <strong>${client}</strong></p>
      <p style="margin-top:10px">${document.getElementById('qDesc').value}</p>
      <div class="quote-price-row">
        <span>סה"כ (כולל מע"מ):</span>
        <strong>₪${total.toLocaleString()}</strong>
      </div>
    `;
    document.getElementById('quoteForm').style.display = 'none';
    document.getElementById('quotePreviewWrap').style.display = 'block';
  }

  function showQuoteForm() {
    document.getElementById('quoteForm').style.display = 'block';
    document.getElementById('quotePreviewWrap').style.display = 'none';
  }

  function copyQuote() {
    const text = document.getElementById('quotePreview').innerText;
    navigator.clipboard.writeText(text);
    showToast('ההצעה הועתקה!');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  function escHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  renderDashboard();
</script>
</body>
</html>
